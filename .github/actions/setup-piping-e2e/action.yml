name: Setup Piping E2E
description: Pinned source-mode desktop browser dependencies
inputs:
  build-only:
    description: Build engines without installing browser dependencies (main warmer)
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Setup pinned Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
        targets: wasm32-unknown-unknown

    - name: Cache pinned wasm-bindgen CLI
      id: wasm-bindgen-cache
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/wasm-bindgen
        key: ${{ runner.os }}-wasm-bindgen-cli-0.2.123

    - name: Install pinned wasm-bindgen CLI
      if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install wasm-bindgen-cli --version 0.2.123 --locked

    - name: Cache Cargo registry and WASM target
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/
          core/model_operations/operation_applier/target
        key: ${{ runner.os }}-rust-1.97.1-${{ hashFiles('core/model_operations/operation_applier/Cargo.lock', 'core/loads/self_weight_wasm/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-1.97.1-

    - name: Install project dependencies
      shell: bash
      run: npm ci
      working-directory: .

    # The desktop build is deliberately offline. Populate the complete
    # locked graphs, including host/transitive dependencies, before building.
    - name: Fetch complete locked WASM dependency graphs
      shell: bash
      run: |
        cargo fetch --locked --manifest-path core/model_operations/operation_applier/Cargo.toml
        cargo fetch --locked --manifest-path core/loads/self_weight_wasm/Cargo.toml
      working-directory: .

    - name: Compute exact desktop WASM output key
      continue-on-error: true
      id: engine-key
      shell: bash
      run: python3 tools/software_workflow/wasm_cache.py key

    - name: Restore exact desktop WASM outputs
      id: engine-cache
      if: steps.engine-key.outputs.key != ''
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        path: |
          apps/desktop/public/wasm-engine
          apps/desktop/public/self-weight-engine
          apps/desktop/public/wasm-cache.json
        key: ${{ steps.engine-key.outputs.key }}

    - name: Verify restored desktop WASM outputs
      continue-on-error: true
      id: engine-verified
      shell: bash
      env:
        ENGINE_KEY: ${{ steps.engine-key.outputs.key }}
      run: python3 tools/software_workflow/wasm_cache.py verify --key "$ENGINE_KEY"

    - name: Build desktop WASM engine
      if: steps.engine-verified.outputs.valid != 'true'
      shell: bash
      run: |
        # Partial restores must not let the build script skip an engine based
        # on its stamp while a generated declaration or glue file is missing.
        rm -rf apps/desktop/public/wasm-engine apps/desktop/public/self-weight-engine
        npm run build:wasm:desktop
      working-directory: .

    - name: Record complete desktop WASM outputs
      continue-on-error: true
      id: engine-record
      if: steps.engine-verified.outputs.valid != 'true' && steps.engine-key.outputs.key != ''
      shell: bash
      env:
        ENGINE_KEY: ${{ steps.engine-key.outputs.key }}
      run: python3 tools/software_workflow/wasm_cache.py record --key "$ENGINE_KEY"

    - name: Save exact desktop WASM outputs
      if: steps.engine-record.outputs.valid == 'true' && steps.engine-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: |
          apps/desktop/public/wasm-engine
          apps/desktop/public/self-weight-engine
          apps/desktop/public/wasm-cache.json
        key: ${{ steps.engine-key.outputs.key }}

    - name: Resolve pinned Playwright version
      if: inputs.build-only != 'true'
      id: playwright-version
      shell: bash
      run: |
        set -euo pipefail
        version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
        test -n "${version}"
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
      working-directory: .

    - name: Cache Playwright Chromium
      if: inputs.build-only != 'true'
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    - name: Configure canonical Ubuntu package sources
      if: inputs.build-only != 'true'
      shell: bash
      run: |
        set -euo pipefail
        source /etc/os-release
        test -n "${VERSION_CODENAME}"
        test -f /usr/share/keyrings/ubuntu-archive-keyring.gpg
        # Explicitly attempt immutable index URLs; APT can still fall back to
        # stable filenames. Signature, hash, and expiry checks remain enabled.
        sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<EOF
        Types: deb
        URIs: https://archive.ubuntu.com/ubuntu/
        Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-backports
        Components: main restricted universe multiverse
        By-Hash: force
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

        Types: deb
        URIs: https://security.ubuntu.com/ubuntu/
        Suites: ${VERSION_CODENAME}-security
        Components: main restricted universe multiverse
        By-Hash: force
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
        EOF
        echo 'Rendered Ubuntu package sources:'
        cat /etc/apt/sources.list.d/ubuntu.sources
        echo 'Explicit APT acquisition configuration (unset values are omitted; defaults may apply):'
        apt-config shell BY_HASH Acquire::By-Hash PACKAGES_BY_HASH Acquire::IndexTargets::deb::Packages::By-Hash DEP11_BY_HASH Acquire::IndexTargets::deb::DEP-11::By-Hash HTTP_NO_CACHE Acquire::http::No-Cache HTTPS_NO_CACHE Acquire::https::No-Cache
        apt-config --version

    - name: Install Chromium system dependencies
      if: inputs.build-only != 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium
      working-directory: .

    - name: Install Chromium and system dependencies
      if: inputs.build-only != 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
      working-directory: .
