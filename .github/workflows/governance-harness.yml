name: governance-harness
on:
  pull_request:
    # The three default activity types, and ready_for_review: marking a draft ready runs the
    # product jobs on its head (docs/CI_STRATEGY.md).
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue's temporary merge commit is verified exactly as a pull
  # request with that base and head (docs/CI_STRATEGY.md).
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: governance-harness-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Documentation checks and CI selection
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Classify the complete candidate diff
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: python3 tools/software_workflow/documentation_ci.py plan --event "$EVENT" --base "$BASE" --head "$HEAD" --output documentation-ci-plan.json
      - name: Install documentation structure dependency
        if: steps.classify.outputs.mode == 'documentation'
        run: python3 -m pip install pyyaml==6.0.3 pytest jsonschema==4.26.0
      - name: Verify documentation structure and changed content
        if: steps.classify.outputs.mode == 'documentation'
        env:
          BASE: ${{ steps.classify.outputs.base }}
        run: |
          python3 tools/software_workflow/documentation_ci.py verify --plan documentation-ci-plan.json
          python3 -m tools.deliverables --project . check > deliverable-check.json
          python3 tools/validation/validate_conflict_markers.py --base "$BASE" --head HEAD
          python3 tools/validation/validate_run_record_leaks.py --base "$BASE" --head HEAD
  repository-checks:
    name: Repository checks
    needs: changes
    if: needs.changes.outputs.mode == 'product'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - name: Install check dependencies
        run: python3 -m pip install pytest pytest-xdist pyyaml jsonschema
      - name: Repository checks
        # The job's whole list is tools/ci/repository_checks.py, which an agent runs locally before a push.
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: python3 tools/ci/repository_checks.py --event "$EVENT" --base "$BASE" --head "$HEAD"
  piping:
    needs: changes
    # A draft pull request does not run the product jobs; harness fails it until it is marked ready.
    if: needs.changes.outputs.mode == 'product' && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    uses: ./.github/workflows/piping-desktop-e2e.yml
    with:
      # repository-checks above runs tests/test_ci_numerical.py on every run.
      repository-checks-run: true
  harness:
    name: harness
    needs: [changes, repository-checks, piping]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: tools/software_workflow
      - name: A draft pull request has not run the product jobs
        # A skipped required check counts as passing, so harness runs and fails rather than skipping.
        if: github.event_name == 'pull_request' && github.event.pull_request.draft && needs.changes.outputs.mode == 'product'
        run: |
          echo "::error::Draft pull request: the product jobs did not run. Mark it ready for review to run them."
          exit 1
      - name: Require every selected verification to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 tools/software_workflow/documentation_ci.py aggregate
