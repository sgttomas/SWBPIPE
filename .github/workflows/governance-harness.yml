name: governance-harness
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: governance-harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Documentation checks and CI selection
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Classify the complete candidate diff
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/software_workflow/documentation_ci.py plan --event "$EVENT" --base "$BASE" --head "$HEAD" --output documentation-ci-plan.json
      - name: Install documentation structure dependency
        if: steps.classify.outputs.mode == 'documentation'
        run: python3 -m pip install pyyaml==6.0.3 pytest jsonschema==4.26.0
      - name: Verify documentation structure and changed content
        if: steps.classify.outputs.mode == 'documentation'
        env:
          BASE: ${{ steps.classify.outputs.base }}
        run: |
          python3 tools/software_workflow/documentation_ci.py verify --plan documentation-ci-plan.json
          python3 -m tools.deliverables --project . check > deliverable-check.json
          python3 tools/validation/validate_conflict_markers.py --base "$BASE" --head HEAD
          python3 tools/validation/validate_run_record_leaks.py --base "$BASE" --head HEAD
  repository-checks:
    name: Repository checks
    needs: changes
    if: needs.changes.outputs.mode == 'product'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - name: Install check dependencies
        run: python3 -m pip install pytest pytest-xdist pyyaml jsonschema
      - name: Select repository regressions
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/software_workflow/hosted_ci.py repository --event "$EVENT" --base "$BASE" --head "$HEAD" --output repository-ci-plan.json
      - name: Bounded shared-tool and routing regressions
        # Every regression runs, including for Rust/manifest additions and
        # deletions, except that a Markdown-only pull request omits the
        # source-reachability tests, which read no Markdown.
        run: |
          deselect=()
          while IFS= read -r test; do deselect+=("--deselect=$test"); done < <(python3 -c 'import json; [print(t) for t in json.load(open("repository-ci-plan.json"))["deselect"]]')
          python3 -m pytest -q -n auto "${deselect[@]}" tools/software_workflow tools/deliverables tools/validation tests/test_ci_numerical.py tests/test_ci_apt_sources.py tests/test_release_members.py tests/test_release_candidate_scan.py tests/test_repository_history.py
      - name: Deliverable dependency structure
        run: python3 -m tools.deliverables --project . check > deliverable-check.json
      - name: Conflict and credential checks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null; then BASE=HEAD^1; fi
          python3 tools/validation/validate_conflict_markers.py --base "$BASE" --head HEAD
          python3 tools/validation/validate_run_record_leaks.py --base "$BASE" --head HEAD
  piping:
    needs: changes
    if: needs.changes.outputs.mode == 'product'
    uses: ./.github/workflows/piping-desktop-e2e.yml
    with:
      # repository-checks above runs tests/test_ci_numerical.py on every run.
      repository-checks-run: true
  harness:
    name: harness
    needs: [changes, repository-checks, piping]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout: tools/software_workflow
      - name: Require every selected verification to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 tools/software_workflow/documentation_ci.py aggregate
