name: PR 268 temporary Linux diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.18'
          architecture: x64
      - name: Reproduce unchanged references and probe
        run: python -B tools/validation/pr268_temporary_linux_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr268-linux-diagnosis
          path: /tmp/pr268-linux-evidence
          if-no-files-found: error
