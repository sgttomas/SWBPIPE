name: retained-pricing-audit
# The retained pricing audit (docs/CI_STRATEGY.md, "Retained pricing audit"; DEL-04-08 REQ-004): the pricing tool's
# tests on the checkout's priced source, daily on main and by dispatch on any ref, such as a release candidate. It adds
# no required check. On main, a failure opens or updates the one standing `pricing-drift` issue and a pass closes it;
# a run of another ref reports nothing.
on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retained-pricing-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    name: Retained pricing audit (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # About 3.4 worker-hours of recorded test time over four shards of four workers.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          # As in the product Python job: declarative specifications are not product inputs.
          sparse-checkout: |
            /*
            !/execution/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python check dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Retained pricing audit shard
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 tools/ci/python_ci.py --audit --shard-index "$SHARD" --shard-count 4 --junit-xml "$RUNNER_TEMP/audit-junit/shard-$SHARD.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-pricing-audit-junit-${{ matrix.shard }}
          path: ${{ runner.temp }}/audit-junit/
          if-no-files-found: ignore
          retention-days: 7
  rust-audit:
    # The registration's Rust half: the product_physics tests that branch on the registered build
    # (retained_facade_tests::registered()) run with OPS_RETAINED_PRICING_AUDIT set, which requires the registered
    # identity (aarch64-apple-darwin, rustc 1.97.1, debug, no RUSTFLAGS) and its reviewed inputs and reader layouts.
    # Elsewhere those tests assert the Stale branch.
    name: Retained pricing audit, registered build (Rust)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          filter: blob:none
          sparse-checkout: |
            /*
            !/execution/
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Registration tests in the registered build identity
        env:
          OPS_RETAINED_PRICING_AUDIT: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/audit-cargo"
          set -o pipefail
          cargo test --locked --manifest-path core/product_physics/Cargo.toml --lib --test retained_precision_admission 2>&1 | tee "$RUNNER_TEMP/audit-cargo/rust.cargo.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-pricing-audit-junit-rust
          path: ${{ runner.temp }}/audit-cargo/
          if-no-files-found: ignore
          retention-days: 7
  report:
    name: Retained pricing audit report
    needs: [audit, rust-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      # Reports run in turn, so a second finds the first's standing issue.
      group: retained-pricing-audit-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: tools/software_workflow
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: retained-pricing-audit-junit-*
          path: audit-junit
          merge-multiple: true
      - name: Open, update or close the standing drift issue for a run of main
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
          JUNIT_DIR: audit-junit
        run: python3 tools/software_workflow/pricing_audit_report.py
