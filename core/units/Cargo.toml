[package]
name = "open_pipe_stress_units"
version = "0.1.0"
edition = "2021"
description = "Deterministic unit catalog and conversion primitives for OpenPipeStress"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "openpipestress_units"
path = "src/bin/openpipestress_units.rs"
required-features = ["cli"]

[features]
cli = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }

[dev-dependencies]
serde_json = "1"
