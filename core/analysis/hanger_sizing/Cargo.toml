[package]
name = "open_pipe_stress_hanger_sizing"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "DEL-04-11 hanger sizing: loads, fit tests, selection and verification arithmetic"
publish = false

[lib]
path = "src/lib.rs"

# The arithmetic (lib.rs) uses no dependency. The derived solves (derived.rs) go
# through the product's public JSON solve entry and normalize units through the
# unit catalog. serde_json carries no feature of its
# own, so the product's features are unchanged by unification; Cargo.lock pins the
# product's versions.
[dependencies]
open_pipe_stress_product_physics = { path = "../../product_physics" }
open_pipe_stress_units = { path = "../../units" }
serde_json = "1"
# Publication: the checked canonical profile every hash uses, the
# library import boundary the headless entry admits a library through, and the
# SHA-256 of the canonical text. Each is already in the product's dependency
# closure (product_physics links canonical_json and sha2), so Cargo.lock pins
# the same versions.
open_pipe_stress_canonical_json = { path = "../../serialization/canonical_json" }
open_pipe_stress_library_import_document = { path = "../../library_import/library_import_document" }
serde = "1"
sha2 = "0.10"

[dev-dependencies]
# Design §8.3.8: the existing readers' actual handling of the document is tested,
# not presumed. Already a dependency of product_physics.
open_pipe_stress_result_export = { path = "../../reporting/result_export" }
