id: DEL-07-09
name: Interactive operation vocabulary and tool palette contract
needs:
- from: DEL-16-01
  condition: >-
    The operation taxonomy is a closed set of operation kinds, change kinds and target types; each
    change kind states its target types, field path and value form; and each kind the operation
    route applies is matched to the taxonomy and to the vocabulary or named as a stated difference,
    so that a vocabulary item is bound only to kinds that exist.
  gating: true
- from: DEL-16-06
  condition: >-
    One operation engine applies every change to the model, only after validation, preview and the
    user's explicit acceptance.
  gating: false
- from: DEL-07-01
  when: Relying on the one route to the model
  condition: >-
    The tool palette offers every NORMATIVE-NOW item of the vocabulary in its group, each command
    opening the form or tool that builds its operation; a roadmap item is listed as not available
    and cannot be invoked; and no palette command changes the model by any route other than the one
    operation route.
  gating: false
- from: DEL-02-02
  when: Examining that a display-unit switch changes no stored value
  condition: >-
    A display-unit choice leaves the model document and its hash unchanged.
  gating: true
- from: DEL-03-02
  when: Examining hanger selection coverage
  condition: >-
    The hanger library is a document format for records a user imports, and no hanger catalogue
    ships with the product.
  gating: true
- from: DEL-07-03
  when: Examining hanger selection coverage
  condition: >-
    A hanger record is chosen for a support by hand from a library the user imported, and the
    choice writes that record's values and nothing computed.
  gating: true
code_paths:
# The catalogue the palette reads. The palette that draws it and routes its commands
# (the rest of apps/desktop/src/features/toolkit/) is DEL-07-01's.
- apps/desktop/src/features/toolkit/capabilityCatalog.ts
checks:
- apps/desktop/src/features/toolkit/ExistingToolkitEngine.test.tsx
- apps/desktop/src/features/toolkit/DisplayIntegration.test.tsx
- apps/desktop/src/features/toolkit/ToolkitPalette.test.tsx
