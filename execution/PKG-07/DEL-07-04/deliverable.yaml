id: DEL-07-04
name: Missing-data warning and blocking UX
needs:
- from: DEL-00-06
  condition: >-
    A diagnostic carries code, class, severity, source, affected object, message and remediation,
    and provenance where applicable; a diagnostic crossing a boundary keeps every field other than
    its class unchanged, and its class changes only by the receiving boundary's stated mapping where
    that boundary's schema requires its own class vocabulary; and invalid input, incomplete model,
    mechanics result, rule-check result and human-review-needed are distinguished.
  gating: true
- from: DEL-00-05
  condition: >-
    The GUI state rule requires every change to the model to be an applied model operation, keeps
    the session's selection as one set of entity identifiers shared by the viewport, the tree and
    the inspector, and keeps diagnostics as produced through undo and redo.
  gating: true
- from: DEL-04-06
  condition: >-
    The model checks and the solver report each missing or invalid solve-required value as a
    finding with the governed fields and a solve-blocking class, naming the affected object, and
    supply no default for it.
  gating: true
- from: DEL-04-04
  when: Showing a nonlinear warning
  condition: >-
    A nonlinear case that does not converge, or whose support states are uncertain, reports that as
    a diagnostic with a nonlinear class and the supports concerned.
  gating: true
- from: DEL-05-04
  condition: >-
    Model incomplete, mechanics solved, rule inputs incomplete, user-rule checked, user-rule failed
    and human review required are distinct statuses, rule inputs incomplete may coexist with
    mechanics solved, and no status states code compliance or approval.
  gating: true
- from: DEL-01-04
  condition: >-
    The claims registry gives each automatic status one display form in one authority domain and
    names the statements and phrasings withdrawn from product surfaces.
  gating: true
- from: DEL-06-03
  condition: >-
    A rule-check run yields one outcome for each check on each load case or combination its category
    maps, reports no within or exceeding outcome on a basis whose required values are not all
    present, reports a missing rule-pack input as a rule-check-blocking finding distinct from a
    solve-blocking one, and returns an aggregate that is incomplete while any outcome is.
  gating: true
- from: DEL-06-04
  when: Showing the pack a run used
  condition: >-
    A rule pack's identity, version, checksum and source note can be shown without exposing its
    formulas or values.
  gating: true
- from: DEL-02-02
  condition: >-
    A stored value can be shown in another catalog unit of its dimension without changing the
    stored value, and a value whose unit is missing or of the wrong dimension is a named finding.
  gating: true
- from: DEL-12-02
  when: Showing an IP-boundary warning on an export
  condition: >-
    The export controls screen a payload before it is written, block protected content and redact
    or block private content by export context, and return each decision that may cross the public
    boundary as a finding with an IP-boundary class.
  gating: true
- from: DEL-08-05
  when: Showing an IP-boundary warning on a report
  condition: >-
    The report linter returns suspected protected content in a report as a finding with the
    IP-boundary class, a severity and a review route.
  gating: true
- from: DEL-08-01
  when: Showing the state of a report flow after an IP-boundary finding
  condition: >-
    A report is blocked when the protected-content lint reports a blocking finding before or after
    rendering, and a blocked report names its reasons and is not saved, printed or packaged.
  gating: true
- from: DEL-07-06
  condition: >-
    The accessibility baseline states the target for workspace controls: a keyboard alternative for
    every action, a signal other than colour for every class and status, and text available to
    assistive technology.
  gating: true
- from: DEL-07-11
  condition: >-
    The workspace shell mounts the finding and run surfaces, holds the session's selection and
    current result, and delivers a selection made from a finding to the tree, the viewport and the
    inspector.
  gating: true
code_paths:
# The rule-check run surface. RuleCheckRunPanel.tsx and the service are shared with DEL-06-03,
# which owns the runner and the row selection the service's preview repeats.
- apps/desktop/src/features/rule-check/**
- apps/desktop/src/services/ruleCheckService.ts
# The missing-data panel of the Issues home, and the blocker count behind the Issues badge.
- apps/desktop/src/features/missing-data/**
# A reference module with its own contract test; the desktop does not call it.
- core/gui/warnings/**
# The boundary helper the GUI reference modules of DEL-07-03, DEL-07-04, DEL-07-05, DEL-07-07 and
# DEL-07-08 import; each lists it.
- core/gui/pkg02_boundary.py
checks:
- tests/test_missing_data_warning_ux.py
- apps/desktop/src/features/rule-check/RuleCheckRunPanel.test.tsx
- apps/desktop/src/features/rule-check/ruleCheckLoadReferenceDisclosure.test.tsx
- apps/desktop/src/services/ruleCheckService.test.ts
- apps/desktop/src/App.test.tsx
- apps/desktop/e2e/gui-workflow-validation.spec.ts
