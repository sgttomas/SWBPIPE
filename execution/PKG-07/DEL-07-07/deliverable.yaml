id: DEL-07-07
name: 'Solve execution UX: progress, cancellation, and diagnostics'
needs:
- from: DEL-00-03
  condition: >-
    Long-running work is a job separate from commands and queries; a background solve job reports
    progress, can be cancelled and records reproducibility metadata; and every job returns a result
    envelope with diagnostics and makes no bare claim of success.
  gating: true
- from: DEL-00-06
  condition: >-
    A diagnostic carries code, class, severity, source, affected object, message and remediation,
    and provenance where applicable; the six warning classes are preserved across every boundary;
    and invalid input, incomplete model, mechanics result, rule-check result and human-review-needed
    are distinguished.
  gating: true
- from: DEL-04-07
  condition: >-
    The product solve has one entry that takes a model document and returns a published result with
    its model hash, solver version and findings; a per-invocation memory budget and a price for a
    request are defined; and a shared memory pool grants and releases memory under leases.
  gating: true
- from: DEL-04-06
  condition: >-
    The solver and the model checks report each finding with the governed diagnostic fields and its
    class, and the model checks can be run alone on a solve request.
  gating: true
- from: DEL-05-04
  condition: >-
    Model incomplete, mechanics solved, rule inputs incomplete, user-rule checked, user-rule failed
    and human review required are distinct statuses, and rule inputs incomplete may coexist with
    mechanics solved.
  gating: true
- from: DEL-05-02
  when: Forming the native summary, pages and verdict of a held result
  condition: >-
    One product result reader classifies a published result, gives each row kind its meaning and
    order, and returns the result's verdict, so that a second reading of the same result text can be
    held equal to it.
  gating: true
- from: DEL-14-02
  when: Recording a run or showing the run summary
  condition: >-
    An analysis-run record has one current form that binds a result to its model state, solver
    version, settings, units and rule-pack references, and a record built from the same result is
    the same bytes whichever implementation builds it.
  gating: true
- from: DEL-02-05
  when: Saving a project from a held result
  condition: >-
    A stored project keeps the model document and its result as saved, reads them back unchanged,
    and refuses by name a write that would replace a revision the session did not open.
  gating: true
- from: DEL-07-04
  condition: >-
    The finding presentation defines how a finding's class and fields are shown, how an absent field
    reads, and how a finding leads to its affected object, which the diagnostics panel follows.
  gating: true
- from: DEL-04-05
  when: Marking the solve timeline
  condition: >-
    The performance kit names the stage boundaries it times, each with a fixed code.
  gating: false
- from: DEL-07-11
  condition: >-
    The workspace shell mounts the solve, progress and diagnostics panels, routes the Solve command
    to the job, holds the session's current result handle, and refuses a solve where no model is
    open.
  gating: true
