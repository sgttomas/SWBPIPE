id: DEL-07-02
name: Model tree and property inspector
needs:
- from: DEL-00-05
  condition: >-
    The GUI state rule keeps selection, expansion, filters and drafts out of the model document,
    defines one selection of entity identifiers shared by the viewport, the tree and the inspector,
    requires every change to the model to be an applied model operation, and scopes undo and redo
    to reversible model edits.
  gating: true
- from: DEL-02-01
  condition: >-
    The model document holds every entity as a typed record with a stable identifier, every
    dimensional value with its unit, sources and provenance records, tags, notes, lines,
    assumptions, constraints, equipment interfaces and operating-condition sets. An absent optional member
    means none, and the document validator refuses a malformed member by a named code and path at
    every apply and validate-only preview.
  gating: true
- from: DEL-02-02
  condition: >-
    The unit catalog gives the units of each dimension, a new entry's starting unit comes from the
    project units, a missing project unit leaves the field without a default and says why, and a
    value of the wrong dimension is refused with a named finding.
  gating: true
- from: DEL-16-01
  condition: >-
    The implemented operation taxonomy has kinds for creating, changing and deleting nodes, pipe
    runs, sections, materials, supports, components and condition sets, for setting a field, for
    assigning a section and a condition set, and for realizing a bend at a corner, each with its
    target types, field path and value form.
  gating: true
- from: DEL-16-02
  condition: >-
    An operation or batch can be validated without being applied, returning either a deterministic
    preview of the change or the named refusal the apply would give, including a stale before-value.
  gating: true
- from: DEL-16-06
  condition: >-
    One operation engine applies a batch only after validation, any required preview and the user's
    explicit acceptance, applies it whole or not at all, leaves the model unchanged on any refusal,
    and keeps every member an operation does not name bit for bit.
  gating: true
- from: DEL-16-03
  when: Applying queued changes as one batch
  condition: >-
    An applied batch is recorded once, with one acceptance record, one receipt holding every
    operation and each operation's author, whichever surface produced the batch.
  gating: true
- from: DEL-04-03
  condition: >-
    The linear support model defines the support families and restraint tokens a record may carry,
    admits an authored direction on a single-translation line stop or spring stored exactly as
    entered, and reports each inadmissible record by a named finding with the support's identity.
  gating: true
- from: DEL-04-04
  condition: >-
    The nonlinear support model defines the members of a one-way, gap, lift-off and friction
    support and reports a record that lacks a required one by a named finding.
  gating: true
- from: DEL-03-03
  when: Entering bend rows in the run sheet
  condition: >-
    A bend accepts the user's radius, flexibility factor and directional stress-intensification
    pair (both or neither) with one source reference, and realizing a bend at a corner replaces the
    corner with tangent nodes the engine computes.
  gating: true
- from: DEL-03-05
  when: Entering valve and flange rows in the run sheet
  condition: >-
    A rigid-family component takes its body length, end sizes and centre-of-gravity vector each
    with a unit of its own, by a stated offset convention, and a record lacking a required value is
    reported as missing.
  gating: true
- from: DEL-07-03
  condition: >-
    The component and bend editors expose their creation forms' completeness checks and operation
    payload builders, which the run sheet's bend, valve and flange rows and the tree's component
    forms use, so that a row and a form produce the same operation for the same inputs.
  gating: true
- from: DEL-07-01
  when: Examining responsiveness at size
  condition: >-
    The interaction-performance requirement defines the reference profile, the frozen workload, the
    limits and the pass rule under which table filtering, row selection and table readiness are
    measured.
  gating: true
- from: DEL-07-11
  condition: >-
    The workspace shell mounts the tree, tables and inspector, holds the session's selection,
    pending changes and history, keeps one applied batch as one checkpoint that undo restores and
    redo reapplies, and announces queue, apply, undo and redo so that a draft surface can follow
    them.
  gating: true
- from: DEL-09-01
  when: Examining the authoring time
  condition: >-
    The reference system exists as a fixture with a run sheet that lists each entry step in order
    and the differences allowed between a hand-entered model and the fixture.
  gating: true
