- apps/desktop/src/features/history/compareStates.test.tsx
- apps/desktop/src/features/history/compareRuns.test.tsx
- apps/desktop/src/features/comparison/withinRunComparison.test.tsx
- apps/desktop/src/features/comparison/withinRunComparison.session.test.tsx
- apps/desktop/src/features/comparison/withinRunPackages.test.tsx
- apps/desktop/src/features/workspace/withinRun.resultsSessionState.test.ts
- apps/desktop/src/App.withinRun.test.tsx
- tests/test_design_authoring_comparison_workspace.py
- apps/desktop/src/features/history/HistoryPanel.unreadable.test.tsx
- apps/desktop/src/features/operations/queuedChangesBatch.test.tsx
- apps/desktop/src/features/toolkit/BatchReviewPanel.test.tsx
- apps/desktop/src/features/comparison/comparisonOverlay.test.ts
- apps/desktop/src/features/viewport/ComparisonOverlayMode.test.tsx
- apps/desktop/src/features/viewport/modelUp.test.ts
- apps/desktop/src/features/history/comparisonOverlay.session.test.tsx
