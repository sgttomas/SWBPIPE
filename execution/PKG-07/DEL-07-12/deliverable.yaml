id: DEL-07-12
name: Interoperability and evidence-review workspace
needs:
- from: DEL-00-06
  condition: >-
    A diagnostic carries code, class, severity, source, affected object, message and remediation,
    and provenance where applicable, and export and adapter outputs return result envelopes.
  gating: true
- from: DEL-12-02
  condition: >-
    The export controls screen a payload before it is written, block protected content and redact
    or block private content by export context, and return each decision as a finding.
  gating: true
- from: DEL-17-02
  condition: >-
    An export package has a common form with its profile, a stable identifier map and a loss
    report, and carries a unit disclosure whose model units, target units and conversion statement
    equal what the writer did.
  gating: true
- from: DEL-02-02
  condition: >-
    An export that takes a unit from the project units is refused by name when that key is missing
    and writes no substitute, and a length an export converts is converted exactly through the
    unit's definition.
  gating: true
- from: DEL-15-01
  when: Showing or saving a handoff package
  condition: >-
    A handoff package has a schema-governed manifest with its family, version, identity and hashes,
    and a validator that returns findings for a package that does not conform.
  gating: true
- from: DEL-15-02
  when: Showing a handoff, local-FEA or external-prover panel
  condition: >-
    A target mapping states, for each model behaviour, whether the target carries it, and lists
    each unsupported behaviour explicitly.
  gating: true
- from: DEL-15-03
  when: Saving a handoff package
  condition: >-
    The downstream export workflow builds a handoff package from the current model and writes it
    only to a file the user chose.
  gating: true
- from: DEL-15-04
  when: Showing the external-prover boundary panel
  condition: >-
    The external-prover record holds names, tags, notes, external references and attachments by
    reference, linked to its handoff package or model state, and carries no prover status,
    acceptance or claim of verification. The authority-wording screen finds wording of approval,
    certification, compliance, acceptance or external validation in a value.
  gating: true
- from: DEL-17-03
  when: Showing or saving the native JSON package
  condition: >-
    The native open JSON package is generated from the current model with its schema version,
    identity and loss report, and validates against its schema.
  gating: true
- from: DEL-17-04
  when: Exporting or importing a model batch file
  condition: >-
    The writer produces a deterministic `.mbf` with a loss report and an identity map for a model
    in its declared subset, and the importer reads a `.mbf` with its identity file into a model
    document whose entities carry the mapped identities, each through a native command that can be
    reviewed, saved and retired.
  gating: true
- from: DEL-17-05
  when: Reviewing external-run evidence
  condition: >-
    The parser reads user-supplied result files into typed records bound through the writer's
    identity file to the MBF export and run, reports unsupported, unmatched or missing sections as
    findings, and parses with no executable configured.
  gating: true
- from: DEL-17-06
  when: Showing or saving the stress-neutral package
  condition: >-
    The stress-neutral package is generated from the current model and result with its units,
    identity map and loss report.
  gating: true
- from: DEL-17-07
  when: Showing or saving a PCF export
  condition: >-
    The PCF exporter writes its conservative subset with a loss report that lists every omitted or
    unsupported item.
  gating: true
- from: DEL-17-08
  when: Showing or saving review geometry
  condition: >-
    The review-geometry exporter writes a geometry file with its units and a statement that it is
    for visual review only.
  gating: true
- from: DEL-17-09
  when: Showing the export-adapter SDK review panel
  condition: >-
    The export-adapter SDK states the contract an adapter meets and returns conformance findings
    for one that does not.
  gating: true
- from: DEL-10-02
  when: Showing the adapter-framework review panel
  condition: >-
    The adapter framework validates an adapter's declaration and privacy standing and returns its
    findings.
  gating: true
- from: DEL-10-03
  when: Showing the local-FEA handoff panel
  condition: >-
    The local-FEA handoff data contract defines the record handed off, with its units, identities
    and unsupported-behaviour entries.
  gating: true
- from: DEL-10-05
  when: Showing the headless-runner review panel
  condition: >-
    The headless runner reads and writes structured records with stated schemas, which a panel can
    show without running it.
  gating: true
- from: DEL-09-04
  when: Showing validation evidence
  condition: >-
    The validation manual identifies each validation record with its case, its evidence status and
    its limitations.
  gating: true
- from: DEL-09-01
  when: Examining the MBF round trip of the reference system
  condition: >-
    The reference system exists as a model document containing the families of exit criterion 1.
  gating: true
- from: DEL-07-11
  condition: >-
    The workspace shell mounts the panels, routes the File menu's commands, gives each save dialog
    its suggested file name, and guards every command that replaces the working model.
  gating: true
code_paths:
# The native JSON package panel. The package is DEL-17-03's.
- apps/desktop/src/features/native-package/**
# Also listed by DEL-17-06, which owns the builder and validator functions the panel calls; the
# panel and its presentation are this deliverable's.
- apps/desktop/src/features/stress-neutral/**
- apps/desktop/src/features/validation-evidence/**
# handoffPackageSave.ts and HandoffSaveDialog.tsx are DEL-15-03's save request.
- apps/desktop/src/features/handoff/**
- apps/desktop/src/features/headless-runner/**
- apps/desktop/src/features/local-fea-handoff/**
# The export and import dialogs. mbfExportCancel.ts, mbfExportSession.ts, mbfImportCancel.ts and
# mbfImportSession.ts are also listed by DEL-17-04, which owns the native commands they drive.
- apps/desktop/src/features/caepipe-mbf/**
# Panels over records other deliverables own: DEL-17-05, DEL-17-07, DEL-17-08, DEL-15-04, DEL-10-02
# and DEL-17-09. PcfExportPanel.tsx is also listed by DEL-17-07 and ReviewGeometryPanel.tsx by
# DEL-17-08, each for what the writer contributes to it; the panel's presentation is this
# deliverable's.
- apps/desktop/src/features/caepipe-external/**
- apps/desktop/src/features/pcf-export/**
- apps/desktop/src/features/review-geometry/**
- apps/desktop/src/features/external-prover/**
- apps/desktop/src/features/adapter-framework/**
- apps/desktop/src/features/export-adapter-sdk/**
# The unit disclosure every export panel calls, applying DEL-17-02's contract. Also called by the
# export-review and diff-preview panels outside this workspace.
- apps/desktop/src/features/exportUnitDisclosure.ts
checks:
- apps/desktop/src/features/native-package/NativePackagePanel.test.ts
- apps/desktop/src/features/stress-neutral/StressNeutralExportPanel.test.tsx
- apps/desktop/src/features/stress-neutral/nativeStressNeutralBuilder.test.tsx
- apps/desktop/src/features/handoff/HandoffPanel.test.tsx
- apps/desktop/src/features/headless-runner/HeadlessRunnerPanel.test.tsx
- apps/desktop/src/features/local-fea-handoff/LocalFeaHandoffPanel.test.tsx
- apps/desktop/src/features/caepipe-mbf/MbfExportDialog.test.tsx
- apps/desktop/src/App.mbfExportDialog.test.tsx
- apps/desktop/src/features/caepipe-mbf/mbfImport.test.ts
- apps/desktop/src/features/caepipe-mbf/mbfImportSession.test.ts
- apps/desktop/src/App.mbfImportDialog.test.tsx
- apps/desktop/e2e/result-compatibility.spec.ts
- apps/desktop/src/App.mbfRoundTrip.test.tsx
- apps/desktop/src/features/exportProjectUnitRefusal.test.tsx
