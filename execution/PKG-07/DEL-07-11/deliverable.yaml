id: DEL-07-11
name: Desktop workspace shell and host integration
needs:
- from: DEL-00-03
  condition: >-
    Mutating commands, read-only queries and long-running jobs are separate kinds of request, every
    command and job returns a result envelope with diagnostics, and a job reports progress and can
    be cancelled.
  gating: true
- from: DEL-00-05
  condition: >-
    The GUI state rule keeps selection, view state, drafts and job progress out of the model
    document, defines one selection of entity identifiers shared by every panel, requires every
    change to the model to be an applied model operation, and scopes undo and redo to reversible
    model edits.
  gating: true
- from: DEL-02-01
  condition: >-
    The model document has one current version and one validator that refuses a malformed or
    unsupported document by a named code and path; a document is checked at native file open
    without being repaired, defaulted or normalized; and the document's canonical form and hash are
    defined.
  gating: true
- from: DEL-02-05
  when: Saving and reopening a project
  condition: >-
    The project store saves and reads back a project unchanged, identifies each stored revision,
    and refuses by name a write that would replace a revision the session did not open or confirm.
  gating: true
- from: DEL-12-01
  when: Storing private data
  condition: >-
    Private data is stored only in the application's own storage and in locations the user chose,
    and nothing transmits it without an explicit user action.
  gating: true
- from: DEL-14-02
  when: Reopening a session with its runs
  condition: >-
    An analysis-run record binds a result to its model state and can be read back as recorded, so
    that a reopened session can tell a current result from a historical one.
  gating: true
- from: DEL-16-06
  when: Taking an applied document as the working model
  condition: >-
    One operation engine applies a batch whole or not at all and leaves the model unchanged on any
    refusal.
  gating: true
- from: DEL-07-06
  condition: >-
    The accessibility baseline states the target for workspace controls, the presentation
    conventions and the design tokens, themes and density the shell applies to every panel.
  gating: true
- from: DEL-10-04
  when: Scanning a product build
  condition: >-
    The desktop's product build is produced by the project's reproducible build and packaging
    workflow (DEL-10-04/REQ-001), so that it can be scanned for the scripted-run build's features.
  gating: false
code_paths:
- apps/desktop/src/main.tsx
- apps/desktop/src/App.tsx
# The session and the shell. In this folder: shell/DisabledReason.tsx and uiPreferences.ts are
# DEL-07-06's; table/**, contextMenu/** and sessionEvents.ts are DEL-07-02's; solveGates.ts and
# solveJobAudit.ts are DEL-07-07's; statusLabels.ts is DEL-05-04's. workspaceSession.ts is shared
# with DEL-16-06, and the handlers inside it for each feature's commands are that feature's.
- apps/desktop/src/features/workspace/**
# The open and save surfaces. modelDocumentShape.ts is DEL-02-01's; storedDocumentExport.ts is
# DEL-02-05's; modelDocumentSave.ts and ModelDocumentSaveDialog.tsx are shared with DEL-15-03.
- apps/desktop/src/features/model-file/**
# The work-loss guards. ProjectStorageAuditPanel.tsx in this folder is a review-export panel.
- apps/desktop/src/features/project-storage/**
- apps/desktop/src/services/modelDocumentFile.ts
- apps/desktop/src/services/projectService.ts
