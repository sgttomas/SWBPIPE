- from: DEL-05-02
  condition: >-
    The results viewer takes base dispatch, ordinary preview/pressure readings,
    row semantics and base standing from DEL-05-02's Rust product reader through
    `resultReader.ts` and `resultStanding.ts` (wasm engine or native host).
    A result the reader does not admit is unsupported, historical values only.
    The output policy keys each surface's decision on the reader's returned route.
  gating: true
  evidence: execution/PKG-04/DEL-04-08/Design/b7-plan.md
- from: DEL-04-08
  condition: >-
    The results viewer takes retained-source and retained-successor validation,
    classification, invocation-bound standing and published limitations from
    DEL-04-08 through the existing Rust-reader bindings, including
    `retainedPrecisionReader.ts`. It re-derives no verified verdict and does not
    activate a held output surface.
  gating: true
  evidence: apps/desktop/src/features/results/retainedPrecisionReader.ts
- from: DEL-04-09
  condition: >-
    The results viewer's modes table and mode-shape view (F1 M3) show DEL-04-09's `modal-1` rows,
    standing, Sturm count, mass summary and disclosures through the Rust modal reader's verdict. The
    mode-shape view is a normalized display transform labelled as not a physical length, with a static,
    stepped alternative under reduced motion. The viewer supplies no extraction bound of its own; it
    pre-fills only the project's last-used value (DEL-04-09 Design §5.1).
  gating: true
  when: Before the modal results view ships (DEL-04-09 M3).
  evidence: execution/PKG-04/DEL-04-09/Design/modal-analysis.md
- from: DEL-06-03
  condition: >-
    The stress and ratio table (survey item A3) reads the session's rule-check
    run as `ruleCheckService.ts` types it: one outcome per check and load case
    or combination, with the user's stress category, the runner's status, the
    computed value, the limit, the relation and the bound solver rows. An
    incomplete outcome (RULE_INPUTS_INCOMPLETE) stays visible as incomplete
    with the run's own reason and is never ranked or hidden. The table forms no
    status and reads no rule-pack value into any output.
  gating: false
  evidence: execution/PKG-07/DEL-07-05/Design/stress-ratio-table.md
- from: DEL-05-01
  condition: >-
    The weight and centre-of-gravity summary (survey item A9) reads the
    self-weight generator's plan evidence (`generateSelfWeightPlan`, the
    `self_weight_wasm` engine or the native command): per pipe, the
    `pipe_mass_per_length_times_explicit_axis_acceleration/v2` record with its
    generated N/m intensity and the contents and insulation flags; per mapped
    component, the `component_weight_at_center_of_gravity_global_offset/v1`
    record with `weight_N`, `component_node`, `omitted_pipe_id` and
    `center_of_gravity_m`; and the component-weight-not-applied warnings. The
    plan is read, never queued or applied, and the summary computes no mass.
  gating: false
  evidence: execution/PKG-07/DEL-07-05/Design/weight-cog-summary.md
- from: DEL-07-01
  condition: >-
    The results navigator (survey item A1) selects the current row through the
    panel's existing `onSelectResult`, as a click on the row does. It relies on
    the viewport highlighting the session's selection that `handleSelectResult`
    sets from the row's entity, and on the tree and inspector showing it. The
    navigator writes no model data, records no undo entry and moves no camera.
  gating: false
  evidence: execution/PKG-07/DEL-07-05/Design/results-navigator.md
