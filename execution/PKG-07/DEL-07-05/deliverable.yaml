id: DEL-07-05
name: Results viewer
needs:
- from: DEL-05-02
  condition: >-
    One product result reader, the same in the wasm engine and the native host, classifies a
    result, gives each row kind its meaning, published frame and unit, returns the result's
    standing with its route and published limitations, returns the solve's numerical quality
    verdict, and does not admit a result it cannot classify.
  gating: true
- from: DEL-04-07
  condition: >-
    A product solve publishes one result per model with rows by kind and load case, each with its
    entity identity, unit and frame, and with the model hash, solver version and findings that tie
    the result to its inputs.
  gating: true
- from: DEL-05-03
  when: Showing stress rows and the stress headline of each section basis
  condition: >-
    A recovered stress row names its station and its section basis, and on the exact route each
    basis, nominal and reduced, has its own member maxima.
  gating: true
- from: DEL-04-01
  when: Drawing element axes
  condition: >-
    The frame kernel defines a straight member's local axes from its end nodes and y reference, and
    refuses a frame it cannot form by a named finding.
  gating: true
- from: DEL-04-06
  when: Showing solver findings and the conditioning figure
  condition: >-
    A solve whose reduced system is ill-conditioned publishes a diagnostic naming the case, and
    solver findings carry the governed diagnostic fields.
  gating: true
- from: DEL-04-08
  when: Showing a retained-precision result
  condition: >-
    A retained-precision result publishes its classification, its standing bound to the invocation
    that produced it and its limitations, and the result reader returns them.
  gating: true
- from: DEL-05-04
  condition: >-
    Mechanics solved, rule inputs incomplete, user-rule checked, user-rule failed and human review
    required are distinct statuses, and no status states code compliance or approval.
  gating: true
- from: DEL-01-04
  condition: >-
    The claims registry gives each automatic status one display form and registers the
    numerical-health display forms and their boundary sentence.
  gating: false
- from: DEL-06-03
  when: Showing ratios and the stress and ratio table
  condition: >-
    A rule-check run yields one outcome for each check on each load case or combination, with the
    user's stress category, the runner's status, the computed value, the limit, their unit and the
    relation between them, and an incomplete outcome carries the findings that explain it.
  gating: true
- from: DEL-05-01
  when: Showing the weight and centre-of-gravity summary
  condition: >-
    The self-weight generator returns, without changing the model, a plan that gives each selected
    pipe's mass per length and span and each rigid-family component's weight, under an entered
    gravity, and reports what it could not include.
  gating: true
- from: DEL-02-02
  condition: >-
    A stored value can be shown in another catalog unit of its dimension without changing the
    stored value, and a value whose unit is missing or of the wrong dimension is a named finding.
  gating: true
- from: DEL-07-04
  condition: >-
    The finding presentation defines how a finding's class and fields are shown and how a user-rule
    outcome is worded, which the results tables follow.
  gating: false
- from: DEL-07-07
  when: Showing a result held by the native host
  condition: >-
    A result held by the native host is summarized and read as bounded pages of rows in source
    order, so that a table can show a result too large to hold in the display.
  gating: true
- from: DEL-07-01
  when: Drawing results in the viewport
  condition: >-
    The viewport provides one scene with the model's nodes and members addressable by identifier,
    shows the session's selection, and lets an overlay add and remove its own drawn resources
    (DEL-07-01/REQ-002).
  gating: true
- from: DEL-07-11
  condition: >-
    The workspace shell mounts the results panels, holds the session's current result, selection
    and view state, and keeps view state out of the model document.
  gating: true
code_paths:
# The results feature. In this folder: retainedPrecision* are DEL-04-08's; HangerSizing*,
# hangerSizingResult.ts and hangerSizingView.ts are DEL-04-11's; *Csv.ts and
# resultGroupCsvStream.ts are DEL-08-04's; analysisResultHashScope.ts is DEL-14-02's;
# componentBody.ts is DEL-03-05's; C2ResultGate.tsx, NativeResultsPanel.tsx and useNativeRowKey.ts
# are DEL-07-07's; outputPolicy.ts is shared with DEL-04-08, which owns the retained-precision
# refusals it names. resultReader.ts, resultStanding.ts, resultSemantics.ts and
# numericalResultQuality.ts are this deliverable's bindings to DEL-05-02's reader, and
# hangerPreload.ts is its standing-line sentence for the solver's hanger-preload warnings; the
# meaning each returns is the provider's.
