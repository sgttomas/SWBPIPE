id: DEL-07-03
name: Material, component, and rule-pack editors
needs:
- from: DEL-00-05
  condition: >-
    The GUI state rule keeps drafts, selection and validation display out of the model document and
    requires every change to the model to be an applied model operation.
  gating: true
- from: DEL-02-01
  condition: >-
    The model document holds materials, sections, components, load cases, combinations, pressure
    regions and rule-pack references as typed records with stable identifiers, every dimensional
    value with its unit, and an absent optional member means none. The document validator refuses a
    malformed member by a named code and path.
  gating: true
- from: DEL-00-06
  condition: >-
    A diagnostic carries its class and names the value and the record it concerns as its affected
    object.
  gating: false
- from: DEL-02-02
  condition: >-
    The unit catalog gives the units of each dimension, a new entry's starting unit comes from the
    project units, a missing project unit leaves the field without a default and says why, and a
    value of the wrong dimension is refused with a named finding.
  gating: true
- from: DEL-16-01
  condition: >-
    The implemented operation taxonomy has kinds for creating, changing and deleting materials,
    sections, components, load cases, primitive loads, combinations and pressure regions, and for
    realizing a bend at a corner, each with its target types, field path and value form.
  gating: true
- from: DEL-16-02
  condition: >-
    An operation or batch can be validated without being applied, returning either a deterministic
    preview of the change or the named refusal the apply would give.
  gating: true
- from: DEL-16-06
  condition: >-
    One operation engine applies a batch only after validation, any required preview and the user's
    explicit acceptance, applies it whole or not at all, and leaves the model unchanged on any
    refusal.
  gating: true
- from: DEL-03-01
  condition: >-
    A material record can hold a name, a grade label, density, Poisson's ratio, elastic modulus and
    thermal expansion against temperature, each value with its unit and provenance, and has slots
    for allowables that the format leaves empty. A value a solve or a rule check requires and the
    record lacks is a completeness finding, never a default.
  gating: true
- from: DEL-03-02
  condition: >-
    The section and component library formats define each record's members with unit, dimension and
    provenance and report a required value a record lacks as a completeness finding with a
    diagnostic; in the hanger format a document lacking a required member is invalid and an absent
    optional value stays absent; and no format defines a default.
  gating: true
- from: DEL-03-07
  when: Importing a private library
  condition: >-
    The import boundary accepts a library only with its source, provenance, units and
    redistribution status, returns a finding for each missing or unclear one, keeps only an import
    accepted as private and local, and refuses a quarantined or review-required one with its
    findings.
  gating: true
- from: DEL-03-03
  when: Realizing a bend from an editor
  condition: >-
    Realizing a bend at a corner replaces the corner with tangent nodes the engine computes, and a
    validate-only preview returns the same geometry the apply would produce.
  gating: true
- from: DEL-03-05
  when: Creating a rigid-family component
  condition: >-
    A rigid-family component takes its body length, weight and centre-of-gravity vector each with a
    unit of its own, by a stated offset convention, and a record lacking a required value is
    reported as missing.
  gating: true
- from: DEL-03-06
  when: Creating an expansion joint or other connector
  condition: >-
    A connector component takes user-entered stiffnesses and pressure-thrust data with units and a
    source, and a record lacking a required value is reported as missing.
  gating: true
- from: DEL-05-01
  condition: >-
    The load engine resolves a case's condition use into ordinary loads before validation and
    returns that resolution as a preview, generates a self-weight plan only from the selected pipes,
    their sections and densities and an entered gravity, and reports a load that lacks a required
    value as a finding.
  gating: true
- from: DEL-05-02
  condition: >-
    The combination algebra defines the combination bases, the operands each admits and the shapes
    it refuses, and the engine refuses by a named code the deletion of a load case or combination
    that another combination references.
  gating: true
- from: DEL-06-01
  when: Composing or opening a rule pack
  condition: >-
    The rule-pack format defines identity, version, source note, redistribution status, checksum,
    required-input declarations with units, formula declarations, user allowable slots, stress
    categories and load-case mappings, and its validation returns structured findings.
  gating: true
- from: DEL-06-04
  when: Storing or opening a rule pack
  condition: >-
    A rule pack is private unless a public basis is recorded, its checksum is taken over its
    canonical form, a stored pack is read back as it was saved, and a missing source notice,
    missing redistribution status or stale checksum is a diagnostic.
  gating: true
- from: DEL-12-01
  condition: >-
    Private materials, components, libraries and rule packs are stored in user-controlled local
    storage, and nothing transmits them without an explicit user action.
  gating: true
- from: DEL-07-11
  condition: >-
    The workspace shell mounts the editors, holds the session's pending changes and history, and
    announces queue, apply, undo and redo so that a draft surface can follow them.
  gating: true
code_paths:
# The load manager. LoadCaseManagerPanel.tsx and primitiveLoadVocabulary.ts are also listed by the
# load engine's deliverables (DEL-05-01, DEL-05-02, DEL-05-05), which own what a load, a case and a
# combination mean; the entry surface is this deliverable's.
- apps/desktop/src/features/load-cases/**
# The library manager, with applying a record to a model entity and reporting a library
# reference that no longer matches (REQ-015, AC-005). The record formats these read are DEL-03-01's
# and DEL-03-02's.
- apps/desktop/src/features/library/**
# The rule-pack manager. RulePackManagerPanel.tsx is shared with DEL-06-01 and DEL-06-04, which own
# the format and the lifecycle it edits.
- apps/desktop/src/features/rule-packs/**
- apps/desktop/src/features/material-temperature/**
- apps/desktop/src/features/pressure-authoring/**
- apps/desktop/src/features/rich-authoring/**
- apps/desktop/src/features/bend-authoring/**
