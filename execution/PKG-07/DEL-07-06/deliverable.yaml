id: DEL-07-06
name: Accessibility and usability baseline
needs:
- from: DEL-00-05
  condition: >-
    The GUI state rule keeps user preferences and other view state out of the model document.
  gating: true
- from: DEL-07-11
  when: Examining themes, density and keyboard reach in the running desktop
  condition: >-
    The workspace shell applies the chosen theme and density to every mounted panel, carries focus
    between panels in a stated order, and gives every panel the same keyboard route to its commands.
  gating: false
- from: DEL-07-02
  when: Examining the timed-entry use case
  condition: >-
    The authoring-time requirement defines the timed entry of the reference system by run sheet,
    from a blank project to a solve, and its threshold.
  gating: false
- from: DEL-07-04
  condition: >-
    Every finding is shown with its class, and the six classes are distinguishable without colour.
  gating: false
- from: DEL-07-07
  when: Examining the use cases in the running desktop
  condition: >-
    A solve is started in the desktop, and a solve that is refused or fails says why in findings that
    name the entities concerned.
  gating: false
- from: DEL-07-05
  when: Examining the use cases in the running desktop
  condition: >-
    Results are read per case and combination in tables that sort and filter, with each row located
    in the viewport.
  gating: false
- from: DEL-07-03
  when: Examining the use cases in the running desktop
  condition: >-
    Load cases, combinations and a private rule pack are entered and applied in the desktop.
  gating: false
- from: DEL-07-08
  when: Examining the use cases in the running desktop
  condition: >-
    Model states are saved, and two states and their runs are selected and compared, in the desktop.
  gating: false
- from: DEL-08-01
  when: Examining the use cases in the running desktop
  condition: >-
    A report is released, saved and printed from the desktop with the PRD §19.3 notice.
  gating: false
- from: DEL-08-04
  when: Examining the use cases in the running desktop
  condition: >-
    Every results table in the desktop exports to CSV.
  gating: false
- from: DEL-08-06
  when: Examining the use cases in the running desktop
  condition: >-
    A comparison is exported as a report from the desktop.
  gating: false
- from: DEL-02-05
  when: Examining the use cases in the running desktop
  condition: >-
    A saved project reopens as it was left, and autosave recovers work with at most one interval
    lost.
  gating: false
- from: DEL-16-06
  when: >-
    Before the owner is asked for the verdict. The comparison of the agent's reach with what the use
    cases need can be made before that.
  condition: >-
    Through its capability catalog and the one operation route, the embedded agent reaches what each
    use case needs from its stated start to its stated result. The capabilities it reaches stay with
    the deliverables that own them.
  gating: true
code_paths:
- apps/desktop/src/design/**
# Generated by apps/desktop/scripts/generate-tokens.mjs, which DEL-10-04 lists with the build scripts.
- apps/desktop/src/tokens.css
- apps/desktop/src/styles.css
- apps/desktop/src/features/workspace/uiPreferences.ts
# The shared disabled-reason component. The rest of the shell folder is DEL-07-11's.
- apps/desktop/src/features/workspace/shell/DisabledReason.tsx
- apps/desktop/src/App.deadControls.test.tsx
- apps/desktop/e2e/b3-accessibility.spec.ts
- apps/desktop/e2e/workspace-layout.spec.ts
- apps/desktop/e2e/workspace-driver.ts
# A review-export panel mounted in the evidence section and the drawer, and a Python reference
# module with its own contract test. No criterion of this scope covers either.
- apps/desktop/src/features/accessibility-baseline/**
- core/gui/accessibility/**
checks:
- apps/desktop/e2e/b3-accessibility.spec.ts
- apps/desktop/e2e/ui-foundation.spec.ts
- apps/desktop/e2e/workspace-layout.spec.ts
- apps/desktop/src/design/tokens.test.ts
- apps/desktop/src/design/themeAttribute.test.tsx
- apps/desktop/src/features/workspace/uiPreferences.test.ts
- tests/test_accessibility_usability_baseline.py
- apps/desktop/src/features/workspace/contextMenu/ContextMenu.test.tsx
- apps/desktop/src/App.deadControls.test.tsx
# Records, without judging, what keyboard Select All selects in the model tree and the results,
# displacement extremes and support load tables of the launched app (AC-006); it presses no Copy.
- apps/desktop/native-smoke/evidence-journeys.mjs
