id: DEL-07-01
name: 3D viewport and centerline editor
needs:
- from: DEL-00-05
  condition: >-
    The GUI state rule keeps camera, hover, selection and job progress out of the model document,
    defines one selection of entity identifiers shared by the viewport, the tree and the inspector,
    and requires every change to the model to be an applied model operation.
  gating: true
- from: DEL-02-01
  condition: >-
    The model document holds nodes, elements, components, supports and loads as typed records with
    stable identifiers, and every node position and section dimension as a value with its unit, so
    that the viewport can draw each entity from its stored record and address it by identifier.
  gating: true
- from: DEL-00-06
  condition: >-
    A diagnostic in a result envelope carries its class and names its affected object by the model
    entity's identifier.
  gating: false
- from: DEL-02-02
  condition: >-
    A new entry's starting unit comes from the project units, a missing project unit leaves the
    field without a default and says why, and a stored value can be shown in another catalog unit
    of its dimension without changing the stored value or the model hash.
  gating: true
- from: DEL-16-01
  condition: >-
    The implemented operation taxonomy has kinds for creating and deleting a node, connecting,
    splitting, reconnecting, transforming and deleting a pipe run, setting a field and inserting a
    component, each with its target types, field path and value form.
  gating: true
- from: DEL-16-02
  condition: >-
    An operation or batch can be validated without being applied, returning either a deterministic
    preview of the change or the named refusal the apply would give.
  gating: true
- from: DEL-16-06
  condition: >-
    One operation engine applies a batch only after validation, preview and the user's explicit
    acceptance, applies it whole or not at all, and leaves the model unchanged on any refusal.
  gating: true
- from: DEL-07-09
  condition: >-
    The operation vocabulary lists each interactive model-building item with its class
    (NORMATIVE-NOW or ROADMAP), the operation kinds it binds to and its palette group, and one
    catalogue lists every palette entry with its group, the items it serves and the surface that
    handles it.
  gating: true
- from: DEL-07-03
  when: Placing a component from the viewport
  condition: >-
    The component editors provide, for each component kind, a creation form with its completeness
    checks and its operation payload, which the viewport hosts at the chosen node or run.
  gating: true
- from: DEL-07-11
  condition: >-
    The workspace shell mounts the viewport, holds the session's selection, visibility and pending
    changes, delivers model changes to the viewport in the order they are applied, and keeps an
    applied batch as one checkpoint that one undo restores.
  gating: true
code_paths:
