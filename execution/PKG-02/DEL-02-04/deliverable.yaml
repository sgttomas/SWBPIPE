id: DEL-02-04
name: Plugin and extension domain contracts
needs:
- from: DEL-00-07
  condition: >-
    The API boundary map marks every seam between the layers internal or public; no plugin or
    adapter can cause a model change, a rule evaluation, a result or a report that did not pass
    domain validation, the rule sandbox, a result envelope and the report controls; and a
    declaration that requests a bypass or an ungranted capability is refused.
  gating: true
- from: DEL-00-03
  condition: >-
    Commands, queries and jobs are separate request kinds, every command and job returns a result
    envelope with diagnostics, and a query leaves the model's canonical hash and the stored project
    unchanged.
  gating: true
- from: DEL-00-04
  condition: >-
    A hashed JSON payload is hashed as SHA-256 over its RFC 8785 canonical form, no plugin or
    adapter opens the store or issues SQL, and every change to the store is made through an
    application service.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the fields a diagnostic record carries (code, class, severity,
    source, affected object, message, remediation, provenance) and the result envelope that
    carries them.
  gating: true
- from: DEL-02-02
  when: Verifying the units an adapter declaration names
  condition: >-
    The unit catalog names each unit's dimension, so that a unit a declaration names can be found
    unknown or dimensionally incompatible.
  gating: true
- from: DEL-10-02
  when: Verifying an adapter declaration with a manifest
  condition: >-
    The adapter framework judges an adapter declaration with findings and never by an exception,
    touching no file and no network and running no adapter code, and its operation-result builder
    returns an envelope that validates against the declaration contract.
  gating: true
- from: DEL-12-03
  when: Deciding whether an extension may receive telemetry-facing data
  condition: >-
    Telemetry stays a no-op until a telemetry design is approved, and no plugin manifest or
    adapter declaration changes the resolved telemetry state.
  gating: false
code_paths:
- schemas/plugin_manifest.schema.yaml
- docs/architecture/extension_domain_contracts.md
- fixtures/plugin_manifest/**
# Declaration verification. The module sits in the adapter framework's package and imports it;
# the framework is DEL-10-02's.
- core/adapters/framework/plugin_verification.py
- tests/test_plugin_manifest_schema.py
- tests/test_adapter_plugin_verification_del_02_04.py
checks:
- tests/test_plugin_manifest_schema.py
- tests/test_adapter_plugin_verification_del_02_04.py
