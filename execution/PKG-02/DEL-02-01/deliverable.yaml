id: DEL-02-01
name: Canonical domain model schema
needs:
- from: DEL-02-02
  condition: >-
    The unit catalog names each unit's dimension and rejects an unknown unit and a unit of the
    wrong dimension, so that every quantity in a document, the node-proximity tolerance included,
    can be checked against it.
  gating: true
- from: DEL-02-03
  condition: >-
    The analysis status vocabulary names the automatic statuses, keeps human acceptance outside
    them and has no status that asserts code compliance, so that the status labels a document
    carries assert none.
  gating: true
- from: DEL-16-06
  condition: >-
    The operation engine applies only an accepted, valid operation whose basis is the current
    model hash, leaves the document unchanged on every refusal, and behaves the same in the native
    and the web engine.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the fields a diagnostic record carries (code, class, severity,
    source, affected object, message, remediation, provenance).
  gating: true
- from: DEL-02-05
  when: Examining the round trip of a document that carries every member
  condition: >-
    The project store, the model document file and the headless persistence envelope each return a
    saved document with equal content and the same model hash, and the version check refuses every
    version but the current one by name without rewriting it.
  gating: true
- from: DEL-04-07
  when: Examining that a carried member is read, refused or withheld by name
  condition: >-
    The product solve reports every missing or unsupported input as a named diagnostic through
    each entry and on both routes, and drops none silently.
  gating: true
- from: DEL-05-01
  when: Examining a document whose cases use operating conditions
  condition: >-
    A load case's use of operating conditions resolves, before validation, into the per-case
    records the solve consumes, and a missing set, condition or value refuses the case by name.
  gating: true
- from: DEL-03-07
  when: Examining the warning for a quarantined disposition
  condition: >-
    The library import quarantines a record whose redistribution status says protected content is
    suspected or whose review status is quarantined.
  gating: true
code_paths:
