id: DEL-02-01
name: Canonical domain model schema
needs:
- from: DEL-02-02
  condition: >-
    The unit catalog names each unit's dimension and rejects an unknown unit and a unit of the
    wrong dimension, so that every quantity in a document, the node-proximity tolerance included,
    can be checked against it.
  gating: true
- from: DEL-05-04
  condition: >-
    The status semantics keep the mechanics solve, a rule-pack outcome and a person's acceptance
    distinct, with acceptance only a person's record, and name no status for compliance,
    certification or approval, so that the document's authored status labels keep the same three
    apart and assert none of those. The labels are not limited to the six automatic statuses.
  gating: true
- from: DEL-00-04
  condition: >-
    Any change to what a persisted document can contain, including an added optional member,
    raises at least the minor version of its schema, so that each step of the model document's
    version follows that rule.
  gating: false
- from: DEL-08-02
  when: Examining a round trip or an undo by its model hash
  condition: >-
    The model hash is SHA-256 over the RFC 8785 canonical form of the model document, computed by
    one implementation that every hashing surface uses.
  gating: false
- from: DEL-16-06
  condition: >-
    The operation engine applies only an accepted, valid operation whose basis is the current
    model hash, leaves the document unchanged on every refusal, and behaves the same in the native
    and the web engine.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the fields a diagnostic record carries (code, class, severity,
    source, affected object, message, remediation, provenance).
  gating: true
- from: DEL-02-05
  when: Examining the round trip of a document that carries every member
  condition: >-
    The project store, the model document file and the headless persistence envelope each return a
    saved document with equal content and the same model hash, and the version check refuses every
    version but the current one by name without rewriting it.
  gating: true
- from: DEL-04-07
  when: Examining that a carried member is read, refused or withheld by name
  condition: >-
    The product solve reports every missing or unsupported input as a named diagnostic through
    each entry and on both routes, and drops none silently.
  gating: true
- from: DEL-05-01
  when: Examining a document whose cases use operating conditions
  condition: >-
    A case's condition use resolves, before validation, into ordinary loads of the case; a
    document whose cases use conditions solves as the document with those loads authored; and a
    case that names a missing set, condition or value is refused by name.
  gating: true
- from: DEL-03-07
  when: Examining the warning for a quarantined disposition
  condition: >-
    A library, record or value whose redistribution status says protected content is suspected, or
    whose review status is quarantined, is quarantined by the library import.
  gating: true
code_paths:
# The format: the schema, the load-reference schema, and the typed members the product reads.
# In schemas/model.schema.yaml the typed, closed Component record is this deliverable's; the
# members of the bend, branch, rigid and expansion-joint families in it, with the
# curved_bend_macro_element consumption value, the eccentric offset and the objective_connector
# definition, are DEL-03-03's to DEL-03-06's, which list the file too.
- schemas/model.schema.yaml
- schemas/load_reference_state.schema.json
- core/product_physics/src/model_fields.rs
- core/product_physics/src/document_members.rs
- core/product_physics/src/model_settings.rs
# The current version is named here. The version states and refusals in the same file are
# DEL-02-05's, and the solve that reads the format is DEL-04-07's.
- core/product_physics/src/model_format.rs
# Only the document's wire types in this file are this deliverable's; the crate is DEL-04-07's.
- core/product_physics/src/lib.rs
# Operating-condition sets as the document stores them. DEL-05-01 also lists this file; the
# resolution rule, in the operating_conditions folder beside it, is DEL-05-01's alone.
- core/product_physics/src/operating_conditions.rs
# The one document validator and the change kinds that write this deliverable's members. The
