id: DEL-02-05
name: Project persistence and round-trip serialization
needs:
- from: DEL-00-04
  condition: >-
    Each kind of persisted document has one current version, a reader refuses every other version
    by name without rewriting the document, a JSON payload is hashed as SHA-256 over its RFC 8785
    canonical form, and storage is a local SQLite project store changed only through application
    services.
  gating: true
- from: DEL-00-03
  condition: >-
    A caller changes durable state only through an application-service command, and every command
    returns a result envelope with its diagnostics.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the fields a diagnostic record carries (code, class, severity,
    source, affected object, message, remediation, provenance) and the result envelope that carries
    them.
  gating: true
- from: DEL-02-01
  when: Classifying a document's version and validating it on open
  condition: >-
    The model document has one current version, named once per language, and one validator that
    refuses a malformed document by name wherever a document enters, without repairing it.
  gating: true
- from: DEL-02-02
  when: Finding a missing or incompatible unit in a persisted document
  condition: >-
    The unit catalog names each unit's dimension, so that a missing or incompatible unit in a
    persisted document is found and never defaulted.
  gating: true
- from: DEL-08-02
  when: Computing a model hash or an envelope hash
  condition: >-
    Canonical JSON has one implementation of RFC 8785 with SHA-256 hashing, and the model hash is
    computed by it.
  gating: true
- from: DEL-02-03
  when: Storing a review record
  condition: >-
    Human acceptance is a record outside the automatic statuses, bound to the hashes of the
    content it concerns, and no status asserts code compliance.
  gating: true
- from: DEL-14-02
  when: Opening the runs of a project whose model document is retired
  condition: >-
    A recorded run keeps its own format and is listed, read and compared by the project's identity
    without a model-document version check.
  gating: true
- from: DEL-12-01
  when: Writing a recovery record or a backup copy
  condition: >-
    Project, transient and backup data are kept in local paths under the user's control that are
    private by default, and nothing in them is transmitted.
  gating: true
- from: DEL-08-01
  when: Writing a recovery record
  condition: >-
    The atomic file writer leaves at its destination either the whole new file or what was there
    before, and reports whether the write's durability was confirmed.
  gating: true
- from: DEL-17-02
  when: Round-tripping a project through the portable package
  condition: >-
    A package lists every member it emits, and a hash recorded for a JSON member or a manifest is
    computed on the project's canonical JSON hash basis.
  gating: true
- from: DEL-13-04
  when: Examining the round trip of a physical model through the persistence envelope
  condition: >-
    Every committed document in the transform reference format validates against that format, and
    the transform derives an analytical model from a physical one.
  gating: false
code_paths:
# The persistence envelope, its contract document and the headless persistence service.
- schemas/project_persistence.schema.yaml
- docs/architecture/persistence_contract.md
- core/project_persistence/**
# Persisted projects and version cases. The saved-state and recorded-run witnesses in the same
# folder are also listed by DEL-14-01 and DEL-14-02, whose records they are.
- fixtures/persistence/**
- fixtures/model_document/version_states.json
# The version states and refusals. The current version in model_format.rs is named by DEL-02-01.
- core/product_physics/src/model_format.rs
- core/model_operations/operation_applier/src/model_document_version.rs
- apps/desktop/src-tauri/src/model_document_version.rs
# Only the project store commands in lib.rs are this deliverable's; the file is shared by every
# deliverable with a desktop command.
- apps/desktop/src-tauri/src/lib.rs
- apps/desktop/src/services/projectService.ts
- apps/desktop/src/features/project-validation/ProjectValidationPanel.tsx
# Opening a model document file and exporting a stored document refused at open. DEL-07-11 owns
# the open and save surfaces in the desktop.
- apps/desktop/src-tauri/src/model_document_file.rs
- apps/desktop/src/services/modelDocumentFile.ts
- apps/desktop/src-tauri/src/stored_model_document_export.rs
- apps/desktop/src/features/model-file/storedDocumentExport.ts
# The package reader's version rule. The reader sits in the report package crate, which is
# DEL-08-01's and DEL-08-06's.
- core/reporting/report_package/src/reader.rs
# Autosave and backup. DEL-12-01 also lists the native files, for the paths they write to.
- apps/desktop/src-tauri/src/autosave.rs
- apps/desktop/src-tauri/src/autosave_commands.rs
- apps/desktop/src-tauri/src/backup.rs
- apps/desktop/src/features/autosave/**
- tests/test_persistence_schema.py
