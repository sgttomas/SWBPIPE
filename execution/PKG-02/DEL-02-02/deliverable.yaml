id: DEL-02-02
name: Unit system and dimensional-analysis core contract
needs:
- from: DEL-02-01
  when: Working with the units a model document stores (AC-007, AC-009 to AC-011)
  condition: >-
    The model document stores each dimensional value as a quantity with the unit it was entered
    in, carries the project's units as one map of unit keys, and holds coordinates in the project
    length unit.
  gating: true
- from: DEL-16-06
  when: Changing a project unit
  condition: >-
    The operation engine applies only an accepted, valid operation whose basis is the current
    model hash, leaves the document unchanged on every refusal, and behaves the same in the native
    and the web engine.
  gating: true
- from: DEL-02-05
  when: Refusing a stored document that lacks its units map
  condition: >-
    A stored document refused at open can be exported to a file the user chooses, exactly as the
    store holds it, with the store opened read-only.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the fields a diagnostic record carries (code, class, severity,
    source, affected object, message, remediation, provenance).
  gating: true
code_paths:
# The unit catalog, its vocabulary and the tool that builds the unit authority from it.
- core/units/**
- schemas/units.schema.yaml
- fixtures/units/**
- tools/units/build_units_authority.py
- tests/test_units_schema.py
- tests/test_units_authority_setup.py
# Project unit selection and display units. The files sit in the operation applier, whose engine
# is DEL-16-06's.
- core/model_operations/operation_applier/src/project_units_authoring.rs
- core/model_operations/operation_applier/src/display_units.rs
# The desktop's catalog, conversion and display services, and the project-units and display-units
# surfaces. DEL-07-05 and DEL-08-04 use the display-units module for result and report display.
- apps/desktop/src/services/unitCatalogService.ts
- apps/desktop/src/services/unitConversion.ts
- apps/desktop/src/services/displayQuantityService.ts
- apps/desktop/src/services/displayQuantityPrecision.test.ts
- apps/desktop/src/features/display-units/**
- apps/desktop/src/features/project-units/**
# Only the blank-project builders that write the units map are this deliverable's; the service is
# DEL-02-05's.
- apps/desktop/src/services/projectService.ts
