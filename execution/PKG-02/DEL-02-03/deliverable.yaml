id: DEL-02-03
name: Code-neutral analysis boundary model
needs:
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the fields a diagnostic record carries and distinguishes invalid
    input, an incomplete model, a mechanics result, a rule-check result and a need for human
    review.
  gating: true
- from: DEL-05-04
  condition: >-
    The analysis status semantics give each of the seven statuses one meaning and one authority,
    and the status schema admits exactly the six automatic statuses as software output.
  gating: true
- from: DEL-05-04
  when: Examining that no surface writes a status outside the vocabulary
  condition: >-
    Every schema and interface that carries an analysis status (results, analysis run, headless
    runner, the API contract) admits only the six automatic statuses and refuses a human-approval,
    passed or code-compliance status as software output.
  gating: true
- from: DEL-05-04
  when: Presenting a human acceptance reference
  condition: >-
    Where the product presents a human acceptance record with content, a record whose bound hash
    differs from that content's hash is presented as not applying to it.
  gating: true
code_paths:
# The boundary record. The status vocabulary and the status envelope
# (schemas/analysis_status.schema.yaml) are DEL-05-04's.
- schemas/analysis_boundary.schema.yaml
- docs/architecture/code_neutral_analysis_boundary.md
- fixtures/analysis_boundary/**
- tests/test_analysis_boundary_schema.py
checks:
- tests/test_analysis_boundary_schema.py
# DEL-05-04's check of its status schema. Here it observes that the boundary schema's status
# enumerations equal that schema's.
- tests/test_analysis_status_schema.py
