id: DEL-12-01
name: Local-first storage and private data paths
needs:
- from: DEL-00-04
  condition: >-
    The local storage profile is a local SQLite project store with rebuildable sidecars and large
    files referenced in place, with no hosted database, daemon, required network, cloud sync or
    telemetry path, and the store is changed only through application services.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the fields a diagnostic record carries (code, class, severity,
    source, affected object, message, remediation, provenance) and the six warning classes, and a
    boundary may declare local classes of its own.
  gating: true
- from: DEL-00-07
  condition: >-
    A plugin's or adapter's declaration grants nothing by itself and lifts no control: one that
    requests a bypass or an ungranted capability is refused.
  gating: true
- from: DEL-02-05
  condition: >-
    The store is reached only through application services, and no adapter or plugin has SQL
    access.
  gating: true
- from: DEL-01-02
  condition: >-
    The boundary policy names the classes of private user data, says they stay in user-controlled
    paths, and defines the redistribution-status and review-status values a storage record
    carries.
  gating: true
- from: DEL-02-05
  condition: >-
    Persistence transmits nothing and opens no network connection; the project store is opened at
    the location the desktop's placement gives; a recovery record is written in the application's
    autosave folder and a backup copy in the folder the user chose; a project returns from a save
    and open as saved; a store whose own schema is older is migrated forward and one that is newer
    is refused before any write; and a persisted rule-pack reference says whether the pack is
    private or public, keeps its version, checksum, source note and redistribution status, and
    returns from a round trip as saved.
  gating: true
- from: DEL-12-05
  condition: >-
    The threat model names the local-storage threat (private data stored in a public or example
    path, or committed by accident) and the controls it requires of storage.
  gating: false
code_paths:
- docs/security/local_first_storage_policy.md
# The storage guard. route_control.py in the same folder is the export route admission, which is
# DEL-12-02's.
- core/security/local_first_storage/__init__.py
- core/security/local_first_storage/controls.py
# Only the placement of the store (app_store_path and the carry-forward from the former bundle
# identifier) and the reported storage capability are this deliverable's; the file is shared by
# every deliverable with a desktop command.
- apps/desktop/src-tauri/src/lib.rs
# Only the bundle identifier, which names the local data directory. DEL-07-11 and DEL-10-04 own
# the rest of the file.
- apps/desktop/src-tauri/tauri.conf.json
# DEL-02-05's autosave and backup code. Listed for the locations it writes to, on which this
# deliverable's placement criteria are observed.
- apps/desktop/src-tauri/src/autosave.rs
- apps/desktop/src-tauri/src/autosave_commands.rs
- apps/desktop/src-tauri/src/backup.rs
checks:
- tests/security/test_local_first_storage_policy.py
- apps/desktop/src-tauri/src/autosave_commands_tests.rs
- apps/desktop/src-tauri/src/backup_tests.rs
- apps/desktop/e2e/b3b-project-persistence.spec.ts
