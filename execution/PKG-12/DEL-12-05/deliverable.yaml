id: DEL-12-05
name: Security threat model
needs:
- from: DEL-01-02
  condition: >-
    The boundary policy names the classes of protected content and of private user data, the
    provenance record, and the quarantine rule for suspected protected content.
  gating: true
- from: DEL-02-04
  condition: >-
    The extension contract says an extension attaches only at a declared extension point, has no
    direct path to the domain core, the solver, report controls or project storage, and goes
    around no governance, validation, diagnostic or data-boundary control.
  gating: true
- from: DEL-01-04
  condition: >-
    The claims registry is the single source of boundary language, and no registered statement
    states or implies certification, approval or code compliance.
  gating: true
- from: DEL-00-07
  condition: >-
    The boundary map lists every seam between the layers, marks each internal or public, and says
    a plugin's or adapter's declaration grants nothing.
  gating: false
- from: DEL-00-06
  condition: >-
    The diagnostic contract names the product's six warning classes, the provenance, assumption
    and IP-boundary classes among them.
  gating: false
code_paths:
- docs/security/threat_model.md
checks:
- tests/test_security_threat_model.py
