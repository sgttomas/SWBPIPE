id: DEL-12-03
name: Telemetry off-by-default design
needs:
- from: external:owner
  condition: >-
    The owner approves a telemetry design: the endpoint, the event allowlist for the product
    version, the consent surface, the stored setting and the retention rule.
  when: Before any telemetry event is collected or any telemetry transport is added
  gating: true
- from: external:owner
  condition: >-
    The owner decides whether a user may ever select private data for a telemetry payload. Until
    then no private engineering or code data is eligible for telemetry under any setting.
  when: Reconciling the telemetry policy, the threat model and the product contract
  gating: false
- from: DEL-01-02
  condition: >-
    The boundary policy names the classes of private user data and protected content and says
    telemetry excludes them by default.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the fields a diagnostic record carries (code, class, severity,
    source, affected object, message, remediation, provenance).
  gating: true
- from: DEL-00-07
  condition: >-
    A plugin's or adapter's declaration grants nothing by itself, and no capability exists without
    an explicit grant.
  gating: false
- from: DEL-01-04
  condition: >-
    The claims registry is the single source of boundary language, and no registered statement or
    display form states or implies certification, approval or code compliance.
  gating: false
- from: DEL-05-04
  condition: >-
    The automatic analysis statuses are a fixed vocabulary in which mechanics solved and user-rule
    checked are distinct and none states human approval.
  gating: false
- from: DEL-12-02
  condition: >-
    Every saved or downloaded file leaves the desktop only through a catalogued route whose
    wrapper returns its controlled export before any save, and a blocked export exposes nothing.
  when: Saving the panel's state file
  gating: true
- from: DEL-12-05
  condition: >-
    The threat model names the telemetry threat and requires telemetry to be off by default and
    opt-in.
  gating: false
code_paths:
- docs/security/telemetry_policy.md
- core/security/telemetry_policy/**
- apps/desktop/src/services/telemetryPolicyService.ts
- apps/desktop/src/features/telemetry/**
checks:
- tests/security/test_telemetry_policy.py
- apps/desktop/src/services/telemetryPolicyService.test.ts
