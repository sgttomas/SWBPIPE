id: DEL-12-04
name: Secret and private-library handling
needs:
- from: DEL-12-01
  condition: >-
    Private libraries and rule packs have a private path class outside every public repository
    path, and the storage guard blocks a private record headed to a public or remote context.
  gating: true
- from: DEL-12-02
  condition: >-
    A private value on a public, shared or downstream export route is redacted, a route outside
    the catalogue exposes nothing, and the product assembles no issue or support bundle.
  gating: true
- from: DEL-12-03
  condition: >-
    A telemetry event attempt that names private-library, private-rule-pack, local-path, secret or
    credential content is rejected under every configuration.
  gating: true
- from: DEL-01-02
  condition: >-
    The boundary policy defines the redistribution-status values (public permissive, private only,
    unknown, protected suspected) and the review-status values (pending, accepted, rejected,
    quarantined) a reference record carries.
  gating: true
- from: DEL-03-07
  condition: >-
    The local library store keeps only a library accepted as private and local; an import with
    missing provenance or redistribution status is flagged or rejected; and content suspected
    protected is quarantined and never stored.
  gating: true
- from: DEL-06-04
  condition: >-
    A rule-pack lifecycle record carries the pack's identity, version, source notice,
    redistribution and privacy status and checksum, and a pack the product creates for a user is
    private by default.
  gating: true
- from: DEL-10-02
  condition: >-
    The adapter gate dispatches no adapter, and refuses a declaration that turns off a control,
    exposes the store, or allows private-data transmission by default.
  gating: true
- from: DEL-16-06
  condition: >-
    The model-provider credential is held in the operating system's credential store and is never
    written to a project, a report, a log or a diagnostic.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the fields a diagnostic record carries and the warning classes,
    the provenance and IP-boundary classes among them.
  gating: true
- from: DEL-12-05
  condition: >-
    The threat model names the secrets threat (a credential in a project file, report, log,
    example or test) and the controls it requires.
  gating: false
code_paths:
- docs/security/secret_private_library_handling.md
- core/security/secret_private_library/**
checks:
- tests/security/test_secret_private_library_handling.py
