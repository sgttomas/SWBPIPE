- validation/benchmarks/physics_audit_regression/tests/*.rs
- validation/benchmarks/physics_audit_regression/src/lib.rs
- core/product_physics/tests/w9_solver_benchmarks.rs
- core/product_physics/tests/w16_imposed_motion.rs
- tests/test_reference_system_fixture.py
- tests/test_reference_system_records.py
- core/product_physics/tests/reference_system_generated_weight_standing.rs
- tests/test_qualification_gate.py
- tests/test_qualification_physics.py
- tests/test_qualification_physics_structure.py
- tests/test_qualification_physics_integration.py
- tests/test_qualification_load_reference.py
