id: DEL-09-04
name: Validation manual skeleton
needs:
- from: DEL-09-01
  condition: >-
    Every mechanics benchmark case has its inputs, its independently derived expected values with
    their derivation and its provenance record, and a run reports each expected value beside the
    observed value with the solver version and the tolerance applied.
  gating: true
  when: Generating the mechanics case pages and writing the element verification section.
- from: DEL-09-02
  condition: >-
    Every stress recovery benchmark case has its inputs, its hand-calculated expected stresses
    with their derivation and its provenance record, and a run reports each expected stress beside
    the recovered value.
  gating: true
  when: Generating the stress case pages and writing the load and stress recovery section.
- from: DEL-09-03
  condition: >-
    Every nonlinear regression case has its inputs, its hand-derived expected support states and
    values and its provenance record, and a run reports each support's state, the iteration count,
    the convergence limits applied and the verdict.
  gating: true
  when: Generating the nonlinear case pages and writing the nonlinear support section.
- from: DEL-01-04
  condition: >-
    The claims registry holds each registered boundary statement with its canonical text and
    placement rules and the display form of each automatic status, and none states or implies
    code compliance, certification or approval.
  gating: true
  when: Writing any boundary wording or status name in the manual.
- from: DEL-10-05
  condition: >-
    The headless runner's solve, input-validation, export, benchmark and regression commands take
    a JSON request and return a JSON result, and the process exits with zero only when no blocking
    diagnostic is present.
  gating: true
  when: Writing and running the reproduction procedure.
code_paths:
- docs/validation_manual/**
- validation/evidence/reproduction/**
# The runner requests the reproduction procedure submits, their generators, and the runner outputs
# the procedure names as its expected evidence. DEL-10-05's runner tests read the same files. The
# calculation witness in the same directory tree is DEL-09-02's.
- validation/witness/inputs/**
- validation/witness/generated/tp_runner_*.json
- validation/witness/generated/del1005_*.json
