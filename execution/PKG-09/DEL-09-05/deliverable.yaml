id: DEL-09-05
name: Release quality gate checklist
needs:
- from: DEL-09-01
  condition: >-
    A run of the mechanics benchmark suite reports, per case, each expected value beside the
    observed value with the tolerance applied, and the suite fails when a required family or
    benchmark is missing or a case disagrees with its independent reference.
  gating: true
  when: Recording the solver gate for a change that affects mechanics.
- from: DEL-09-02
  condition: >-
    A run of the stress recovery benchmark suite reports, per case, each expected stress beside the
    recovered value, and the suite fails when a required behaviour is missing or a case disagrees
    with its hand calculation.
  gating: true
  when: Recording the solver gate for a change that affects stresses or result-facing values.
- from: DEL-09-03
  condition: >-
    A run of the nonlinear support regression suite reports, per case, each support's state, the
    iteration count, the convergence limits applied and the verdict, and fails when a state, a
    limit or a repeated run differs from what the case expects.
  gating: true
  when: Recording the solver gate for a change that affects nonlinear behaviour.
- from: DEL-08-05
  condition: >-
    The protected-content linter reports its findings deterministically for public report
    templates and examples, and each release-candidate scan writes a per-candidate record with the
    owner's sign-off block.
  gating: false
  when: Recording the report-template gate, and reading scan records into a gate record.
- from: DEL-10-04
  condition: >-
    The hosted desktop end-to-end workflow runs the registered end-to-end specs across both
    registered viewport projects and records, for each run, its run identifier and attempt, the
    head commit it ran, the viewport projects and specs it executed and its conclusion.
  gating: false
  when: Binding a hosted end-to-end run into an evidence sweep.
- from: DEL-01-04
  condition: >-
    The claims registry holds each registered boundary statement with its canonical text and
    placement rules, and none states or implies code compliance, certification or approval.
  gating: true
  when: Writing gate, record or release-label wording.
- from: DEL-00-08
  condition: >-
    The layered test strategy names, for each of its fourteen layers, the obligations it verifies,
    the kind of evidence and the checks that realise it.
  gating: false
  when: Naming the evidence a gate family requires.
- from: DEL-09-04
  condition: >-
    Every section and case page of the validation manual declares its evidence class and its
    evidence state.
  gating: false
  when: Stating validation status in a release-governance record.
code_paths:
- docs/RELEASE_QUALITY_GATES.md
- tools/release/check_release_readiness.py
- tools/release/run_evidence_sweep.py
- tools/release/run_release_gate_records.py
- tools/release/release_gate_record_schema.json
- tools/release/run_coverage_telemetry.py
- tools/release/coverage_telemetry_schema.json
- validation/evidence/gates/**
- validation/evidence/coverage/**
# The release-candidate content scan (tools/release/run_release_candidate_scan.py and
# tests/test_release_candidate_scan.py) is DEL-08-05's under DEC-058 and is not listed here.
checks:
- tests/test_release_readiness_script.py
- tests/test_evidence_sweep.py
- tests/test_release_gate_records_script.py
- tests/test_coverage_telemetry_script.py
