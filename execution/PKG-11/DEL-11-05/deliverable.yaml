id: DEL-11-05
name: Contributor tutorial and onboarding
needs:
- from: DEL-01-01
  condition: >-
    The governance baseline states the project licence, records one human project authority as
    sole maintainer and sole release authority, and its documentation index leads to the
    invariant catalogue, the boundary policy and the claims registry. The tutorial names the
    licence and the maintainer as recorded there and starts the reader from that index.
  gating: true
- from: DEL-01-02
  condition: >-
    The boundary policy names the content the public repository may not contain, the provenance
    record public data must carry and the quarantine steps for content that appears protected.
    The tutorial's safe contribution checklist and its stop rule are taken from it.
  gating: true
- from: DEL-01-03
  condition: >-
    The contributor workflow states what a contributor must attest and record, the route for
    each evidence state and the disposition record, and states that external contribution
    intake is closed with no contributor legal instrument adopted. The tutorial teaches that
    workflow as written and adds nothing to it.
  gating: true
- from: DEL-11-02
  condition: >-
    The developer guide states, for a change to the solver or the rule-pack machinery, the layer
    it belongs in, the controls it must pass and the evidence it needs. The tutorial sends a
    contributor there for those and does not restate them.
  gating: false
code_paths:
- docs/contributor_guide/**
