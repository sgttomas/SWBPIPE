id: DEL-11-04
name: Invented educational example models
needs:
- from: DEL-02-01
  condition: >-
    There is one model document format with one current version, a schema and a document
    validator that refuses a malformed document by name, and a document that passes is opened
    from a file. Each example is such a document.
  gating: true
- from: DEL-02-05
  condition: >-
    A model document of the current version saved to the project store and reopened returns
    equal content and the same model hash, and a document of any other version is refused by
    name. Each example survives that round trip.
  gating: true
- from: DEL-04-07
  condition: >-
    The product solve runs each load case of a valid model document and publishes displacements,
    member actions and support loads with their units and diagnostics, or refuses by name what
    it does not admit. Each example solves, or shows the named finding its description says it
    demonstrates.
  gating: true
- from: DEL-06-05
  condition: >-
    The invented example rule pack is published with a public invented-example classification
    and carries the pack checksum of its own content. The fake-rule-pack example cites that pack
    by identity, version and checksum.
  gating: true
- from: DEL-06-04
  condition: >-
    A pack's recorded checksum is SHA-256 over the RFC 8785 canonical form of the pack document
    with its checksum member excluded, and it does not depend on a path, a time or a session.
    The checksum the fake-rule-pack example cites for the invented pack is that one.
  gating: true
- from: DEL-06-03
  condition: >-
    A rule-check run reports each check on each basis as within the user's limit, exceeding it
    or incomplete, names every missing input of an incomplete check, and leaves the mechanics
    status as it was. The fake-rule-pack example's description states the outcome that run
    gives on it.
  gating: true
- from: DEL-01-02
  condition: >-
    The boundary policy states that public examples use invented or permissively sourced data
    and contain no protected standards text, protected table, proprietary formula, private
    rule-pack content or private project data, and that a public example rule pack uses
    invented, non-code values only and carries a clear non-engineering notice. It defines the
    provenance record every public data record carries, with its redistribution and review
    status values. Every data set of an example carries that record, and the examples use
    invented data only.
  gating: true
- from: DEL-08-05
  condition: >-
    The release-candidate scan covers public examples as an artifact class, with the
    protected-content lint over their text and a provenance check on their data records. The
    examples pass it with no blocking finding.
  when: Scanning a release candidate
  gating: false
code_paths:
- examples/models/invented/**
# This deliverable's test of its own example files. DEL-06-05 and DEL-09-05 cite it as a check
# only. It compares the checksum the fake-rule-pack example cites with DEL-06-05's pack, so a
# change to that pack's content changes the example file here.
- tests/test_invented_example_models.py
checks:
- tests/test_invented_example_models.py
