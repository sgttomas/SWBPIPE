id: DEL-11-03
name: 'Theory notes: classical to modern centerline analysis'
needs:
- from: DEL-01-02
  condition: >-
    The boundary policy names the classes of content the public repository may not contain,
    standards text, tables, examples and code-specific formulas among them, and the quarantine
    rule for content that appears protected. The notes keep those classes out and send a
    doubtful source to quarantine by that rule.
  gating: true
- from: DEL-04-01
  condition: >-
    The frame kernel models a piping system as a 3D centerline frame with six degrees of
    freedom at every node, local-to-global transforms, global assembly and reduction for
    restraints and prescribed displacements. The centerline note explains that model.
  gating: true
- from: DEL-04-02
  condition: >-
    The straight pipe element gives a stiffness from explicit section and material properties,
    equivalent nodal loads for member loads and free strain, and end actions and station
    resultants after the solve. The centerline note's account of elements and resultants is of
    that element.
  gating: true
- from: DEL-04-07
  condition: >-
    The product solve runs each load case as a linear solve or as the nonlinear iteration over
    the supports' states, on the exact pressure route, and refuses by name what it does not
    admit. The notes' coverage of the sustained and operating analyses explains that method and
    its refusals.
  gating: false
- from: DEL-05-01
  condition: >-
    Each load of a case becomes forces and moments at nodes, loads along members, free strain or
    prescribed movement at supports; static-equivalent seismic and wind loads are generated from
    the model's mass and the user's inputs; and the hydrostatic test is a flagged test condition
    with the user's pressure and contents and with spring supports held. The notes' coverage of
    the hydrotest, wind, static seismic and seismic anchor movement analyses explains those
    methods.
  gating: false
- from: DEL-05-02
  condition: >-
    A combination is formed row by row over solved results on one of five bases (signed sum,
    subtraction, envelope, absolute sum, SRSS), a subtraction may be declared operating minus
    sustained, and a combination is withheld by name when its fixed-load count or modulus basis
    does not allow it. The notes' coverage of expansion and of the seismic combinations
    explains those definitions.
  gating: false
- from: DEL-04-09
  condition: >-
    Modal analysis uses the mass of the self-weight basis, takes its extraction bound, modulus
    basis and weight-to-mass acceleration from the user, checks each extracted set for
    integrity and completeness, and refuses by name what it does not admit. The notes' coverage
    of modal analysis explains that method.
  gating: false
- from: DEL-04-10
  condition: >-
    Response-spectrum analysis forms modal responses to user-entered spectra on the modal basis,
    combines them across modes and directions by the user's choices, adds the missing-mass
    correction when applied, and treats snubbers as restraints in the dynamic analysis only.
    The notes' coverage of response spectrum explains that method.
  gating: false
- from: DEL-04-11
  condition: >-
    Hanger sizing forms each candidate's load from a weight solve with the candidates rigid and
    its positions from solves with the candidates replaced by their loads, applies the user's
    load, travel and variation tests to the records of the user's library, selects by the user's
    rule and verifies the selection by solving again. The notes' coverage of hanger sizing
    explains that method.
  gating: false
- from: DEL-09-01
  condition: >-
    Each mechanics benchmark has independently derived expected results with its derivation.
    Where a note says how a method is verified, it points to those references and offers no
    product output as evidence.
  gating: false
code_paths:
- docs/theory/**
