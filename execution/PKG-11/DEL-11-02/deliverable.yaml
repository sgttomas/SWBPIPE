id: DEL-11-02
name: Developer guide for solver and rule packs
needs:
- from: DEL-00-01
  condition: >-
    The architecture decision records state the decision in force for each architecture choice,
    with the owner's ruling. The guide states a choice only as its record does and makes none.
  gating: true
- from: DEL-00-02
  condition: >-
    The layer map assigns every module to one of the eleven layers, states each layer's
    responsibility and fixes the direction of dependencies. The guide's architecture map
    repeats that assignment and direction.
  gating: true
- from: DEL-00-06
  condition: >-
    A diagnostic carries a code, a warning class, a severity, its source, the affected object,
    a message, a remediation and provenance, and a result envelope carries an outcome kind and
    its diagnostics. The guide's diagnostics section describes that record and envelope.
  gating: true
- from: DEL-00-07
  condition: >-
    The adapter and plugin rule names what data must pass before it reaches the core and states
    that no plugin or adapter gets around domain validation, the rule sandbox, result envelopes
    or report controls. The guide's no-bypass rule is that rule.
  gating: true
- from: DEL-00-08
  condition: >-
    The test strategy names fourteen layers and, for each, the obligations it verifies and the
    kind of evidence. The guide's test discipline names evidence only of those kinds.
  gating: true
- from: DEL-01-02
  condition: >-
    The boundary policy names the content the public repository may not contain, the provenance
    record public data must carry and the quarantine steps for suspected protected content. The
    guide's contribution boundaries and stop rule are taken from it.
  gating: true
- from: DEL-02-01
  condition: >-
    There is one model document format with one current version, a schema and a validator that
    refuses a malformed document by name. The guide names that document as the model every tool
    reads and writes.
  gating: true
- from: DEL-02-02
  condition: >-
    Every quantity carries a unit from the unit catalog, and a missing, unknown or dimensionally
    wrong unit is stopped with a named finding. The guide's unit-aware data-flow requirement
    rests on that.
  gating: true
- from: DEL-04-01
  condition: >-
    The frame kernel assembles and solves a 3D centerline/frame stiffness system with six
    degrees of freedom at every node, deterministically, in a sparse and a dense mode. The
    guide's solver architecture describes that kernel.
  gating: true
- from: DEL-06-01
  condition: >-
    The rule-pack format carries identity, version, source notice, classification and
    redistribution status, provenance, required inputs, value slots, formula declarations,
    checks and a checksum record. The guide's rule-pack architecture lists those contents.
  gating: true
- from: DEL-06-02
  condition: >-
    No rule expression can cause the evaluator to read or write a file, open a network
    connection, start a process or load code, and every quantity in an expression carries a
    dimension and a unit. The guide's description of the evaluator boundary states that.
  gating: true
- from: DEL-10-01
  condition: >-
    The public API and plugin contract is schema-first, with command, query, job, diagnostic and
    result-envelope concepts, and a mutating operation goes through an application-service
    command that keeps validation, units, provenance and report controls. The guide describes
    extension surfaces only in those terms.
  gating: true
code_paths:
- docs/developer_guide/**
