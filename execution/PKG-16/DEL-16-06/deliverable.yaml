id: DEL-16-06
name: Controlled model operation application
needs:
- from: DEL-16-01
  condition: >-
    The operation contract defines the form of an operation and of a batch and a closed taxonomy
    of operation kinds, change kinds and target object types, and the published schema, the
    interactive operation vocabulary and the operations the route applies are reconciled.
  gating: true
- from: DEL-16-02
  condition: >-
    A validate-only run on this engine returns, for an operation or batch, either a deterministic
    preview of exactly the changes an apply makes or the named refusal the apply would give, names
    the model hash it was evaluated on, and returns no model document.
  gating: true
- from: DEL-16-03
  when: Applying a batch that arrives by a product route
  condition: >-
    A batch reaches application only with the person's decision on a preview made on the current
    model hash, and each operation's author type is set by the route it came by, with agent and
    imported content stamped as agent-authored.
  gating: true
- from: DEL-16-04
  when: Building the embedded agent's host and catalog
  condition: >-
    The control on agent surfaces is defined: an agent-authored operation carries a rationale, a
    source and declared assumptions; these stay structured through review and history; and no
    record, status or product string on an agent surface states acceptance, approval, certification
    or code compliance.
  gating: true
- from: DEL-02-01
  condition: >-
    The document validator judges every candidate model document and refuses a malformed member
    with its code and JSON path, and the model document's schema defines the form of each record
    an operation creates.
  gating: true
- from: DEL-02-02
  condition: >-
    The unit catalog gives each unit symbol its dimension and conversion, and an unknown symbol, a
    symbol of another dimension and a missing unit each give a named finding and no value.
  gating: true
- from: DEL-08-02
  condition: >-
    The model hash is SHA-256 over the RFC 8785 canonical form of the model document, and the same
    document reaches the same digest through the desktop, the headless runner and the operation
    engine.
  gating: true
- from: DEL-02-05
  when: Examining AC-004 after save and reopen
  condition: >-
    A project saved and reopened returns a model document with the same model hash as the one
    saved.
  gating: true
- from: DEL-00-03
  condition: >-
    The transaction boundary of a model edit is defined as one operation or one atomic batch, and
    a model edit that fails leaves the model unchanged.
  gating: true
- from: DEL-07-11
  when: Publishing an applied document to the session and registering proposals
  condition: >-
    The workspace session holds the working model with its hash and revision, registers a queued
    batch unchanged, takes an applied document as the working model, and keeps the document it
    replaced as one checkpoint that undo restores.
  gating: true
- from: DEL-07-07
  when: Giving the embedded agent its solve and result tools
  condition: >-
    A solve is started only as a job through the solve command, a completed solve's run summary
    carries the model hash and run identities its result carries, and a solve that did not run
    natively is not published as a current result.
  gating: true
- from: DEL-04-07
  when: Examining AC-008 on the reference system
  condition: >-
    The exact pressure route solves the reference system of exit criterion 1 in the desktop with
    no admitted family refused, and refuses a geometry-only bend by name with a message to
    realize it.
  gating: true
- from: DEL-07-08
  when: Applying a batch from the review surface
  condition: >-
    The review queue shows a registered batch's operations, author, model basis and declared
    assumptions equal to the batch as registered and the engine's validate-only preview, offers
    Apply only once the batch is validated and the preview is shown, and passes the engine no
    decision but the user's own Apply or Reject.
  gating: true
- from: DEL-09-01
  when: Examining AC-008 on the reference system
  condition: >-
    The reference system of exit criterion 1 is specified, with its model document, its run sheet
    and its named key results.
  gating: true
- from: DEL-10-04
  when: Examining AC-008 and AC-009 in the packaged application
  condition: >-
    The application build includes the supplier binary, its pin manifest and its licence files
    exactly as pinned, and fails when the supplier it was given differs from the pin.
  gating: true
code_paths:
# The operation engine. Within this crate the domain modules that other deliverables list by name
# are theirs: document_validator.rs, model_data_authoring.rs, model_settings_authoring.rs and
# condition_set_authoring.rs (DEL-02-01); project_units_authoring.rs and display_units.rs
# (DEL-02-02); model_document_version.rs (DEL-02-05); library_apply.rs (DEL-03-01); model_checks.rs
# (DEL-04-06); pressure_authoring.rs, bend_authoring.rs and b7b_transport_tests.rs (DEL-04-07);
# retained_semantics_binding.rs (DEL-04-08). In src/lib.rs and src/atomic_batch.rs the
# validate-only mode, the checks and the preview rows are DEL-16-02's. The rest, with the tests of
# the same subjects, is this deliverable's.
- core/model_operations/operation_applier/**
- fixtures/model_operations/contract_corpus/**
# The published form of the outcome is schemas/operation_outcome.schema.json, which DEL-16-02 lists
# for both modes; the members an application adds to it (the acceptance record, the hash applied to
# and the resulting hash) are this deliverable's.
# The desktop's routing adapters to the engine.
- apps/desktop/src/services/operationService.ts
- apps/desktop/src/services/operationBatchService.ts
# The embedded agent: host, catalog, supplier pins and licence files, panel and session executors.
- apps/desktop/src-tauri/src/embedded_agent/**
- apps/desktop/src-tauri/resources/agent-capability-catalog.json
- apps/desktop/src-tauri/resources/agent-supplier-pins.json
- docs/third-party/codex-0.160.0-LICENSE.txt
- docs/third-party/codex-0.160.0-NOTICE.txt
- docs/THIRD_PARTY_NOTICES.md
- apps/desktop/src/features/embedded-agent/**
- apps/desktop/src/services/embeddedAgentSession.ts
- apps/desktop/src/services/embeddedAgentBridge.ts
# Shared with DEL-16-03, which owns it: the one list of person-entered members the agent's executor
# refuses before registration (writesUserEnteredModifier).
- apps/desktop/src/services/operationAuthorship.ts
# Shared with DEL-07-11, which owns the workspace session and the scripted-run build. In
# workspaceSession.ts the registration of an agent proposal and its standing are this
# deliverable's; in native_smoke.rs the agent journey's provider-key intake is.
- apps/desktop/src/features/workspace/workspaceSession.ts
- apps/desktop/src-tauri/src/native_smoke.rs
# The agent's journey fixtures and the tools that qualify the host. tools/agent_supplier_bundle.py
# is DEL-10-04's.
- fixtures/embedded_agent/agent-witness-pin.json
- fixtures/model_operations/agent_w9a_journey.json
- fixtures/model_operations/agent_m2_component_journey.json
- fixtures/model_operations/agent_w9a_capture_outcomes.json
- tools/agent_catalog_resource.py
- tools/agent_supplier_resource.py
- tools/agent_supplier_capture.py
- tools/agent_host_witness.py
- tools/agent_host_sandbox_probe.rs
- tools/agent_host_process_probe.c
- tools/agent_keychain_ui_monitor.swift
- tools/agent_live_session_fixture.py
- tools/agent_journey_fixture.py
- tools/agent_journey_memory_monitor.py
# The agent journey's driver. The native-smoke harness it runs in (the rest of
# apps/desktop/native-smoke/) is DEL-07-11's, as is the native command registry
# (src-tauri/src/lib.rs) the host is wired into.
- apps/desktop/native-smoke/agent-journey.js
