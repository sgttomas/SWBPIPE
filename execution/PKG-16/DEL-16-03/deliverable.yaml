id: DEL-16-03
name: User acceptance and operation audit trail
needs:
- from: DEL-16-01
  condition: >-
    An operation record carries its author type, source, rationale and assumptions, a batch carries
    its model basis, and no status of the contract states acceptance or approval.
  gating: true
- from: DEL-16-02
  condition: >-
    A validate-only run returns an outcome that names the model hash it was evaluated on, the state
    of each check and the preview rows, and returns no model document and no acceptance record.
  gating: true
- from: DEL-16-06
  when: Examining AC-002 on applied batches
  condition: >-
    An application returns an outcome that names the batch, each operation with its author, the
    model hash it was applied to and the resulting model hash; a refused application returns no
    model document and says it was refused.
  gating: true
- from: DEL-07-08
  when: Examining AC-001 through the review surface's Apply
  condition: >-
    The review queue shows a pending batch with the engine's validate-only preview, offers Apply
    only once the batch is validated and the preview is shown, and passes the engine no decision but
    the user's own Apply or Reject.
  gating: true
- from: DEL-02-05
  when: Keeping the history across save and reopen
  condition: >-
    The project store keeps a project's operation history records across save and reopen and
    returns them unchanged (DEL-02-05/REQ-037).
  gating: true
- from: DEL-08-02
  condition: >-
    A hashed JSON payload's digest is SHA-256 over its RFC 8785 canonical form, and the model hash
    is the same through the desktop, the headless runner and the operation engine.
  gating: true
- from: DEL-14-01
  condition: >-
    A saved model state carries the model hash of the document it holds, so a history record can
    name the state a batch was decided on and the state it produced.
  gating: false
code_paths:
# The author stamp on imported and requeued operations.
- apps/desktop/src/services/operationAuthorship.ts
# Shared with DEL-07-08, which owns the ledger panel. What a review-ledger record holds, built in
# this file, is this deliverable's.
- apps/desktop/src/features/operations/OperationLedgerPanel.tsx
# A reference module that builds audit records in the published schema's record form; the product
# does not call it.
- core/model_operations/audit_trail/**
# The acceptance record of an applied batch is emitted by the operation engine, in files
# DEL-16-06 lists; the batch review surface is DEL-07-08's and DEL-07-02's.
checks:
- tests/test_operation_audit_trail.py
- apps/desktop/src/services/operationAuthorship.test.ts
- apps/desktop/src/features/offline-proposal-intake/workflows.test.tsx
- apps/desktop/src/services/operationAuthorship.routes.test.tsx
- apps/desktop/src/services/operationAuthorship.bounds.test.ts
- apps/desktop/src/services/operationAuthorship.matrix.test.ts
