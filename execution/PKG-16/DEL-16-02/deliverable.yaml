id: DEL-16-02
name: Operation validation and diff preview
needs:
- from: DEL-16-01
  condition: >-
    The operation contract defines the form of an operation and of a batch, a closed taxonomy of
    operation kinds, change kinds and target object types, and for each change kind its target
    types and the form of its value.
  gating: true
- from: DEL-02-01
  condition: >-
    The document validator judges a candidate model document, refuses a malformed member with its
    code and JSON path, and leaves the document's bytes unchanged by the check.
  gating: true
- from: DEL-02-02
  when: Checking units and dimensions
  condition: >-
    The unit catalog gives each unit symbol its dimension; an unknown symbol, a symbol of another
    dimension and a missing unit each give a named finding and no value; and the dimension
    identifiers are one set.
  gating: true
- from: DEL-08-02
  condition: >-
    The model hash is SHA-256 over the RFC 8785 canonical form of the model document, and the same
    document reaches the same digest through the desktop, the headless runner and the operation
    engine.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic record is defined with its fields: code, class, severity, source, affected
    object, message, remediation and provenance, and no diagnostic value states approval or
    compliance.
  gating: true
- from: DEL-13-03
  condition: >-
    The constraint validation engine gives, for the same model, design knowledge and constraints,
    the same findings in the same order on every run; every finding names the entities it concerns
    and the source of its constraint; and the validation result states whether any finding is
    blocking, true exactly when a finding of blocking severity is present.
  when: Design-constraint validation enters the operation route
  gating: false
# The operation engine. These two files are shared with DEL-16-06: the validate-only mode, the
# checks and the preview rows are this deliverable's, and the apply mode and its outcome are
# DEL-16-06's. Other deliverables own the domain modules of the same crate and list them by name.
code_paths:
- core/model_operations/operation_applier/src/lib.rs
- core/model_operations/operation_applier/src/atomic_batch.rs
# The published form of the engine's outcome, one schema for both modes. Shared with DEL-16-06:
# the members of a validate-only outcome are this deliverable's, and the members an application
# adds (the acceptance record, the hash applied to and the resulting hash) are DEL-16-06's.
- schemas/operation_outcome.schema.json
# A second, Python implementation of operation validation and preview (contract, kinds, model
# basis, units, targets, constraint findings). The product does not call it, and the tests of
# DEL-16-03, DEL-16-04 and DEL-07-08 import it. It may stay as a reference beside the engine; no
# product route may reach it (AC-009).
- core/model_operations/validation_preview/**
checks:
# Examines the published outcome schema; the same file examines the rule-check run result schema,
# for which DEL-06-03 lists it.
- tests/test_operation_result_schemas.py
# Examines the Python module the product does not call, and no acceptance criterion of this scope.
- tests/test_operation_validation_preview.py
- core/model_operations/operation_applier/tests/document_validation_apply.rs
- apps/desktop/src/services/operationService.test.ts
- apps/desktop/src/services/operationBatchService.test.ts
