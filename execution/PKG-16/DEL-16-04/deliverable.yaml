id: DEL-16-04
name: Agent rationale and professional-boundary controls
needs:
- from: DEL-01-04
  condition: >-
    The claims registry is the single source of boundary language: it holds each registered
    boundary statement with its canonical text and placement rules, and the display forms of the
    status labels.
  gating: true
- from: DEL-16-01
  condition: >-
    An operation record has separate members for rationale, source and assumptions, carries the
    fixed professional-boundary record, and no status of the contract states acceptance or
    approval.
  gating: true
- from: DEL-16-03
  when: Examining AC-002 in the operation history
  condition: >-
    The operation history keeps, for each operation of a decided batch, its rationale, assumptions,
    author type and source as proposed, and returns them equal after save and reopen.
  gating: true
- from: DEL-12-05
  condition: >-
    The threat inventory includes an overclaim of compliance, approval or certification, and private
    data or a credential leaving through the embedded agent beyond the provider the user configured;
    every threat has its controls or open decisions, and each control named is one the product has,
    one a named deliverable's scope commits to, or one a project policy states.
  gating: false
# A reference module that builds rationale records and scans them for prohibited claims; the
# product does not call it.
code_paths:
- core/model_operations/agent_rationale/**
# In the product, the requirement of a rationale and a source on an agent-authored operation and
# the fixed boundary record are enforced by the operation engine, and the agent surfaces are the
# embedded agent's host and panel; DEL-16-06 lists those files.
checks:
- tests/test_agent_rationale_boundary.py
