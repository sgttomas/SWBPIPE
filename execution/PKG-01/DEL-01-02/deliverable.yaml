id: DEL-01-02
name: Copyright and protected-data boundary policy
needs:
- from: DEL-01-01
  condition: >-
    The governance baseline records who has authority to accept a public contribution (the sole
    maintainer, quorum one) and makes review for protected content, provenance, redistribution
    rights and private data a condition of acceptance. The policy's contribution review and the
    checklist's reviewer field refer to that authority and do not define it.
  gating: true
- from: external:owner
  condition: >-
    The owner's contributor rules are defined. The contribution review checklist is written from
    them.
  when: Writing governance/CONTRIBUTION_REVIEW_CHECKLIST.md
  gating: true
- from: external:legal-reviewer
  condition: >-
    A human or legal reviewer decides suspected protected content held in quarantine and content
    whose redistribution rights are uncertain. The policy routes such content to that review and
    draws no legal conclusion of its own; who gives the review is not yet decided.
  when: Deciding quarantined content or content whose redistribution rights are uncertain
  gating: false
code_paths:
- docs/IP_AND_DATA_BOUNDARY.md
- governance/CONTRIBUTION_REVIEW_CHECKLIST.md
