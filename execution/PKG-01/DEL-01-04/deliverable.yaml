id: DEL-01-04
name: Professional responsibility and product-claims policy
needs:
- from: DEL-05-04
  condition: >-
    The analysis-status vocabulary is the six automatic statuses (model incomplete, mechanics
    solved, rule inputs incomplete, user-rule checked, user-rule failed, human review required),
    with human approval only as an external record and no automatic code-compliance status. The
    registry's display-form table has one row per automatic status; a change to the status set
    changes the table with it.
  gating: true
- from: DEL-01-02
  condition: >-
    The boundary policy names the content that public report templates and public examples must
    not contain: protected standards content, private rule-pack content, private project data and
    proprietary data. The notice template's protected-content notice repeats that boundary and
    does not define it.
  gating: true
- from: DEL-01-01
  condition: >-
    The governance baseline's release policy names the disclosures a public release carries:
    scope, validation status, known limitations, data-boundary constraints and
    professional-responsibility limitations. The registry supplies the wording for the
    validation-status and professional-responsibility parts.
  gating: false
- from: external:legal-or-professional-reviewer
  condition: >-
    A qualified legal or professional reviewer supplies any jurisdiction-specific
    professional-practice wording. Until then the template states none.
  when: Adding jurisdiction-specific wording to the notice template
  gating: false
code_paths:
- docs/claims_registry.md
- docs/report_notice_template.md
