id: DEL-01-01
name: Project governance baseline
needs:
- from: external:owner
  condition: >-
    The owner's contributor rules are defined: who may contribute and on what terms, beyond what
    the owner has recorded (sole-maintainer review, quorum one and closed external intake;
    DEC-027, DEC-079). The maintainer and release policy is written from them and is not drafted
    without them.
  when: Writing governance/MAINTAINERS.md
  gating: true
- from: DEL-01-02
  condition: >-
    The IP and data boundary policy is at docs/IP_AND_DATA_BOUNDARY.md and the contribution review
    checklist is at governance/CONTRIBUTION_REVIEW_CHECKLIST.md. The maintainer policy points to
    both for the review gates, and the documentation index links the policy.
  gating: false
- from: DEL-01-03
  condition: >-
    The contributor workflow is at CONTRIBUTING.md and the certification template is at
    governance/CONTRIBUTOR_CERTIFICATION_TEMPLATE.md. The maintainer policy points to both for the
    contributor's certification.
  gating: false
- from: DEL-01-04
  condition: >-
    The claims registry is at docs/claims_registry.md. The documentation index links it.
  gating: false
code_paths:
# The licence text is kept in two files at the repository root.
- LICENSE
- LICENSE.md
- docs/CONTRACT.md
- docs/README.md
- governance/MAINTAINERS.md
