id: DEL-01-03
name: Contributor certification workflow
needs:
- from: DEL-01-01
  condition: >-
    The governance baseline records who reviews and accepts a public contribution: the sole
    maintainer, with a quorum of one. The workflow routes complete contributions to that
    maintainer and defines no reviewer of its own.
  gating: true
- from: DEL-01-02
  condition: >-
    The boundary policy defines the provenance record (seven named fields, with the redistribution
    status and review status value sets), the classes of protected content and private user data,
    and the quarantine rule with its default location; and its checklist is the reviewer's side of
    the two-sided record. The certification template takes its fields, values and quarantine
    route from that definition; a change to the definition changes the template with it.
  gating: true
- from: external:owner
  condition: >-
    The owner's contributor rules are defined. The contributor workflow and the certification
    template are written from them.
  when: Writing CONTRIBUTING.md and governance/CONTRIBUTOR_CERTIFICATION_TEMPLATE.md
  gating: true
- from: external:owner
  condition: >-
    The owner decides to open external contribution intake and records the decision in the
    decision register.
  when: Opening external contribution intake
  gating: true
- from: external:legal-counsel
  condition: >-
    Counsel advises the owner on the contributor legal instrument (a contributor licence
    agreement, a developer certificate of origin or an equivalent) before one is adopted.
  when: Opening external contribution intake
  gating: true
- from: external:legal-counsel
  condition: >-
    The owner or counsel reviews the project's public-facing language, including the issue
    forms and the contribution policy.
  when: Before public release
  gating: true
code_paths:
- CONTRIBUTING.md
- governance/CONTRIBUTOR_CERTIFICATION_TEMPLATE.md
- .github/ISSUE_TEMPLATE/**
