id: DEL-04-03
name: Linear support and restraint models
needs:
- from: DEL-04-01
  condition: >-
    The frame kernel numbers six degrees of freedom per node and reduces a system with restrained
    and prescribed degree-of-freedom values, the same in the sparse and dense solve modes.
  gating: true
- from: DEL-04-01
  when: Solving a model with a spring or a skewed restraint
  condition: >-
    The frame kernel adds a spring's stiffness on a named degree of freedom in its assembly, and
    forms an exact restraint basis for authored skew directions (the constraint d'u = 0 exact in
    the reduced system, together with the axis restraints and springs at the node, the spring as
    k d d'/(d'd)),
    with the lift of the reduced solution and the attribution of each reaction, the same in the
    sparse and dense solve modes.
  gating: true
- from: DEL-02-01
  condition: >-
    A support record in the model document has a stable identifier and carries its family, its
    node, the degrees of freedom it restrains, an optional direction, its stiffness and its hanger
    data, each quantity with a unit.
  gating: true
- from: DEL-02-02
  condition: >-
    The unit catalog converts support stiffnesses, displacements, rotations and forces to one
    consistent basis and rejects a dimensional mismatch before the value reaches the support model.
  gating: true
- from: DEL-09-01
  when: Examining the imposed-displacement criterion against the frozen benchmark packages
  condition: >-
    The mechanics benchmark suite holds `validation/references/w9_benchmarks` and
    `validation/references/w16_imposed_motion`, each expected value with a derivation that imports,
    reads and runs no product code and a provenance record (DEL-09-01/AC-005).
  gating: false
code_paths:
- core/solver/linear_supports/**
# In DEL-04-07's product crate, the modules that carry this deliverable's support law into the
# product solve. DEL-04-07 owns their integration into the solve. The restraint-basis algebra is
# in the frame kernel (core/solver/frame_kernel/src/restraint_basis.rs), listed by DEL-04-01;
# REQ-010 and AC-004 here are the criteria that examine it.
#   imposed_motion.rs: the classification of imposed displacements.
#   skew.rs: boundary preparation, assembly blocks, lift and attribution of skewed records.
- core/product_physics/src/imposed_motion.rs
- core/product_physics/src/skew.rs
- core/product_physics/src/skew_tests.rs
# Shared files. This deliverable's part is the support law in them; the rest of each file belongs
# to its other listed owners.
#   document_members.rs (DEL-02-01): the admission of skewed records and its codes.
#   lib.rs (DEL-04-07, DEL-02-01, DEL-05-01, DEL-05-05): the constant-effort and variable-spring
#     classification, their loads and the not-consumed warning.
#   validation.rs (DEL-04-07, DEL-03-03 to DEL-03-05): the spring-hanger and support-family checks.
- core/product_physics/src/document_members.rs
- core/product_physics/src/lib.rs
- core/product_physics/src/validation.rs
- core/product_physics/src/w16_nonlinear_motion_tests.rs
- validation/references/skew_restraints/**
- validation/references/w16_nonlinear_motion/**
checks:
- core/solver/linear_supports/src/lib.rs
- core/solver/linear_supports/src/skew_tests.rs
- core/product_physics/src/skew_tests.rs
- core/product_physics/tests/skew_restraints_references.rs
- tests/test_skew_along_direction_reader.py
- validation/references/skew_restraints/generators/skew_reference.py
- core/product_physics/tests/w16_imposed_motion.rs
- core/product_physics/src/w16_nonlinear_motion_tests.rs
- validation/references/w16_nonlinear_motion/generators/w16_nl_reference.py
- core/product_physics/tests/rt_a3_constant_effort_references.rs
- core/product_physics/tests/support_reactions_runtime.rs
