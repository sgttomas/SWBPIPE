id: DEL-04-11
name: Hanger sizing
needs:
- from: DEL-04-07
  condition: >-
    The product solve entry accepts a model document on either route with the caller's solver mode
    and settings, and publishes reactions at each restraint, nodal displacements and each nonlinear
    support's converged state. A modified copy of a stored document is admitted on the same terms
    as the stored document.
  gating: true
- from: DEL-04-03
  condition: >-
    The linear support model provides a rigid restraint of a single translational degree of freedom,
    a spring of a stated rate on that degree of freedom, and a constant force through the constant-
    effort seam, with a support force acting along the positive axis of its degree of freedom; and
    it models a variable spring hanger as a spring of its entered rate plus its entered cold load
    as a constant force on the same degree of freedom (DEL-04-03 REQ-014, AC-009).
  gating: true
- from: DEL-04-04
  condition: >-
    Nonlinear supports converge in each solve to the states that case produces, and each support's
    final state is published, so that sizing can disclose it and compare it between solves.
  gating: true
- from: DEL-05-01
  condition: >-
    A named load case's effective loads are resolved at solve time, and on a load/reference-state
    document are bounded by the case's ledger of load sources and its per-support states, so that a
    force added to a derived document is entered in the ledger and a removed support loses its
    state. A test-condition case is distinguishable from an ordinary load case, and in one that
    holds supports a held support, a variable spring included, acts as a rigid restraint with
    neither its stiffness nor its force acting.
  gating: true
- from: DEL-02-01
  condition: >-
    The model document carries a support's family, restraints, direction, stiffness, hanger and
    nonlinear members, and a spring hanger's cold, installed, hot and constant loads, travel range
    and references; a change to them goes through the one operation route. Sizing adds no member.
  gating: true
- from: DEL-03-02
  condition: >-
    The hanger library schema admits format 1.1.0, in which a record may carry a working load range
    (a minimum and a maximum force, each with provenance), and still admits 1.0.0 unchanged.
  gating: true
- from: DEL-03-07
  condition: >-
    The library import boundary validates format 1.1.0 and imports 1.0.0 unchanged; it refuses by
    name a working load range in a 1.0.0 document, a range whose ends differ in unit, a minimum not
    below its maximum, a missing end and an extra member; it preserves provenance and units; and
    the import boundary and the provenance checker return the same verdict.
  gating: true
- from: DEL-02-02
  condition: >-
    The unit catalog normalizes the request's travel allowance and the library's forces, lengths and
    rates to the consistent basis with a dimension check.
  gating: true
- from: DEL-00-06
  condition: >-
    Refusals and warnings are typed diagnostics with code, severity, source and affected object.
  gating: true
- from: DEL-14-02
  when: Before a sizing run is recorded.
  condition: >-
    The analysis-run record admits a hanger-sizing run kind in its current version.
  gating: true
- from: DEL-04-08
  condition: >-
    The retained-precision entry refuses any invocation it was not admitted for, and the memory-
    pricing law prices the actual source, the preload term included, against the registered
    profile.
  gating: true
- from: DEL-10-05
  condition: >-
    The headless runner hosts the `size-hangers` command: it passes the sizing input to this
    deliverable's entry and returns that entry's document unchanged, and supplies no engineering
    value of its own (DEL-10-05 REQ-015, AC-011).
  gating: true
- from: DEL-07-05
  condition: >-
    A results table states its units, the published frame of each row, the limitations of the route
    that produced it and the result's standing, which the hanger table and its detail view follow.
  gating: false
- from: DEL-07-07
  condition: >-
    The desktop runs engine work in a capped worker under the per-invocation memory budget, can
    cancel the worker and release its memory, and reports progress for work that runs in steps.
  gating: false
- from: DEL-08-01
  condition: >-
    A section contributed by another deliverable enters a report only through the assembled section
    model: under a governed section, with registered boundary wording and no claim of its own,
    showing a library reference as safe metadata only, and passing the report's gates
    (DEL-08-01 REQ-020). The hanger-sizing section is such a section.
  gating: false
- from: DEL-08-04
  condition: >-
    Every results table in the desktop exports to CSV through the one serializer, the hanger table
    through the adapter DEL-08-04 holds beside it, and a table without CSV export is detected as a
    failure (DEL-08-04 REQ-014, AC-002).
  gating: false
- from: DEL-04-05
  condition: >-
    The performance harness gives a hanger-sizing timing profile on the reference rack.
  gating: false
code_paths:
# The headless verb's code sits in DEL-10-05's runner; only its test is listed here. The spring
# preload of REQ-014 is carried out in DEL-04-03's support model and DEL-04-07's solve, so it has
# no path here. The table's CSV adapter (hangerSizingCsv*) is DEL-08-04's and is not listed.
- core/analysis/hanger_sizing/**
- schemas/hanger_sizing_result.schema.json
- fixtures/results/hanger_sizing_*.json
- tests/verifiers/hanger_sizing_evidence.py
- tests/test_hanger_sizing_*.py
- core/runner/headless/tests/size_hangers_cli.rs
- validation/references/hanger_sizing/**
- apps/desktop/src/features/results/HangerSizing*
- apps/desktop/src/features/results/hangerSizingResult.ts
- apps/desktop/src/features/results/hangerSizingView.ts
- apps/desktop/src/features/results/hangerSizingView.test.ts
- apps/desktop/src-tauri/src/hanger_sizing_job.rs
- apps/desktop/src-tauri/src/hanger_sizing_job_tests.rs
- apps/desktop/src/services/hangerSizingService*
- apps/desktop/src/features/hanger-sizing/**
- apps/desktop/src/App.hangerSizing.test.tsx
checks:
- core/analysis/hanger_sizing/tests/*.rs
- tests/test_hanger_sizing_*.py
- core/runner/headless/tests/size_hangers_cli.rs
- apps/desktop/src/features/results/HangerSizingPanel.test.tsx
- apps/desktop/src/features/results/hangerSizing*.test.ts
- apps/desktop/src-tauri/src/hanger_sizing_job_tests.rs
- apps/desktop/src/services/hangerSizingService.test.ts
- apps/desktop/src/App.hangerSizing.test.tsx
