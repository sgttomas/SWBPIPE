id: DEL-04-06
name: Solver diagnostics and singularity detection
needs:
- from: DEL-04-01
  condition: >-
    The frame kernel and its sparse direct solver report singular systems, singular pivots with
    their location, invalid restraints, invalid topology and orientation, non-finite input and
    mismatched shapes as distinct errors, and each sparse factorization reports its non-positive
    pivots.
  gating: true
- from: DEL-04-03
  condition: >-
    The linear support model reports each support error and finding with a code and the support's
    identity, including the findings for a skewed restraint (direction out of range, dependent
    restraints at a node).
  gating: true
- from: DEL-05-01
  condition: >-
    The primitive load contracts report each load error and finding with a code and the load's
    identity, including a load that names a missing object.
  gating: true
- from: DEL-02-03
  condition: >-
    The analysis status vocabulary has distinct states for an incomplete model and for solved
    mechanics, separate from rule-check outcomes and human approval, and has no automatic
    code-compliance state.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the fields a diagnostic record carries (code, class, severity,
    source, affected object, message, remediation, provenance) and the class vocabulary this
    deliverable's records use: solve-blocking, assumption warning and nonlinear warning.
  gating: true
- from: DEL-02-01
  when: Applying a user-set node-proximity tolerance
  condition: >-
    The model document can carry an optional node-proximity tolerance for the model, a length with
    a unit, and an edit to it goes through the model's operation route.
  gating: true
- from: DEL-02-01
  when: Running the on-demand model checks
  condition: >-
    The document validator reports each finding of the model document's member rules with a named
    code, its JSON path and whether it blocks or warns, and leaves the document unchanged.
  gating: true
- from: DEL-04-07
  when: Examining diagnostics on product solves (AC-001, AC-005, AC-007 to AC-009)
  condition: >-
    The product solve raises the diagnostics of each primitive and of the topology checks,
    publishes a singular, ill-conditioned or non-converged case with its diagnostic and no result
    marked solved, and carries each diagnostic's code, severity, source and affected references
    unchanged on both routes and in both solver modes.
  gating: true
- from: DEL-04-07
  when: Running the on-demand model checks
  condition: >-
    The product solve reports every missing or unsupported input, and every document member the
    built model cannot represent, as an explicit, named diagnostic; refuses an incomplete, invalid
    or unsupported model on every entry with the same named diagnostic and affected object; and
    lets no entry reach the kernel past a primitive's validation (DEL-04-07/CLM-001,
    DEL-04-07/AC-001).
  gating: true
- from: DEL-07-07
  when: Running the on-demand model checks in the desktop
  condition: >-
    The desktop runs the on-demand model checks within the per-invocation memory budget, refuses
    a request over the budget by name before the work starts, and can cancel the work and release
    its memory.
  gating: true
code_paths:
# The diagnostics crate is this deliverable's; no other deliverable lists it.
- core/solver/diagnostics/**
# The topology checks and the on-demand model checks. The modules sit in DEL-04-07's product crate
# and in the operation applier; these files are this deliverable's.
- core/product_physics/src/topology.rs
- core/product_physics/src/topology_tests.rs
- core/product_physics/tests/topology_checks_runtime.rs
- core/product_physics/src/validation/model_checks.rs
- core/product_physics/tests/model_checks_runtime.rs
- core/model_operations/operation_applier/src/model_checks.rs
- core/model_operations/operation_applier/tests/model_checks.rs
- apps/desktop/src/features/diagnostics/modelChecks*
- apps/desktop/src/features/diagnostics/ModelChecksPanel*
checks:
- core/solver/diagnostics/src/lib.rs
- core/product_physics/tests/topology_checks_runtime.rs
- core/product_physics/src/topology_tests.rs
- core/model_operations/operation_applier/tests/model_settings_authoring.rs
- apps/desktop/src/features/model-settings/ModelSettingsSection.test.tsx
- core/product_physics/tests/model_checks_runtime.rs
- core/model_operations/operation_applier/tests/model_checks.rs
- apps/desktop/src/features/diagnostics/modelChecks.test.ts
- apps/desktop/src/features/diagnostics/ModelChecksPanel.test.tsx
- apps/desktop/src/App.modelChecks.test.tsx
