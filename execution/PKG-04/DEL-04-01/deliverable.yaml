id: DEL-04-01
name: 3D frame stiffness kernel
needs:
- from: DEL-02-01
  condition: >-
    Nodes, elements and other model entities in the model document carry stable identifiers and are
    referred to by them, so that a kernel object reference can be bound back to the model entity it
    stands for.
  gating: false
- from: DEL-02-02
  condition: >-
    The unit catalog converts every authored quantity to one consistent basis and rejects a
    dimensional mismatch before the value reaches the kernel. The kernel records the caller's unit
    basis and converts nothing.
  gating: false
- from: DEL-02-03
  condition: >-
    The analysis status vocabulary keeps a mechanics result distinct from a rule-check outcome and
    from human approval, so that a kernel result can be reported as mechanics only.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic and result-envelope contract fixes the field set a kernel finding must fill when
    it crosses a service boundary: code, class, severity, source, affected object, message,
    remediation and provenance.
  gating: true
- from: DEL-05-03
  condition: >-
    The shear model is defined once: the energy-matched annular shear factor kappa_E
    (`timoshenko_annulus_energy_v1`) in a fixed binary64 operation order, the shear area
    A_s = kappa_E A and phi = 12EI/(G A_s L^2), with the rule for which straight members a document
    selects as Timoshenko (DEL-05-03/REQ-011, DEL-05-03/AC-004). The kernel forms its Timoshenko element from
    that definition; a change to the definition changes the kernel element with it.
  gating: false
- from: DEL-02-01
  condition: >-
    For the M3 judge held here (validation/references/m3_judge): schemas/load_reference_state.schema.json,
    which the exact route's load/reference states and pressure-source-1's resolved recovery evidence
    reach, states their shape with only the JSON Schema keywords the judge's reader evaluates
    (m3_view.SCHEMA_KEYWORDS); another keyword makes the judge refuse the records carrying that evidence
    until its reader admits it. tests/test_m3_judge_schema_keywords.py names any such keyword.
  evidence: tests/test_m3_judge_schema_keywords.py
- from: DEL-08-04
  condition: >-
    For the M3 judge held here: schemas/results_pressure_3.v0.3.schema.json's PressureContractEvidence
    names the exact route's contract-evidence members and states the shape of load_reference_states and
    exact_combinations with only the keywords the judge's reader evaluates (m3_view.SCHEMA_KEYWORDS);
    another keyword makes the judge refuse the records carrying that evidence.
  evidence: tests/test_m3_judge_schema_keywords.py
- from: DEL-04-08
  condition: >-
    For the M3 judge held here: schemas/physics_source_recovery.schema.json's ordinary and resolved
    pressure-source-1 recovery evidence, against which the judge validates that contract's evidence, uses
    only the keywords the judge's reader evaluates (m3_view.SCHEMA_KEYWORDS); another keyword makes the
    judge refuse the pressure-source-1 records whose evidence reaches it.
  evidence: tests/test_m3_judge_schema_keywords.py
code_paths:
# The frame kernel crate, with the integrity check (structural/formation_check**,
# structural/certified_recovery.rs), the arc maximum enclosure (structural/arc_maximum.rs,
# structural/arc_certificate.rs), the read-only seams DEL-04-09 uses (structural/element_reformation.rs
# and the factor accessor of sparse_direct) and the residual acceptance, all governed by this scope.
# connector.rs, tie_rod.rs and their tests are DEL-03-06's element definitions, examined under its
# criteria. restraint_basis.rs is the kernel's reduction for a restraint along an authored direction,
# examined under DEL-04-03's criteria.
# Not decided, as the scope's Ontology states: which deliverable's criteria govern exact_sum.rs and
# exact_sum/** (the exact accumulator), and structural/retained/**, structural/retained_resource.rs and
# structural/exact_boundary** (the retained-precision lanes and exact boundary DEL-04-08 and DEL-05-02
# read).
- core/solver/frame_kernel/**
- core/solver/sparse_direct/**
# The curved-bend element: DEL-03-03's definition, examined under its criteria; the kernel assembles
# and solves it. DEL-03-03 lists the same crate.
- core/solver/curved_bend/**
# The correctly rounded norms: which deliverable's criteria govern them is not decided.
- core/numerics/correct_norm/**
# The readers' recomputation of global end rows from the published local rows (REQ-018).
- core/reporting/result_export/src/global_end_evidence.rs
# Independent references held with the code above: the integrity check (kd5_member_bound, m3_judge,
# t4_o13, t4_i9), the confirmation of a converged nonlinear state (kd5_nonlinear, also examined under
# DEL-04-04/AC-010 and DEL-04-07/AC-002), and the curved-bend element (t4_i6, examined under DEL-03-03's
# criteria).
- validation/references/kd5_member_bound/**
- validation/references/kd5_nonlinear/**
- validation/references/m3_judge/**
- validation/references/t4_i6/**
- validation/references/t4_i9/**
- validation/references/t4_o13/**
# The m3_judge schema reader against the public schemas it reads at judge time.
- tests/test_m3_judge_schema_keywords.py
checks:
- core/solver/frame_kernel/src/lib.rs
- core/solver/frame_kernel/src/structural/sparse/tests.rs
- core/solver/frame_kernel/src/structural/formation_check_tests.rs
- core/solver/frame_kernel/src/structural/certified_recovery_tests.rs
- core/solver/frame_kernel/tests/timoshenko_element.rs
- core/solver/frame_kernel/tests/tie_rod_element.rs
- core/solver/frame_kernel/src/structural/tie_rod_kd5_tests.rs
- core/solver/frame_kernel/src/structural/absorption_tests.rs
- core/solver/frame_kernel/src/structural/arc_maximum_tests.rs
- core/solver/sparse_direct/src/lib.rs
- core/product_physics/tests/t4_u1_reference.rs
- core/product_physics/tests/global_end_actions_runtime.rs
- tests/test_global_end_verifier.py
- tests/test_m3_judge_schema_keywords.py
