id: DEL-04-01
name: 3D frame stiffness kernel
needs:
- from: DEL-02-01
  condition: >-
    Nodes, elements and other model entities in the model document carry stable identifiers and are
    referred to by them, so that a kernel object reference can be bound back to the model entity it
    stands for.
  gating: true
- from: DEL-02-02
  condition: >-
    The unit catalog converts every authored quantity to one consistent basis and rejects a
    dimensional mismatch before the value reaches the kernel. The kernel records the caller's unit
    basis and converts nothing.
  gating: true
- from: DEL-02-03
  condition: >-
    The analysis status vocabulary keeps a mechanics result distinct from a rule-check outcome and
    from human approval, so that a kernel result can be reported as mechanics only.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic and result-envelope contract fixes the field set a kernel finding must fill when
    it crosses a service boundary: code, class, severity, source, affected object, message,
    remediation and provenance.
  gating: true
- from: DEL-05-03
  condition: >-
    The Timoshenko straight-member formulation is defined once: the energy-matched annular shear
    factor kappa_E (`timoshenko_annulus_energy_v1`) in a fixed binary64 operation order, the shear
    area A_s = kappa_E A, phi = 12EI/(G A_s L^2) and the exact static two-node stiffness, with the
    rule for which members a model selects as Timoshenko. The kernel's code forms its element from
    that definition; a change to the definition changes the kernel element with it.
  gating: true
code_paths:
# The frame kernel crate. connector.rs, tie_rod.rs and their tests are DEL-03-06's element
# definitions, examined under its criteria.
# Not decided, as the scope's Ontology states: which deliverable's criteria govern these parts of
# the crate. No scope states a criterion for them.
#   restraint_basis.rs (the restraint basis for an authored skew direction; DEL-04-03 calls it)
#   structural/formation_check**, structural/certified_recovery.rs (the solve integrity check with
#     its established recovery and global end actions; DEL-04-07, DEL-05-01, DEL-05-02 and
#     DEL-05-03 read it)
#   structural/arc_maximum.rs, structural/arc_certificate.rs (the enclosure of the normal-stress
#     maximum along a realized arc; DEL-04-07 reads it)
#   exact_sum.rs, exact_sum/** (the exact accumulator DEL-05-02's combinations use)
#   structural/element_reformation.rs and the factor accessor of sparse_direct (the read-only
#     seams DEL-04-09 uses)
#   structural/retained/**, structural/retained_resource.rs, structural/exact_boundary** (the
#     retained-precision lanes and exact boundary DEL-04-08 and DEL-05-02 read)
- core/solver/frame_kernel/**
- core/solver/sparse_direct/**
# Not decided in the same way: the curved-bend element, the correctly rounded norms, and the
# readers' check of global end rows. No other deliverable claims the three entries below.
- core/solver/curved_bend/**
- core/numerics/correct_norm/**
- core/reporting/result_export/src/global_end_evidence.rs
# Independent references for the integrity check and the curved-bend element, held with the code
# above. kd5_nonlinear is also run by DEL-09-03 as a nonlinear validation consumer.
- validation/references/kd5_member_bound/**
- validation/references/kd5_nonlinear/**
- validation/references/m3_judge/**
- validation/references/t4_i6/**
- validation/references/t4_i9/**
- validation/references/t4_o13/**
checks:
