id: DEL-04-09
name: Modal analysis
needs:
- from: DEL-04-01
  condition: >-
    The frame kernel assembles the stiffness and reduces it by the restraints, with the curved-bend
    element and its arc length and uniform-load resultant; its sparse factorization reports the
    number of non-positive pivots of the unpivoted LDLT, which is the number of negative pivots, and
    lets a caller read the stored factor entries and pivots without mutation or allocation; and it
    re-forms element stiffness in at least double-double precision from operands the caller
    supplies (DEL-04-01/REQ-019, DEL-04-01/AC-017).
  gating: true
- from: DEL-04-02
  condition: >-
    The straight pipe element gives its stiffness in the member's own frame and the consistent nodal
    vector of a uniform load (forces wL/2 and moments of wL²/12 at each end), against which the mass
    identity a·M·r is compared node by node.
  gating: true
- from: DEL-04-03
  condition: >-
    The linear support model defines the degrees of freedom each support restrains, an axis spring
    as a stiffness on the global diagonal, a skewed spring as the rank-one term k·d·dᵀ/(dᵀd), and a
    skewed rigid restraint as an exact constraint in the authored direction; an imposed-displacement
    degree of freedom is restrained, and a constant-effort support contributes no stiffness.
  gating: true
- from: DEL-04-04
  condition: >-
    The classifier gives each nonlinear support's final state in a solved case and defines how each
    state enters the system: an active one-way or lift-off support, a closed gap and sticking
    friction are the rigid restraint on the support's degree of freedom, an inactive or open
    support is free, and a sliding support is free in its tangential degree of freedom.
  gating: true
- from: DEL-02-01
  when: Before a model containing a snubber is admitted.
  condition: >-
    The model document carries a snubber support family, with translational restraints or one skew
    direction and an optional single dynamic stiffness.
  gating: true
- from: DEL-04-10
  when: Before a model containing a snubber is admitted.
  condition: >-
    The response-spectrum deliverable defines what a snubber is in the dynamic stiffness, a rigid
    restraint of its translational degrees of freedom or of motion along its one skew direction, or
    a spring of its stated stiffness, and that every static solve ignores it.
  gating: false
- from: DEL-04-06
  condition: >-
    A model with no support, a part with no support and a mechanism are each detected and named by
    a blocking diagnostic that locates the unrestrained degree of freedom, and no result is
    published for them (DEL-04-06 AC-001).
  gating: true
- from: DEL-04-07
  condition: >-
    The product solve builds the model on the pressure-free route and on the exact pressure route,
    with no load-dependent stiffness on either; resolves a modulus basis from a load case's
    vocabulary; resolves and solves a named load case once, returning its resolved per-member state
    and its final nonlinear support states with whether each was confirmed; applies the dense
    scrutiny memory ceiling and selects the dense or sparse path by the solver mode; and bounds a
    nonlinear solve by a stated iteration cap, which the modal work estimate reads.
  gating: true
- from: DEL-05-01
  condition: >-
    Self-weight names the mass basis of each route, gives each pipe's load per length as its mass
    per length on that basis times the stated gravity, applies a mapped rigid-family component's
    own weight in place of its pipe's distributed weight, and is generated and inspected without
    changing anything in the model (DEL-05-01 REQ-015, AC-002).
  gating: true
- from: DEL-05-01
  when: Where the mass model reads a state case's contents density or a component weight's acceleration.
  condition: >-
    Self-weight resolves the contents density of a named load case into the mass per length it
    uses, and records the acceleration of each applied component-weight primitive.
  gating: true
- from: DEL-03-05
  condition: >-
    A rigid-family component is identified as such, carries its weight as an authored force at a
    centre of gravity given in global X, Y and Z from the component's node, and scales the stiffness
    of its mapped pipe by stated factors on E and G.
  gating: true
- from: DEL-04-08
  condition: >-
    The memory-pricing law prices the actual source of every priced crate against the registered
    profile, and the retained-precision entry refuses any invocation it was not admitted for.
  gating: true
- from: DEL-02-02
  condition: >-
    The unit catalog has named dimensions, with conversion witnesses, for frequency, angular
    frequency, rotation per length, length per rotation, rotational generalized mass, mass-length
    per rotation and time squared, and normalizes a frequency, an acceleration and every mass input
    with a dimension check.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostics contract admits typed refusals and warnings with code, severity, source and
    affected object.
  gating: true
- from: DEL-04-05
  when: Timing the sparse path's scale benchmarks.
  condition: >-
    The performance harness times a benchmark in an exclusive window with its build named and
    reports a timing profile.
  gating: false
- from: DEL-07-05
  condition: >-
    A results table states its units, the published frame of each row, the limitations of the route
    that produced it and the result's standing, which the modes table follows.
  gating: false
- from: DEL-08-01
  condition: >-
    A section contributed by another deliverable enters a report only through the assembled section
    model: under a governed section, with registered boundary wording and no claim of its own, and
    passing the report's gates (DEL-08-01 REQ-020). The modal analysis section is such a section.
  gating: false
- from: DEL-10-05
  when: Before a modal request can be run headless.
  condition: >-
    A command the headless runner hosts passes its input to the owning deliverable's entry and
    returns that entry's document unchanged, and the runner supplies no engineering value to it
    (DEL-10-05/REQ-015, DEL-10-05/AC-011), so that a modal command, where one is hosted, adds no
    extraction bound, acceleration or other value of its own.
  gating: false
- from: external:nrc-nureg-cr
  when: For the published-benchmark comparison.
  condition: >-
    A published piping benchmark report, first NUREG/CR-1677 Volume 1, can be transcribed under its
    own redistribution evidence (its rights statement and distribution terms) (DEL-04-09/REQ-009);
    copyrighted or adapted content inside a report is excluded.
  gating: false
code_paths:
# The modal entry sits in DEL-04-07's product crate; these files in it are this deliverable's. The
# read-only factorization accessor and the element re-formation entry it calls are in the sparse
# solver and frame kernel crates, which DEL-04-01 lists.
- core/solver/modal_eigen/**
- core/product_physics/src/modal.rs
- core/product_physics/src/modal/**
- core/reporting/modal_result/**
- fixtures/results/semantic_contract_modal_1.json
- fixtures/results/modal_*.json
- fixtures/results/modal_README.md
- tests/verifiers/modal_evidence.py
- tests/verifiers/modal_model_mass*.py
- tests/test_modal_*.py
- validation/references/f1_modal/**
- tests/modal_feasibility_oracle.py
- tests/test_dynamics_references.py
checks:
- core/solver/modal_eigen/tests/*.rs
- core/product_physics/src/modal/tests*.rs
- core/reporting/modal_result/tests/*.rs
- tests/test_modal_*.py
- tests/test_dynamics_references.py
