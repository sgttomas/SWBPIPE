id: DEL-04-02
name: Straight pipe element
needs:
- from: DEL-04-01
  condition: >-
    The frame kernel's frame element supplies the two-node straight-member local and global 12x12
    stiffness (Euler-Bernoulli, or the exact static Timoshenko element with the energy-matched
    annular shear factor), the member orientation transform, the fixed six-degree-of-freedom
    element ordering and the unit-basis dimension tags.
  gating: true
- from: DEL-09-01
  when: Examining the criteria against the frozen benchmark packages
  condition: >-
    The mechanics benchmark suite holds `validation/references/w9_benchmarks`, each expected value
    with a derivation that imports, reads and runs no product code and a provenance record
    (DEL-09-01/AC-005).
  gating: true
code_paths:
# The element crate. Its load-vector and recovery functions are called by DEL-05-01 (weight and
# free strain) and DEL-05-05 (member loads), which decide the load values and which loads a user
# may author; the element owns the equivalent-nodal-load and station mathematics.
- core/solver/straight_pipe/**
checks:
- core/solver/straight_pipe/src/lib.rs
- core/solver/straight_pipe/tests/timoshenko_loads.rs
