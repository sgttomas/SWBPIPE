id: DEL-04-04
name: Nonlinear support active-set solver
needs:
- from: DEL-04-01
  condition: >-
    The frame kernel provides the six degree-of-freedom identifiers Ux to Rz and the canonical
    dimensions for displacement, force and dimensionless quantities.
  gating: true
- from: DEL-04-03
  condition: >-
    The linear support model defines a rigid restraint on a named degree of freedom of a support
    record, and a movement imposed at a nonlinear support's own degree of freedom moves that
    support's ground (DEL-04-03/REQ-013, DEL-04-03/AC-002).
  gating: true
- from: DEL-04-07
  when: Examining the classifier in the assembled iteration (AC-003, AC-004, AC-009, AC-010)
  condition: >-
    The assembled nonlinear iteration assembles and solves each iterate, leaves the classification
    of every iterate to this classifier, under the governed convergence tolerances and iteration
    caps, and ends in the support states of the independent nonlinear references (DEL-04-07/CLM-002,
    DEL-04-07/AC-002).
  gating: true
- from: DEL-04-06
  condition: >-
    DEL-04-06 provides diagnostic records (code, severity, source, affected reference,
    remediation), classifies a residual against a caller-supplied tolerance and iteration cap as
    no diagnostic, a warning-level non-convergence or a failure-level non-convergence, and
    provides a record stating that a tolerance policy is undecided.
  gating: true
- from: DEL-09-03
  when: Examining classification and convergence against the hand calculations
  condition: >-
    The nonlinear validation suite holds the hand calculations under
    `validation/hand_calcs/nonlinear`, which import no product code, and the governed convergence
    limits of each support class: no support changes state in the final iteration, within the
    iteration cap, and a case may tighten a limit and never loosen one (DEL-09-03/REQ-007,
    DEL-09-03/AC-003, DEL-09-03/AC-004).
  gating: false
code_paths:
- core/solver/nonlinear_supports/**
checks:
- core/solver/nonlinear_supports/src/lib.rs
