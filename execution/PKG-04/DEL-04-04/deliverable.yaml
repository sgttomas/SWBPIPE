id: DEL-04-04
name: Nonlinear support active-set solver
needs:
- from: DEL-04-01
  condition: >-
    The frame kernel provides the six degree-of-freedom identifiers Ux to Rz and the canonical
    dimensions for displacement, force and dimensionless quantities.
  gating: true
- from: DEL-04-03
  condition: >-
    The linear support model defines a rigid restraint on a named degree of freedom of a support
    record, and a movement imposed at a nonlinear support's own degree of freedom moves that
    support's ground (DEL-04-03 REQ-013, AC-002).
  gating: true
- from: DEL-04-07
  condition: >-
    The assembled iteration supplies each iterate's displacements and reactions at every nonlinear
    support, measured from the support's ground, with the normal and tangential reactions of each
    friction support, and ends in the reference states on the frozen nonlinear references.
  gating: true
- from: DEL-04-06
  condition: >-
    DEL-04-06 provides diagnostic records (code, severity, source, affected reference,
    remediation), classifies a residual against a caller-supplied tolerance and iteration cap as
    no diagnostic, a warning-level non-convergence or a failure-level non-convergence, and
    provides a record stating that a tolerance policy is undecided.
  gating: true
code_paths:
- core/solver/nonlinear_supports/**
checks:
- core/solver/nonlinear_supports/src/lib.rs
