id: DEL-04-05
name: Sparse solver performance harness
needs:
- from: DEL-04-01
  condition: >-
    The frame kernel's assembly, reduction, sparse solve and dense solve can be called from outside
    the kernel on a prepared system, give the same output for the same input, and report for each
    sparse solve its ordering, stored profile size, pivot extremes and non-positive pivot count.
  gating: true
- from: DEL-04-06
  condition: >-
    The diagnostic records classify a condition ratio against supplied thresholds, map each kernel
    failure, a singular system included, to a named blocking record, and are produced in a fixed
    order for the same input (DEL-04-06/REQ-005, DEL-04-06/REQ-008,
    DEL-04-06/AC-003).
  gating: true
- from: DEL-04-07
  condition: >-
    One public solve entry takes the solve request the desktop worker sends and returns the result
    the desktop displays, and the same entry serves the desktop and the headless runner, so that a
    measurement driver calling it measures the product's solve. A solve is admitted only within
    the 12 GiB per-invocation budget on the 16 GiB base machine, and a completed solve's peak
    footprint is within it.
  gating: true
- from: DEL-04-07
  when: Building and running the registered kernel-observation checks
  condition: >-
    The registered K6 kernel-observation checks compile against the structural adapter's sparse
    assembled solve with its formation check, which can be called from outside its crate and gives
    the product's own entries for the same input. This is what those checks are built on, not a
    requirement on the product solve.
  gating: false
- from: DEL-04-01
  when: Observing the retained-precision lanes
  condition: >-
    The kernel's retained-precision lanes can be run on one case from outside the kernel and
    report the work they did by stage.
  gating: false
- from: DEL-07-07
  when: Measuring exit criterion 9
  condition: >-
    A solve job's worker reads and parses the model, calls the product solve entry, serializes the
    result and verifies it; the host then takes the result into custody, and the display reads its
    summary and pages and paints them. Each stage boundary is marked on the solve timeline with
    its fixed code (DEL-07-07/REQ-013). A change to these stages changes what the harness must
    time.
  gating: false
- from: DEL-04-06
  when: Timing the desktop's on-demand model checks
  condition: >-
    The model checks have one public entry outside the desktop that takes the model document and
    returns their report, and the desktop's check worker calls that entry, so that a driver
    calling it times that model-check work.
  gating: false
- from: DEL-02-01
  when: Generating the reference racks
  condition: >-
    The model document has one current version, and a document of that version in the shapes it
    admits opens and solves; the rack generator writes that version.
  gating: false
- from: DEL-09-01
  when: Producing the headless timing baseline
  condition: >-
    The invented reference system is a committed exact-route model document that the product
    solves, and its generator's check in the mode the file was produced with
    (`generate_reference_system.py --check --pressure-elongation all`) exits 0 only when the
    committed file is what the generator writes.
  gating: false
- from: DEL-07-11
  when: Measuring exit criterion 9 in the desktop
  condition: >-
    The desktop can be driven through a scripted run in a build made for that purpose, with file
    choosers and menus substituted, and that build's instrumentation is absent from product builds.
  gating: false
code_paths:
- core/solver/performance_harness/**
# The timing driver for exit criterion 9: it performs the desktop worker's steps on DEL-04-07's
# public entry.
- core/solver/release_timing/**
- validation/benchmarks/sparse_*.json
# The desktop measurement. The native-smoke harness it runs on (native_smoke.rs and the rest of
# apps/desktop/native-smoke/) is DEL-07-11's; these files are the performance kit only.
# Where the timeline marks and the injection sit in the solve job path is DEL-07-07's, which also
# lists native_smoke_inject.rs and solveTimeline*. What is marked and kept, and the injection's
# stand-in for the worker, are this deliverable's.
- apps/desktop/native-smoke/perf*
- apps/desktop/native-smoke/test-fixtures/tauri-2.11.1/**
- apps/desktop/src-tauri/src/native_smoke_inject.rs
- apps/desktop/src/services/solveTimeline*
# Way H's attribution instrument: the native sequence between job_done and first paint, replayed
# in order on a real worker's result (ignored tests; it drives DEL-07-07's commands unchanged).
- apps/desktop/src-tauri/src/after_worker_perf_tests.rs
# Its acceptance: the web's own decoders judge the replies the harness kept.
- apps/desktop/src/test-support/after-worker/**
checks:
- core/solver/performance_harness/src/lib.rs
- core/solver/performance_harness/tests/k6*.rs
- tests/test_performance_harness_runner.py
- tests/test_sparse_suitability_observation.py
- tests/test_sparse_default_promotion_observation.py
- core/solver/release_timing/tests/release_timing.rs
- core/solver/performance_harness/runner/test_release_runner.py
- tests/test_release_timing_runner.py
- core/solver/release_timing/tests/supervise.rs
- tests/test_release_timing_supervise.py
- tests/test_release_timing_build_identity.py
- tests/test_performance_rack_model.py
- apps/desktop/native-smoke/perf.test.mjs
- apps/desktop/src/services/solveTimeline.test.ts
- apps/desktop/src/services/solveTimelineCodes.test.ts
- apps/desktop/src/services/solveTimelineGlobal.gate.test.ts
- apps/desktop/src/services/solveTimelineGlobal.install.test.ts
- apps/desktop/src-tauri/src/native_smoke_reach_scan_tests.rs
- apps/desktop/src/features/model-file/rackModelOpen.test.ts
