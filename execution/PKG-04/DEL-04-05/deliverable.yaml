- from: DEL-04-01
  condition: >-
    DEL-04-05 observes DEL-04-01's solve boundary without changing it: the frame kernel's assembly,
    reduction and dense path, K1's sparse representation, and the in-repo sparse skyline solver
    (`sparse_direct`, DEC-023) that it measures beside the dense parity path. It needs those public
    interfaces and their deterministic ordering and storage.
  gating: true
  evidence: core/solver/performance_harness/README.md
- from: DEL-04-06
  condition: >-
    DEL-04-05 records solver conditioning and failure diagnostics through DEL-04-06's diagnostic records
    (`solver/diagnostics`: condition-ratio classification, frame and sparse failure mapping, factorization
    reports and the tolerance-policy and sparse-solver status diagnostics) in a fixed order.
  gating: true
  evidence: core/solver/performance_harness/README.md
- from: DEL-04-07
  when: K6 kernel observations
  condition: >-
    K6 stages the product's linear entry, `SparseAssemblyEvidence::solve_assembled_with_formation_check`
    in `nonlinear_integration`'s structural adapter, at its public-API boundaries and pins the staged
    result bit for bit to the adapter's own entries. DEL-04-05 needs DEL-04-07 to keep those boundaries
    public; it observes them and changes nothing.
  gating: true
  evidence: core/solver/performance_harness/src/k6/staged.rs
- from: DEL-04-01
  when: K6b W1 observations
  condition: >-
    K6b runs DEL-04-01's retained kernel through `structural::retained_api`
    (`SourceParts`, `solve_case`) and records its work by stage. DEL-04-05 needs
    that public surface and its work accounting; it asserts no time or memory bound.
  gating: true
  evidence: core/solver/performance_harness/src/k6/w1/adapter.rs
- from: DEL-04-07
  when: criterion 9 release timing
  condition: >-
    The release timing driver calls the product's public linear entry,
    `run_linear_static_preview_value_with_mode`, with the request the desktop worker sends,
    and records its time, memory and published rows. DEL-04-05 needs that entry to stay the
    one the worker calls; it observes it and changes nothing.
  gating: true
  evidence: core/solver/release_timing/src/main.rs
- from: DEL-07-07
  when: criterion 9 release timing
  condition: >-
    The driver mirrors the desktop solve worker's ordinary solve (`solve_worker.rs`:
    parse, request wrapper, entry, serialization, the result digest's parse-back) and its
    footprint measure (`ri_lifetime_max_phys_footprint`), and the runner classifies runs
    against the desktop's 12 GiB per-invocation budget (`memory_pool.rs`). A change to
    those stages or that budget needs the driver and runner re-aligned.
  gating: false
  evidence: core/solver/performance_harness/runner/release_runner.py
- from: DEL-02-01
  when: criterion 9 reference racks
  condition: >-
    The rack generator writes model documents at the current model document version, read
    from `model_format.rs` `MODEL_SCHEMA_VERSION`, in the shapes that version admits. A
    version change needs the generator's shapes re-checked and its hashes regenerated; its
    test fails until then.
  gating: false
  evidence: core/solver/performance_harness/rack/rack_model.py
- from: DEL-07-07
  when: criterion 9 desktop measurement
  condition: >-
    The desktop measurement times the product's own solve job path: publication under the
    result lease, poll, take (2R custody) and the IPC response (`solve_jobs.rs`), and the
    webview's take, decode, parse and reader registration (`previewService.ts`), which the
    solve timeline (`solveTimeline.ts`) marks without changing. The native-smoke result
    injection (`native_smoke_inject.rs`) stands in for the worker with the worker's own
    attestation functions (`solve_worker.rs` `result_digest`, `solve_attestation.rs`
    `streamed_digest`). A change to that path or those functions needs the injection and
    the timeline's marks re-aligned; the reach scan keeps the injection out of product builds.
  gating: false
  evidence: apps/desktop/src-tauri/src/native_smoke_inject.rs
- from: DEL-07-11
  when: criterion 9 desktop measurement
  condition: >-
    The perf driver runs on the native-smoke harness: the `native-smoke` cargo feature, its
    driver, plan and report commands and the chooser and menu substitutions
    (`native_smoke.rs`), and the solve timeline's global installed beside
    `__openPipeStressUiDiagnosticsV1` (`uiDiagnostics.ts`). The rack generator writes the
    model-file shape Open Model Document checks (`modelDocumentShape.ts`,
    `checkNativeOutcome`). A change to that harness, that global's installation or that
    shape needs the driver, runner or generator re-aligned; `rackModelOpen.test.ts` fails
    on a shape the desktop refuses. C1's native-smoke-only scalar reader probe uses the
    same held producer bytes and intake-bound launch model, with the existing allocation
    counter enabled only in smoke/test builds; it reports parser and reader phases without
    exporting a result or adding product authority. The bounded native-reader phase
    diagnostics use fixed timeline/native-smoke checkpoints and a capped durable runner
    journal; smoke-only wrapper expansion preserves the existing Value-reader contract,
    while the private health entry remains explicitly combined. Changed diagnostic
    boundaries, delivery or wrappers require those checkpoints and parity tests re-aligned.
  gating: false
  evidence: apps/desktop/native-smoke/perf.mjs
