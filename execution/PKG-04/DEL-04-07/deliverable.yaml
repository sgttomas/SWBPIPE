id: DEL-04-07
name: Product solve integration and nonlinear orchestration
needs:
- from: DEL-02-01
  condition: >-
    The model document has one current version whose schema defines every member the solve reads
    (nodes, pipes, sections, materials, components, supports, loads, cases, combinations, model
    settings and, for the exact route, the pressure contract with its regions and the section's
    corrosion allowance and mill tolerance), each addressable record with a stable identifier and
    each quantity with a unit.
  gating: true
- from: DEL-02-02
  condition: >-
    The unit catalog converts every authored quantity to one consistent basis and reports a
    conversion or dimension failure as a named finding. The solve defines no unit or conversion of
    its own.
  gating: true
- from: DEL-02-03
  condition: >-
    The analysis status vocabulary keeps mechanics status separate from rule-check outcomes and
    human approval and has no automatic code-compliance state, so that a solve result can state a
    mechanics status only.
  gating: true
- from: DEL-05-04
  condition: >-
    The analysis status semantics define what the mechanics, rule-check and human-acceptance
    statuses mean and that software never emits human acceptance, so that the status a solve
    publishes has one meaning for every reader.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic and result-envelope contract fixes the fields of each diagnostic a solve
    publishes (code, class, severity, source, affected object, message, remediation and
    provenance) and requires a solve's envelope to state its outcome kind, a mechanics result
    apart from invalid input and an incomplete model.
  gating: true
- from: DEL-03-08
  when: Comparing the section and mass adapter with the calculator (AC-003)
  condition: >-
    The section and mass calculator gives, from explicit outside diameter, wall, mill tolerance,
    corrosion allowance and densities, the metal area, second moments, torsion constant and mass per
    length with their units, as the values the product's adapter is compared with.
  gating: true
- from: DEL-04-01
  condition: >-
    The frame kernel assembles and solves a frame of straight, curved-bend, connector and tie-rod
    elements in the sparse and dense modes, applies restrained and prescribed degrees of freedom and
    restraints along a direction, and recovers element end actions in local and global coordinates,
    with an arc's end actions in the tangent frame at each end.
  gating: true
- from: DEL-04-01
  when: Publishing a result as established
  condition: >-
    The frame kernel judges each solve against its intended system. For every load term the solve
    supplies as primitives it re-forms the term, and it gives the established recovery of straight
    members, arcs, connectors, tie rods and supports, including once on the converged state of a
    nonlinear case; a formed term without primitives makes the check unavailable. It defines which
    recovery a published row and the stresses and maxima derived from it come from: the recovery
    retained at the check's precision where the check passes, and the fallback recovery from the
    published binary64 rows otherwise (DEL-04-01/REQ-015).
  gating: true
- from: DEL-04-01
  when: Publishing the normal-stress maximum along a realized arc
  condition: >-
    The frame kernel encloses the maximum of the normal stress along a realized arc from the
    published end actions, the arc's loads and its section, and refuses by name when its search
    limits are reached.
  gating: true
- from: DEL-04-01
  when: Asserting the bound between exact-route twins and their pressure-free nonlinear controls
  condition: >-
    Every structural solve returns only when each free row's residual in the original equations
    meets 64·γ(n) of its row denominator, in the sparse and dense modes, so that the derived bound
    on the twins' differences holds for whatever kernel satisfies it.
  gating: false
- from: DEL-04-02
  condition: >-
    The straight pipe element gives, for a member's section, its stiffness, the equivalent nodal
    loads of uniform, partial-span and point member loads and of free strain (wL/2 and wL^2/12 for a
    full-span uniform load, E A eps along the chord for free strain), and the recovery of end and
    station resultants that removes them again.
  gating: true
- from: DEL-04-03
  condition: >-
    The linear support model gives, for each support record, its restrained degrees of freedom,
    spring terms, prescribed values and constant-effort force, and classifies each imposed
    displacement as a prescribed value, a moved spring base or a moved nonlinear-support ground.
  gating: true
- from: DEL-04-04
  when: Solving a case with nonlinear supports
  condition: >-
    The nonlinear support classifier returns, from an iterate's displacements and reactions, each
    support's state, the supports that changed and a convergence verdict, under the state-switched
    test and the bounded friction law.
  gating: true
- from: DEL-04-04
  when: Confirming a converged nonlinear state
  condition: >-
    The state law states, for each nonlinear support kind and state, the quantity that decides the
    state and the side it must lie on strictly, and that a weakly active support, a deciding
    quantity that cannot be established on its side, or a case on which no confirmation runs leaves
    the state unconfirmed (DEL-04-04/REQ-013).
  gating: false
- from: DEL-04-06
  condition: >-
    The diagnostic records map kernel, support, load and non-convergence failures to named records
    with code, class, severity, source and affected reference, including a non-convergence failure
    for an iteration that ends at its cap, and classify a condition estimate against a warning and
    a failure level into an ill-conditioning warning or a blocking conditioning failure.
  gating: true
- from: DEL-05-01
  when: Forming a load case's loads
  condition: >-
    The primitive load contracts define each load a case applies, including thermal and fit free
    strain and generated self-weight, with the primitives from which each formed term can be re-
    formed (the resolved free strain of the load state; the densities, diameters, thicknesses and
    gravity behind self-weight).
  gating: true
- from: DEL-05-01
  when: Solving a case that holds supports
  condition: >-
    A load case's test condition states whether its supports are held, and a held support is
    defined: each spring, variable spring and constant-effort support replaced on the degrees of
    freedom it acts on by a rigid restraint at zero displacement from the authored geometry, with
    neither its stiffness nor its force acting and its reaction published under its own identity.
  gating: false
- from: DEL-04-10
  when: Solving a model that contains a snubber
  condition: >-
    A snubber is a restraint in dynamic analysis only: every static load-case solve on both routes
    leaves it out and discloses it as a dynamic-only restraint not active in static cases
    (DEL-04-10/REQ-005).
  gating: false
- from: DEL-05-05
  when: Applying a distributed user load
  condition: >-
    The distributed user-load contract defines a uniform load on a straight member or a realized
    arc, its application to the member, and the primitives from which the formed term can be re-
    formed.
  gating: true
- from: DEL-05-02
  when: Publishing combinations and each row's ordinary sentence and standing
  condition: >-
    The load-case algebra combines solved case results under its combination rules and withholding
    gates, and its base reader gives the ordinary sentence, vocabulary and standing of each
    published row.
  gating: true
- from: DEL-05-03
  when: Publishing stress rows, member maxima and headlines
  condition: >-
    The stress recovery defines member stresses as functions of a member's end and station actions
    and its section, and section quantities as fixed binary64 sequences over the published rows,
    defines the nominal and reduced section bases on which exact-route stresses are published, and
    defines the Timoshenko shear factor and the rule for which members a model selects as
    Timoshenko.
  gating: true
- from: DEL-03-06
  when: Solving a model that contains an expansion joint
  condition: >-
    An expansion joint is authored as an objective connector that replaces a span, with its work
    matrix, frame, offsets, reference state, hardware and pressure model, and with explicit elastic
    tie rods as its hardware where the user enters them.
  gating: true
- from: DEL-04-08
  when: Publishing retained-precision or retained-source results
  condition: >-
    The retained-precision method admits or declines each case under its own fixed limits and memory
    profile, publishes a verified result or returns the ordinary result unchanged, and lists a row
    it does not cover as not covered.
  gating: true
- from: DEL-09-01
  when: Solving the reference system
  condition: >-
    The invented reference system is maintained as a model document with an independent record of
    its weights, containing the families of exit criterion 1.
  gating: true
- from: DEL-09-01
  when: Examining the solve entries against the frozen benchmark packages
  condition: >-
    The mechanics benchmark suite holds `validation/references/w9_benchmarks` and the other
    benchmark packages of PRD §22.2, each expected value with a derivation that imports, reads and
    runs no product code and a provenance record (DEL-09-01 AC-005).
  gating: true
- from: DEL-09-03
  when: Judging convergence of the nonlinear iteration
  condition: >-
    The nonlinear validation suite holds the governed convergence limits of each support class: no
    support changes state in the final iteration, within the iteration cap, and a case may tighten
    a limit and never loosen one (DEL-09-03 REQ-007, AC-004).
  gating: false
- from: DEL-07-07
  when: Running a solve in the desktop
  condition: >-
    The desktop solve job runs each ordinary solve through the product solve entry in a local worker
    process capped at its lease from the shared pool, within the per-invocation budget
    (DEL-07-07/REQ-012), so that a solve cannot exceed its budget and a completed solve's peak
    physical footprint can be observed against it.
  gating: false
code_paths:
# The product solve crate and the nonlinear iteration. Within core/product_physics/, modules that
# carry another deliverable's definition are listed by that deliverable too: the retained producer
# (DEL-04-08), modal (DEL-04-09), topology and model checks (DEL-04-06), imposed motion, skew and
# the constant-effort and variable-spring support law (DEL-04-03), self-weight and loads (DEL-05-01, DEL-05-05), combinations (DEL-05-02), pressure
# geometry and section bases (DEL-03-08, DEL-05-03) and components (DEL-03-03 to DEL-03-06); this
# deliverable owns their composition. Within the shared modules, this deliverable's section and
# mass adapter is the mass-per-length computation in self_weight.rs (the plan, component weight and
# generation evidence there are DEL-05-01's), annulus_geometry.rs, and the annulus area and
# section-property computation in pressure_exact.rs and pressure_exact/source_geometry.rs, where the
# cap, Poisson-eigenload and pressure-group load pairs are also this deliverable's (the section-basis
# derivation and the pressure stresses there are DEL-05-03's). core/product_physics/tests/
# w9_solver_benchmarks.rs and w16_imposed_motion.rs fall under the crate glob and are DEL-09-01's
# benchmark runs. In apps/desktop/src-tauri/, the memory pool, its leases and
# the priced parses are this deliverable's (REQ-008); the solve job's lifecycle in the same files
# is DEL-07-07's.
