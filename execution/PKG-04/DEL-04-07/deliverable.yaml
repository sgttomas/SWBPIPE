    (Design/u4b-u5b-implementation.md §3).
  gating: true
  evidence: execution/PKG-03/DEL-03-06/Design/joint-replacement.md
- from: DEL-04-01
  when: K-D5 member-relative bound (option (d)) implementation
  condition: 'DEL-04-07 attaches the load primitives of K-D5''s load closure (DEL-04-01 Design/kd5-member-relative-bound.md
    sections 1 to 3). DEL-04-01 supplies the LoadPrimitive type and FormationSource::loads, with many primitives
    per ledger term; the closure rule, which fails closed on a formed term its primitives do not cover and
    on a solve without a ledger; epsilon_E by the triangle bound; the two corrections and MemberBoundInputs;
    and the certified recovery of straight members, arcs, connectors and supports. DEL-04-07 forms its own
    terms'' primitives per section 1 (arc and pressure free strain, the exact-pressure operand groups including
    the straight Poisson pairs, connector and tie-rod reference loads and their W2 forms), publishes certified rows only
    when MemberBoundInputs are present, and fails every other Passed route closed with a named reason.'
  gating: true
- from: DEL-04-01
  when: K-D5 on the converged active set (nonlinear K-D5) implementation
  condition: 'DEL-04-07 confirms a converged non-gap nonlinear state once, after the loop (DEL-04-01 Design/kd5-nonlinear-active-set.md
    sections 1 to 3). DEL-04-01 supplies the sliding-friction load primitives (SlidingFrictionExplicit, the
    exact product; SlidingFrictionCoupled, the Stage-A ball) with their closure, AssembledForce::with_appended,
    the confirmation attempt (finish_confirmation and ConfirmationAttempt::evaluate_at, K-D5 at a supplied
    displacement on the attempt''s one factor), the displacement ball and the exact sign and stick decisions.
    DEL-04-07 publishes the confirmed state''s certified rows, including the nonlinear support slots, and fails
    every other nonlinear Passed case closed with the named section 2.4 reason.'
  gating: true
- from: DEL-05-01
  when: K-D5 member-relative bound (option (d)) implementation
  condition: 'K-D5 re-forms every formed load term at p = 128 from its binary64 primitives and uses no
    ledger value of a formed term (DEL-04-01 Design/kd5-member-relative-bound.md section 1). DEL-05-01 supplies,
    with each term it forms, the primitives and formula K-D5 can re-form at p: the resolved total eigenstrain
    of the load state (thermal alpha Delta T plus fit and cold-spring strain), formed once and shared by
    the straight, arc and pressure primitives; and generated self-weight as its authored densities, diameters,
    thicknesses and g, so that its intensity is re-formed at p and needs no operand bound. A formed term
    without them makes the formation check unavailable.'
  gating: true
- from: DEL-04-02
  when: K-D5 member-relative bound (option (d)) implementation
  condition: 'K-D5 re-forms every formed load term at p = 128 (DEL-04-01 Design/kd5-member-relative-bound.md
    section 1). DEL-04-02 supplies, for the straight member''s formed terms, the primitives and formula K-D5
    can re-form at p: the consistent uniform-load vector (wL/2, wL^2/12 in the chord frame) and the free-strain
    eigen pair (E A epsilon along the chord). The same definitions, with the equivalent terms and free-strain
    axial load that exact_straight_end_forces removes, serve the certified straight recovery at the corrected
    displacement.'
  gating: true
- from: DEL-05-05
  when: K-D5 member-relative bound (option (d)) implementation
  condition: 'K-D5 re-forms every formed load term at p = 128 (DEL-04-01 Design/kd5-member-relative-bound.md
    section 1). DEL-05-05 applies the distributed loads and owns the application of R-1''s certified arc
    loads (DEL-04-01''s certify_curved_uniform_load). For each uniform element load on a straight member
    or a realized arc it supplies the primitives and formula K-D5 can re-form at p, and for arcs R-1''s midpoint-radius
    enclosure, linear in w and applied to each term of w''s exact split, with its radius carried. A failed
    R-1 precondition makes the formation check unavailable.'
  gating: true
- from: DEL-04-01
  when: T4-U4a arc frames and signs implementation
  condition: 'DEL-04-07 publishes the end rows of a realized arc in the tangent frame at each end, node-on-element
    (Design/arc-frames-and-signs.md). DEL-04-01 supplies them from certify_arc_recovery as certified rows
    of K_int,arc: the end operator and equivalent loads are formed with the end-tangent axes at p in ball
    arithmetic (s = L/(2R), c = sqrt(1 - s^2); t_i = c x_c + s y_c, y_i = s x_c - c y_c, t_j = c x_c - s y_c,
    y_j = -s x_c - c y_c, z = -z_c; formed as PressureDirection::Tangent forms its tangent), never from binary64
    end tangents and never by rotating rounded rows, with the cut rows unchanged. Since B7a''s C5 stage both
    routes use this tangent frame, so no end-frame parameter remains. The same law serves the nonlinear
    certified route. CB supplies its binary64 arc frame at each end for the binary64 recovery.'
  gating: true
- from: DEL-05-02
  when: preview arc end rows (T4-U4a stage 2)
  condition: >-
    DEL-04-07 publishes preview-physics-2 arc end rows in the tangent frame at
    each end, node-on-element (Design/arc-frames-and-signs.md sections 2 to 5).
    Their ordinary sentence and vocabulary come from DEL-05-02's base semantic
    table and reader; LIMITATIONS[3], as T4-U4b revised it (Design/u4b-u5b-implementation.md
    §2.8), and `results.v0.3` keep the section 8 end-row contract, with
    `arc_chord_frame` retired.
  gating: true
  evidence: execution/PKG-04/DEL-04-08/Design/b7-plan.md
- from: DEL-04-08
  when: retained-table arc-vocabulary parity and reviewed-input binding
  condition: >-
    DEL-04-07's ordinary arc vocabulary and limitation sentence are also bound
    into DEL-04-08's preview-physics-retained-1 table for vocabulary parity; the
    retained route publishes no arc rows. A change to the bound sentence or table
    requires the method's reviewed-input refresh and actual-source D3 registration.
  gating: true
  evidence: execution/PKG-04/DEL-04-08/Design/b7-plan.md
- from: DEL-04-01
  when: T4-U5b explicit elastic tie rods
  condition: >-
    DEL-04-07 publishes the tie rods of an objective connector (`explicit_axial_rods_v1`; Design/u4b-u5b-implementation.md
    §3). DEL-04-01 supplies each rod as its own two-node element carried on its connector
    (`tie_rod`, `ObjectiveConnector::with_tie_rods`): Ke = C^T k_r C and the reference load +C^T k_r e_ref,
    each rounded once, with the zero-length and range refusals; assembly, census, epsilon_E and reaction
    passes that walk the rods after every connector and before the arcs; the per-element absorption rule;
    the K-D5 family `LoadFormula::TieRodReference` with its summand identity and closure on the ordinary
    and W2 routes; and `certify_tie_rod_recovery`, which gives T_r, the rod direction and its axial share
    as certified values of the corrected displacement. DEL-04-07 forms the rod inputs, publishes
    `connector_tie_rod_force_v1` and s_x, and never folds a rod force into the connector's g.
  gating: true
  evidence: core/solver/frame_kernel/src/tie_rod.rs
- from: DEL-04-01
  when: T4-U4b arc normal-stress maximum
  condition: >-
    DEL-04-07 publishes the maximum of |N_eff|/A_b + hypot(M_y, M_z)/Z_b along each realized arc, and the
    along-arc directional intensified maximum, as the midpoint of a certified enclosure (Design/u4b-u5b-implementation.md
    §§2.3 and 2.6). DEL-04-01 supplies `frame_kernel::structural::certify_arc_stress_maximum` with its
    enclosed sine and cosine: directed bounds on the published binary64 operands, the existing
    `elastic_extrema` gap rule and subdivision limits, the station cover and the location rule, refusing
    by name when a limit is reached. DEL-04-07 supplies the operands (the published end-j force rows, the
    arc's uniform intensities, R, phi, the basis section and p·A_i) and the evidence record.
  gating: true
  evidence: core/solver/frame_kernel/src/structural/arc_maximum.rs
- from: DEL-04-01
  when: T4-U4b retained not-covered passthrough
  condition: >-
    DEL-04-07's retained producer places the straight-member section extremes and transverse-shear maxima
    of W1 successors as recipe-free rows (Design/u4b-u5b-implementation.md §4.1). DEL-04-01 supplies the
    retained final case's `ProductRecipe::NotCovered { row }`: it carries the row's position only,
    contributes to no verified class's body scale, maximum or coverage, and takes the class-None verdict
    that the wire lists as `not_covered`.
  gating: true
  evidence: core/solver/frame_kernel/src/structural/retained/product_certificate/final_case.rs
- from: DEL-05-03
  when: T4-U4b section quantities
  condition: >-
    DEL-04-07 publishes the T4-U4b section quantities on both ordinary routes and forms the derived rows
    of retained and source publications from each publication's own rows (Design/u4b-u5b-implementation.md
    §§2.3 to 2.6 and 4.1). DEL-05-03 supplies them in `stress_recovery::section_stress_quantities` as
    normative binary64 sequences: the signed normal-stress extremes and their fibre rule, the Saint-Venant
    transverse-shear factor and maximum, the toroidal membrane hoop and radial values guarded by R > r_o,
    and the directional intensified bending. The readers recompute the published values bit for bit by
    the same sequences.
  gating: true
  evidence: core/loads/stress_recovery/src/section_stress_quantities.rs
