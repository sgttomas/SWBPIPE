id: DEL-04-08
name: Retained-precision result verification
needs:
- from: DEL-04-01
  condition: >-
    The frame kernel defines the frame, its element stiffnesses (Euler-Bernoulli and Timoshenko
    straight members) and its boundary reduction, which are the declared linear problem a successor
    re-solves; reports for each ordinary solve whether it passed its integrity check, which decides
    the cases the method attempts; and provides the retained-precision lanes that re-solve that
    problem at extended precision with their error proof, and the exact boundary that solves a
    case exactly from retained source terms within metered work limits.
  gating: true
- from: DEL-04-07
  condition: >-
    The product solve gives the method each case's ordinary result and standing and, where the solve
    captured one, the captured invocation; admits a retained invocation only within a per-invocation
    memory budget of 12 GiB inside the shared pool; and publishes what the method returns, a
    verified result or the unchanged ordinary result, without altering it.
  gating: true
- from: DEL-05-01
  condition: >-
    The primitive load contracts record each authored load of a case with its identity, direction,
    dimension and magnitude, bit for bit as authored, so that the method can form its exact load
    ledger from the records.
  gating: true
- from: DEL-05-05
  when: Covering a case with a full-span uniform member load
  condition: >-
    A distributed user load over the whole span of a straight member enters the solve as the
    member's work-consistent equivalent nodal loads in global axes, never as a lumped
    approximation (DEL-05-05 REQ-007).
  gating: true
- from: DEL-04-02
  when: Covering a case with a full-span uniform member load
  condition: >-
    The straight pipe element gives the equivalent nodal loads of a full-span uniform load as wL/2
    and moments of wL²/12 at each end, and recovers end and station resultants that satisfy statics
    with the loads between them (DEL-04-02 AC-002, AC-003).
  gating: true
- from: DEL-05-03
  condition: >-
    The stress recovery defines the nominal and reduced section bases with a fixed binary64
    rederivation, the stress definitions behind every stress row (N/A, M/Z, Tc/J and the elastic
    normal-stress maximum), the section-quantity sequences for section extremes and transverse-shear
    maxima, and the Timoshenko shear factor and shear area, so that the readers can rederive them
    from published rows.
  gating: true
- from: DEL-05-02
  when: Producing a retained combination and reading a successor at gate G7
  condition: >-
    The load-case algebra defines mechanics combination semantics and their withholding gates, which
    a retained combination reproduces, and its base-route reader gives the standing of an ordinary
    statement, which the reader applies to each successor's projected statement.
  gating: true
- from: DEL-02-02
  when: Forming the reader's raw and normalized projections
  condition: >-
    The unit catalog gives each unit's conversion to the canonical unit as a record with its factor
    or offset representation, converts deterministically, and each conversion agrees with the value
    formed from the unit's public definition at its witness tolerance (DEL-02-02 REQ-006, REQ-007,
    AC-001), so that the reader's raw and normalized projections and the test verifier can be held
    to it.
  gating: true
- from: DEL-08-02
  condition: >-
    A JSON payload is hashed as SHA-256 over its RFC 8785 canonical form, by one implementation with
    committed vectors, so that receipts, captured invocations and publication hashes are bound with
    it and the test verifier can reproduce each digest.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract admits typed notices and diagnostics that name their affected object,
    a case included, with code, severity, source and message, and no diagnostic claims
    certification or compliance.
  gating: false
- from: DEL-10-05
  condition: >-
    The headless runner program hosts the `read` command: it passes the named result file to the
    product reader's entry and returns that entry's document unchanged.
  gating: false
code_paths:
# The retained-precision method: producer parts, readers, test verifier, corpora and pricing.
# The kernel's retained lanes and exact boundary are in DEL-04-01's frame-kernel crate and are
# that deliverable's code; this deliverable reads them (see needs). DEL-05-02 lists many of the
# same paths for retained combinations: the combination semantics those files reproduce are
# DEL-05-02's; the method, its receipts, readers and pricing are this deliverable's. The desktop
# output policy is listed by DEL-07-05 and DEL-08-01 for the surfaces it gates; the refusals of
# the retained and exact-route identities (REQ-006) are this deliverable's.
# tests/verifiers/** also holds the verifiers of DEL-03-05, DEL-04-09, DEL-04-11 and DEL-05-03,
# each listed by its owner; the retained and base-reader verifiers there are this deliverable's.
# section_basis.rs and tests/verifiers/section_basis.py are listed here for the reader they sit in
# and by DEL-05-03 for the section-basis rederivation they carry.
