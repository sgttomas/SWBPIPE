id: DEL-04-08
name: Retained-precision result verification
needs:
- from: DEL-04-01
  condition: >-
    DEL-04-08 publishes and bounds rows that the frame kernel's retained lanes compute. Through
    `frame_kernel::structural::retained_api`, DEL-04-01 supplies the retained product proof
    (`certify_product_case`, `certify_final`) with the coupled and floored final per-body scales its
    gate judged every row with (`CertifiedProductProof::final_scales`, which the receipt's
    `body_scales` state; Design `w1-coverage-repair.md` §2.2), the admitted-K and annular-source lanes and their
    publication predicates, the declared member-load set (`MemberLoadSet`, `UniformMemberLoad`), the
    loaded-member maximum search with its fixed limits, the retained Timoshenko straight member
    (natural-mode D recipe, kappa_E lane enclosure and D-entry gap majorants) with its sidecar and the
    reduced-section certification of distinct-basis rows (O4), and the retained resource layouts that the
    memory profile prices. For retained-source recovery it supplies the metered exact-boundary blocks.
    Each lane meets the limits stated in the formation definitions (DEF-O, DEF-C and DEF-E) or refuses;
    no lane widens a limit to complete. The final case's recipe-free `ProductRecipe::NotCovered` carries the
    derived section extremes and transverse-shear maxima as `not_covered` rows outside every verified class
    (DEL-04-07 Design `u4b-u5b-implementation.md` §4.1).
  gating: true
  evidence: core/solver/frame_kernel/src/structural/retained/mod.rs
- from: DEL-04-07
  condition: >-
    DEL-04-07's product solve integration hosts the method. Its dispatcher
    (`run_linear_static_preview_value_dispatch`) runs the census and admission before any retained
    capture. An admission refusal returns the unchanged ordinary route. A later stage fault returns
    the ordinary bytes, with one `RETAINED_PRECISION_UNAVAILABLE` notice where retained work ran. Its
    ordinary exact route attempts retained-source recovery for eligible captured cases whose ordinary
    report is Sensitive or whose ordinary attempt errs, screens each selection by the captured replay's
    reservation, and republishes every case of a captured invocation on its ordinary route when a selected
    source cannot finalize (Design `pre04-failure-unification.md`). Its memory-budget
    policy fixes the qualified per-invocation M = 12 GiB within the shared 75 % pool. Its desktop host
    keeps the non-retained entry, so retained-precision results reach no desktop solve until B8
    (owner-held).
  gating: true
  evidence: execution/PKG-04/DEL-04-07/Design/memory-budget-decision.md
- from: DEL-05-01
  condition: >-
    W1 captures each authored full-span uniform member load bit for bit from the primitive load
    application's `element_uniform_loads` and the case's primitive load records. It forms the exact
    ledger (K4LED) from those records and the normalized nodal terms. DEL-05-01 supplies these records
    with their authored identity, direction, dimension and magnitude.
  gating: true
  evidence: core/loads/primitive_loads/src/lib.rs
- from: DEL-05-05
  condition: >-
    DEL-05-05's user-load contract defines a full-span uniform member load on a straight member: its
    consistent equivalent nodal load ((L/2)w at each end, ±(L/12)(d x w) moments) and the member-local
    end and station recovery with span terms. W1's declared entries are each within 2^-1022 of these
    exact consistent values, relative to their magnitude. The difference is disclosed, not bounded.
  gating: true
  evidence: execution/PKG-05/DEL-05-05/ScopeOfWork.md
- from: DEL-05-03
  condition: >-
    DEL-05-03 supplies the nominal and reduced section bases and their fixed binary64 rederivation
    (`section_basis`), which the readers apply at G5b and G8 and the verifier repeats. It also supplies
    the stress definitions (N/A, M/Z, T*c/J and the elastic normal-stress maximum) behind every stress
    row this method bounds, and the `section_stress_quantities` sequences by which successors and source
    publications form their derived section extremes and transverse-shear maxima from their own rows. It also supplies the Timoshenko formulation (U8's fixed-order kappa-hat, the energy-matched
    kappa_E and the shear-area leaf), which both retained routes form and the readers rederive, and the
    mill-tolerance and corrosion-allowance fields behind the D-5 bases (O4, `o4-source-extension.md`).
  gating: true
  evidence: execution/PKG-05/DEL-05-03/Design/section-bases-and-timoshenko.md
- from: DEL-05-02
  condition: >-
    DEL-05-02 supplies the mechanics combination semantics and their withholding gates
    (`NONLINEAR_COMBINATION_REQUIRES_SOLVE`, `CONSTANT_EFFORT_COMBINATION_REQUIRES_SOLVE`,
    `COMBINATION_MODULUS_BASIS_MIXED`). Retained combinations reproduce them under the B2-C contract. It
    also supplies the base-route readers and standing (`reader_verdict`) that G7 applies to each
    successor's projected statement.
  gating: true
  evidence: execution/PKG-05/DEL-05-02/Design/retained-combinations.md
- from: DEL-02-02
  condition: >-
    DEL-02-02 supplies the unit catalog and conversions (`open_pipe_stress_units`) that the reader's row
    classification and raw/SI projection use. The verifier matches the crate's committed unit
    witnesses bit for bit.
  gating: true
  evidence: core/units/README.md
- from: DEL-02-05
  condition: >-
    DEL-02-05 supplies the canonical JSON form (`openpipestress_jcs_ijson_v1`, `core/serialization/canonical_json`)
    and its SHA-256 hashing. These bind each receipt, captured invocation and publication hash. The
    verifier matches the crate's committed canonical-JSON vectors.
  gating: true
  evidence: core/serialization/canonical_json/README.md
- from: DEL-00-06
  condition: >-
    The method's notices and refusal codes (`RETAINED_PRECISION_SELECTED`, `RETAINED_PRECISION_UNAVAILABLE`
    and the reader's gate codes) are typed diagnostics bound to cases. They follow the diagnostics and
    result-envelope contract (AB-00-06), including its rule on output claims; the wording of the
    current product messages is an open terminology choice (ScopeOfWork TBD-001).
  gating: false
- from: DEL-10-05
  condition: >-
    The headless runner hosts the reader's CLI binding (`openpipestress-runner read`). Python product code
    takes the reader's verdict through it. The runner's solves take the ordinary route.
  gating: false
