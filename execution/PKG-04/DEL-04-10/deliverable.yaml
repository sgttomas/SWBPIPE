id: DEL-04-10
name: Response-spectrum analysis
needs:
- from: DEL-04-09
  condition: >-
    The modal result publishes each mode's frequency, shape in its normalization case, generalized
    mass, cluster and integrity standing, and its participation factors and effective masses on the
    uniform-support-motion excitation, the free rows of the full mass times the rigid translation of
    all degrees of freedom with consistent-mass coupling to restrained degrees of freedom included.
    A modal request can include dynamic-only restraints and name a state case. The assembled mass
    and the rigid translation of all degrees of freedom can be read unchanged for the inertia terms
    and the missing-mass correction. A set the modal solve
    refuses is not published, and a set published as sensitive carries that standing. For the
    spectrum result document, the modal result also states each mode's circular frequency, the
    cluster tolerance its clusters were formed with, its extraction endpoint with the reported
    and established finite mode counts and the next computed mode, the total mass in each
    direction, and its run id with the digests of its request, model, materials, integrity
    parameters and state case.
  gating: true
- from: DEL-02-01
  condition: >-
    The model document carries the snubber support family (translational restraints only,
    optionally one finite dynamic stiffness, a skew direction with exactly one restraint, no hanger
    or nonlinear member) and the top-level spectra[] records (abscissa frequency or period,
    acceleration or g-multiple ordinates with g, damping ratio, interpolation per axis, points),
    validated by DEL-02-01. DEL-04-10 defines their solve meaning.
  gating: true
- from: DEL-04-03
  condition: >-
    The linear support model defines a restraint on a global axis, a skewed rigid restraint
    enforced exactly (dᵀu = 0, never by a penalty stiffness) and a skewed spring as the rank-one
    term k·d·dᵀ/(dᵀd); it admits a snubber's authored direction as it admits a support's, and
    refuses by name each skewed case it cannot represent exactly or attribute uniquely
    (DEL-04-03 REQ-010, AC-004).
  gating: true
- from: DEL-04-07
  condition: >-
    The product solve builds the model, assembles its stiffness and reduces it by its restraints on
    the pressure-free route and on the exact pressure route, solves a static load on that stiffness,
    recovers element end forces and support loads from a displacement vector, and composes the
    snubber's static meaning that this deliverable defines: every static load-case solve on both
    routes leaves a snubber out and discloses it.
  gating: true
- from: DEL-02-02
  condition: >-
    The unit catalog normalizes acceleration ordinates, frequencies, periods, damping ratios and
    scale factors with a dimension check, and has the frequency dimensions the modal results use.
  gating: true
- from: DEL-00-06
  when: Before a spectrum result is published.
  condition: >-
    The result-envelope contract gives a spectrum result's envelope its outcome kind and carries its
    diagnostics, and the diagnostics contract admits typed refusals and warnings with code, class,
    severity, source and affected object.
  gating: true
- from: DEL-14-02
  when: Before an admitted spectrum result is recorded as an analysis run.
  condition: >-
    The analysis-run record admits a spectrum run kind that binds its request, under the
    one-version rule.
  gating: true
- from: DEL-05-02
  when: Before spectrum results are offered as operands of a load-case combination.
  condition: >-
    The load-case algebra admits a spectrum result as an unsigned operand of a combination with
    static cases, for example sustained plus seismic by absolute sum or SRSS, and never treats it
    as signed.
  gating: false
- from: DEL-10-05
  when: Before a spectrum request can be run headless.
  condition: >-
    A command the headless runner hosts passes its input to the owning deliverable's entry and
    returns that entry's document unchanged, and the runner supplies no engineering value to it
    (DEL-10-05/REQ-015, DEL-10-05/AC-011), so that the spectrum command this deliverable builds
    supplies no spectrum, scale factor, damping, interpolation, combination or missing-mass input
    and returns the solve's refusals unchanged. The runner's read command returns this deliverable's
    product reader verdict for a spectrum result document unchanged.
  gating: false
- from: DEL-07-05
  condition: >-
    A results table states its units, the published frame of each row, the limitations of the route
    that produced it and the result's standing, which the spectrum results table follows.
  gating: false
- from: DEL-08-01
  condition: >-
    A section contributed by another deliverable enters a report only through the assembled section
    model: under a governed section, with registered boundary wording and no claim of its own, and
    passing the report's gates (DEL-08-01 REQ-020). The response-spectrum section is such a
    section.
  gating: false
- from: DEL-07-07
  when: Before a spectrum result is admitted for engineering display in the desktop.
  condition: >-
    The native job enforces the owning analysis admission profile, can stop its owned computation,
    and publishes the complete result and required reader verdict atomically into result custody;
    a cancelled, failed or refused run cannot leave a successful partial result.
  gating: true
- from: DEL-10-05
  when: Before a spectrum result is admitted as an engineering result through the headless command.
  condition: >-
    Bounded ingress and result reading apply on the actual path, interruption ends the foreground
    computation without reported success, and explicit output preserves a complete old or complete
    new destination through owned temporary creation and atomic rename under REQ-015.
  gating: true
- from: DEL-09-01
  when: Before the reference system's spectrum case is built.
  condition: >-
    The reference system's specification checks the directional combination of its spectrum result
    (its check EQ-7) by this deliverable's readers' rule: the combination over directions is
    recomputed from the published signed contributions under the recorded rules and compared at
    1e-9 relative, and is not checked by recombining the published per-direction magnitudes.
  gating: true
- from: external:nrc-nureg-cr
  when: If a published response-spectrum problem is compared.
  condition: >-
    A published response-spectrum piping problem can be compared as comparison evidence only under
    that report's own redistribution evidence (DEL-04-09/REQ-009). The comparison is not required.
  gating: false
# The product's units S2 (the validated spectrum table and its evaluation) and S4 (the combinations
# of supplied signed contributions and their contract, with the contract fixtures), with their
# tests against the frozen references and their examples, and the assembler of the spectrum result
# document from supplied contributions. No spectrum solve exists yet.
code_paths:
- core/analysis/response_spectrum/**
# The committed spectrum result documents, each with its stand-in model and request, and the
# `spectrum-1` semantic table (REQ-006, "The document and the readers' checks").
- fixtures/results/spectrum_*
- fixtures/results/semantic_contract_spectrum_1.json
# The frozen references and their maintained regeneration and independence check.
- validation/references/f2_spectrum/**
- tests/test_dynamics_references.py
- tools/validation/reference_observation.py
# Frozen before the engine work it judges: a snubber left out of every static case (AC-003). No
# product test reads it yet.
- validation/references/snubber_static/**
- tests/test_snubber_static_references.py
checks:
- tests/test_dynamics_references.py
