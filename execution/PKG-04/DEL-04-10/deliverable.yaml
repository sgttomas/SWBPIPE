id: DEL-04-10
name: Response-spectrum analysis
needs:
- from: DEL-04-09
  condition: >-
    The modal result publishes each mode's frequency, shape in its normalization case, generalized
    mass, cluster and integrity standing, and its participation factors and effective masses on the
    uniform-support-motion excitation, the free rows of the full mass times the rigid translation of
    all degrees of freedom with consistent-mass coupling to restrained degrees of freedom included.
    A modal request can include dynamic-only restraints and name a state case. The assembled mass
    and the rigid translation of all degrees of freedom can be read unchanged for the inertia terms
    and the missing-mass correction. A set the modal solve
    refuses is not published, and a set published as sensitive carries that standing.
  gating: true
- from: DEL-02-01
  condition: >-
    The model document carries the snubber support family (translational restraints only,
    optionally one finite dynamic stiffness, a skew direction with exactly one restraint, no hanger
    or nonlinear member) and the top-level spectra[] records (abscissa frequency or period,
    acceleration or g-multiple ordinates with g, damping ratio, interpolation per axis, points),
    validated by DEL-02-01. DEL-04-10 defines their solve meaning.
  gating: true
- from: DEL-04-03
  condition: >-
    The linear support model defines a restraint on a global axis, a skewed rigid restraint
    enforced exactly (dᵀu = 0, never by a penalty stiffness) and a skewed spring as the rank-one
    term k·d·dᵀ/(dᵀd); it admits a snubber's authored direction as it admits a support's, and
    refuses by name each skewed case it cannot represent exactly or attribute uniquely
    (DEL-04-03 REQ-010, AC-004).
  gating: true
- from: DEL-04-07
  condition: >-
    The product solve builds the model, assembles its stiffness and reduces it by its restraints on
    the pressure-free route and on the exact pressure route, solves a static load on that stiffness,
    recovers element end forces and support loads from a displacement vector, and can solve a static
    load case while leaving a named support family out.
  gating: true
- from: DEL-02-02
  condition: >-
    The unit catalog normalizes acceleration ordinates, frequencies, periods, damping ratios and
    scale factors with a dimension check, and has the frequency dimensions the modal results use.
  gating: true
- from: DEL-00-06
  when: Before a spectrum result is published.
  condition: >-
    The diagnostics contract admits typed refusals and warnings with code, class, severity, source
    and affected object.
  gating: true
- from: DEL-14-02
  when: Before a spectrum result is recorded as an analysis run.
  condition: >-
    The analysis-run record admits a spectrum run kind that binds its request, under the
    one-version rule.
  gating: true
- from: DEL-10-05
  when: Before a spectrum request can be run headless.
  condition: >-
    The headless runner hosts a spectrum command, supplies no spectrum, scale factor, damping,
    interpolation, combination or missing-mass input, and returns the solve's refusals unchanged.
  gating: false
- from: DEL-07-05
  condition: >-
    A results table states its units, the published frame of each row, the limitations of the route
    that produced it and the result's standing, which the spectrum results table follows.
  gating: false
- from: DEL-08-01
  condition: >-
    A section contributed by another deliverable enters a report only through the assembled section
    model: under a governed section, with registered boundary wording and no claim of its own, and
    passing the report's gates (DEL-08-01 REQ-020). The response-spectrum section is such a
    section.
  gating: false
- from: external:nrc-nureg-cr
  when: If a published response-spectrum problem is compared.
  condition: >-
    A published response-spectrum piping problem can be compared as comparison evidence only under
    that report's own redistribution evidence; a report with uncertain rights is held for the
    owner's review. The comparison is not required.
  gating: false
code_paths: []
checks: []
