id: DEL-03-07
name: Public/private library import provenance checker
needs:
- from: DEL-03-01
  condition: >-
    The material library format names the library object and the record list of a document, gives
    every library, record, value and diagnostic a provenance of the seven members (source name,
    source location, source licence, contributor, contributor certification, redistribution
    status, review status), gives every numeric value a unit and a dimension, and fixes the
    members a document must have.
  gating: true
- from: DEL-03-02
  condition: >-
    The section, component and hanger library formats do the same for their kinds, and the hanger
    format is a standalone schema that admits versions 1.0.0 and 1.1.0 and, under either version,
    a working load range of a minimum and a maximum force, each with its own provenance, leaving
    the refusal of a range in a 1.0.0 document to the import boundary.
  gating: true
- from: DEL-01-02
  condition: >-
    The protected-data boundary policy lists the provenance members every public data record
    carries and states that unclear or suspect data is quarantined and not used as public data.
  gating: true
- from: DEL-01-03
  condition: >-
    The contributor certification workflow fixes the attestation a public data contribution
    carries, which the boundary requires as the contributor certification member of provenance.
  gating: true
- from: DEL-02-02
  condition: >-
    The unit catalog states, for each dimension, the units of that dimension, and checks a
    quantity's unit against its stated dimension without converting it, so that the import can
    refuse a unit inconsistent with its dimension in any library kind.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the members an import finding carries (code, class, severity,
    source, affected object, message, remediation and provenance).
  gating: true
- from: DEL-02-05
  condition: >-
    The project store on the user's machine is opened and migrated through one entry, forward
    only, is reached only through application services and transmits nothing, so that the library
    store can keep its documents in it, one per project, library kind and library identifier.
  gating: true
code_paths:
- core/library_import/**
# The shared invented valid and invalid hanger cases that hold the implementations together. The
# valid example libraries are DEL-03-01's and DEL-03-02's.
- fixtures/hanger/invented_hanger_cases.json
# The desktop's call into the boundary. DEL-07-03 lists the same file as part of the Library
# Manager; the request it sends and the outcome and findings it returns are this deliverable's.
- apps/desktop/src/services/libraryImportService.ts
# In the desktop's command file, which many deliverables list: the library import command and the
# local library store commands (save, open, list, delete) are this deliverable's.
- apps/desktop/src-tauri/src/lib.rs
checks:
- tests/test_library_import_provenance.py
- tests/test_hanger_library_schema.py
- core/library_import/library_import_document/tests/provenance_parity.rs
- apps/desktop/src/services/libraryImportService.test.ts
