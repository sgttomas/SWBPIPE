id: DEL-03-01
name: Material library schema with provenance
needs:
- from: DEL-02-02
  condition: >-
    The unit catalog's one dimension vocabulary includes a dimension for each quantity a PRD §18.1
    material item carries (density, stress, length, absolute temperature, temperature interval,
    thermal expansion coefficient and dimensionless), each with its catalog units.
  gating: true
- from: DEL-01-02
  condition: >-
    The protected-data boundary policy states what a public artifact may not contain (standards
    text and tables, material allowables copied from standards, proprietary data), which provenance
    members a public data record carries, and that suspect content is quarantined and not used.
  gating: true
- from: DEL-01-03
  condition: >-
    The contributor certification workflow fixes the attestation a public data contribution
    carries, which a provenance block records as its contributor and contributor certification.
  gating: true
- from: DEL-00-04
  condition: >-
    The persistence rules require every kind of persisted document to have a schema that requires
    its version field, and require a save and reopen to return semantically equal content, units
    and provenance included, with only documented volatile fields differing.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the members a diagnostic carries (code, class, severity, source,
    affected object, message, remediation and provenance) and the warning classes a library
    diagnostic may take.
  gating: true
- from: DEL-03-07
  condition: >-
    The local library store keeps a material library document that the import boundary accepted as
    private and returns it unchanged, so that what a user saved is what is read back.
  gating: false
  when: Storing a material library and reading it back.
code_paths:
- schemas/material.schema.yaml
- fixtures/material/**
checks:
- tests/test_material_schema.py
