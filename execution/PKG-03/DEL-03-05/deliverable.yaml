id: DEL-03-05
name: Rigid component models for valves, flanges, reducers, and specialty items
needs:
- from: DEL-02-01
  condition: >-
    A component in the model document is a typed, closed record with a stable identifier and a
    kind, among which are valve, flange, reducer, rigid and specialty; the document describes
    every component member a reader decodes, each quantity with its own unit; and a component can
    carry its source and provenance.
  gating: true
- from: DEL-03-02
  condition: >-
    The component library format provides the record, the field slot (a quantity or text reference
    with its value status, public-value policy and provenance), the family contract and the
    completeness rule into which the rigid family's field kinds and diagnostics are declared, with
    linear stiffness and rotational stiffness as separate dimensions.
  gating: true
- from: DEL-02-02
  condition: >-
    The unit catalog converts a component's lengths, forces and stiffnesses to one consistent
    basis, component by component of a vector, treats its scale as dimensionless, and rejects a
    dimensional mismatch before the value reaches the solve.
  gating: true
- from: DEL-01-02
  condition: >-
    The protected-data boundary policy states that no public artifact may contain proprietary
    vendor catalogue data or protected dimensional tables, so that every component dimension,
    weight and stiffness is the user's own data.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the members a component finding carries (code, class, severity,
    source, affected object, message, remediation and provenance).
  gating: true
- from: DEL-05-01
  condition: >-
    Self-weight generation emits, for a selected member that is the body of a rigid-family
    component with a weight and a centre of gravity, a nodal force along gravity and the nodal
    moments of that force about the component's node, in place of the member's distributed
    self-weight, and records which it did.
  gating: true
- from: DEL-05-03
  condition: >-
    Stress recovery publishes a member's stress rows on the section it was given, and the case's
    stress maximum and headline are formed without the rows of a scaled component body, so that
    those rows are published, marked and left out of both.
  gating: true
- from: DEL-06-03
  condition: >-
    A rule input is bound only from a row the result reader does not refuse for rule binding; a
    refused row leaves the input unsupplied on that basis, with the reader's reason, and the
    outcome incomplete.
  gating: false
  when: Evaluating a user rule bound to a scaled body's stress.
- from: DEL-04-07
  condition: >-
    The product solve admits valve, flange, rigid and specialty components and reducers on the
    pressure-free route and on the exact route, forms each body with the scale this definition
    gives it, and on the exact route carries a reducer between pressure regions as a pressure
    step.
  gating: false
  when: Solving a model that contains a rigid-family component.
- from: DEL-09-01
  condition: >-
    The invented reference system and its independent references are maintained, with an eccentric
    reducer, valves and flanges among its members.
  gating: false
  when: Examining the reference system's rigid-family components on the exact route.
code_paths:
# In DEL-04-07's product crate: the family's eligibility, mapping and eccentric-offset rules.
- core/product_physics/src/rigid_component.rs
- core/product_physics/src/w15_rigid_scaling_tests.rs
- core/product_physics/src/w15c_eccentric_offset_tests.rs
# The rigid family's input rules in validation.rs; the bend and branch rules in the same file are
# DEL-03-03's and DEL-03-04's.
- core/product_physics/src/validation.rs
# Identification of reference-section results: the producer's reader, its independent verifier
# and the desktop's display of the mark.
- core/reporting/result_export/src/component_body.rs
- tests/verifiers/component_body.py
- apps/desktop/src/features/results/componentBody.ts
# Independent references for the scale, the weight and the eccentric step.
- validation/references/w15_rigid_scaling/**
- validation/references/w15_component_weight/**
- validation/references/w15c_eccentric_reducer/**
# Shared with DEL-03-02, which owns the format: the rigid family's field kinds, completeness rule
# and diagnostic codes in it are this deliverable's.
- schemas/component.schema.yaml
# Shared with DEL-02-01, which owns the document: the rigid-family members of a component in it,
# the eccentric offset among them, are this deliverable's.
- schemas/model.schema.yaml
# Shared with DEL-07-03, which owns features/component-creation/**. RigidDraftFields.tsx carries
# the stiffness scale, its source, the consumption declaration and the centre-of-gravity
# convention note; eccentricOffsetConvention.ts carries the offset convention. The per-quantity
# unit entry of AC-007 is in componentIntent.ts, PropertyInspector.tsx and PipeViewport.tsx, which
# this deliverable does not list.
- apps/desktop/src/features/component-creation/RigidDraftFields.tsx
- apps/desktop/src/features/component-creation/eccentricOffsetConvention.ts
# The component's weight is generated in core/product_physics/src/self_weight.rs, held by
# DEL-05-01; the reducer pressure step and its references (validation/references/rt_a3_reducer,
# rt_a3_reducer_2b) are DEL-04-07's.
checks:
- tests/test_component_section_schema.py
- core/product_physics/src/w15_rigid_scaling_tests.rs
- core/product_physics/tests/w15_rigid_scaling_benchmarks.rs
