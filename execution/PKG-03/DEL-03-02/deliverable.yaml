id: DEL-03-02
name: Pipe section and component library schema
needs:
- from: DEL-02-02
  condition: >-
    The unit catalog's one dimension vocabulary includes each dimension a section, component or
    hanger value may carry (length, angle, area, second moment of area, section modulus, volume per
    length, mass per length, force, force per length, mass, linear stiffness, rotational stiffness
    and dimensionless), each with its catalog units.
  gating: true
- from: DEL-02-01
  condition: >-
    The model document fixes the component kinds a model may contain, so that every concrete
    component family a library record names is a kind the model admits.
  gating: true
- from: DEL-01-02
  condition: >-
    The protected-data boundary policy states what a public artifact may not contain (protected
    dimensional and rating tables, standards data, proprietary vendor catalogues), which provenance
    members a public data record carries, and that suspect content is quarantined and not used.
  gating: true
- from: DEL-01-03
  condition: >-
    The contributor certification workflow fixes the attestation a public data contribution
    carries, which a provenance block records as its contributor and contributor certification.
  gating: true
- from: DEL-00-04
  condition: >-
    The persistence rules require every kind of persisted document to have a schema that requires
    its version field, and require a save and reopen to return semantically equal content, units
    and provenance included, with only documented volatile fields differing.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the members a diagnostic carries (code, class, severity, source,
    affected object, message, remediation and provenance) and the warning classes a library
    diagnostic may take.
  gating: true
- from: DEL-03-07
  condition: >-
    The local library store keeps a section, component or hanger library document that the import
    boundary accepted as private and returns it unchanged, so that what a user saved is what is
    read back.
  gating: false
  when: Storing a library and reading it back.
code_paths:
# schemas/component.schema.yaml is shared: the record, field-slot, provenance and family-contract
# mechanisms are this deliverable's; the field kinds, completeness rule and diagnostic codes of the
# bend, branch, rigid and expansion-joint families in it are DEL-03-03's to DEL-03-06's.
- schemas/section.schema.yaml
- schemas/component.schema.yaml
- schemas/hanger.schema.yaml
- fixtures/component/**
- fixtures/hanger/invented_hanger_library_valid.json
checks:
- tests/test_component_section_schema.py
- tests/test_hanger_library_schema.py
