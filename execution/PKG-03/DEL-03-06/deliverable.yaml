id: DEL-03-06
name: Expansion joint component model
needs:
- from: DEL-02-01
  condition: >-
    A component in the model document is a typed, closed record with a stable identifier, a kind,
    among which is expansion joint, and a node; the document describes every component member a
    reader decodes, each quantity with its unit and each sourced value with its provenance; and a
    document saves and reopens with equal content.
  gating: true
- from: DEL-03-02
  condition: >-
    The component library format provides the record, the field slot (a quantity or text reference
    with its value status, public-value policy and provenance), the family contract and the
    completeness rule into which the expansion-joint family's field kinds and diagnostics are
    declared, with linear stiffness and rotational stiffness as separate dimensions.
  gating: true
- from: DEL-02-02
  condition: >-
    The unit catalog converts a joint's lengths, areas, forces and stiffnesses to one consistent
    basis and rejects a dimensional mismatch before the value reaches the solve.
  gating: true
- from: DEL-01-02
  condition: >-
    The protected-data boundary policy states that no public artifact may contain proprietary
    manufacturer data, so that every joint stiffness, area, limit and hardware value is supplied
    by the user.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the members a joint finding carries (code, class, severity,
    source, affected object, message, remediation and provenance).
  gating: true
- from: DEL-04-01
  condition: >-
    The frame kernel assembles a two-node element's stiffness over its nodes' twelve degrees of
    freedom into the global stiffness beside the other members and solves it deterministically in
    the sparse and dense modes.
  gating: true
- from: DEL-04-07
  condition: >-
    The product solve admits an expansion joint authored as an objective connector that replaces
    its span, with or without explicit tie rods, on the exact route; applies the pressure thrust
    of its effective area as a load; and publishes the joint's actions and each rod's force.
  gating: false
  when: Solving a model that contains an expansion joint.
- from: DEL-09-01
  condition: >-
    The invented reference system and its independent references are maintained, with an expansion
    joint with tie rods among its members.
  gating: false
  when: Examining the reference system's expansion joint on the exact route.
code_paths:
# The connector and tie-rod elements. DEL-04-01 lists the frame kernel crate and names these files
# as this deliverable's element definitions.
- core/solver/frame_kernel/src/connector.rs
- core/solver/frame_kernel/src/tie_rod.rs
- core/solver/frame_kernel/tests/connector_assembly.rs
- core/solver/frame_kernel/tests/connector_references.rs
- core/solver/frame_kernel/tests/tie_rod_element.rs
# In DEL-04-07's product crate: the joint's input rules, its refusals and its published actions.
- core/product_physics/src/joint.rs
- core/product_physics/src/tie_rod_tests.rs
- core/product_physics/tests/connector_pp_paths.rs
- core/product_physics/tests/connector_system_references.rs
- core/runner/headless/tests/objective_connector.rs
# Independent references for the connector. The tied and pressurized joint references
# (validation/references/t4_u5a, t4_u5b) are held by DEL-04-07.
- validation/references/t4_i12/**
# Shared with DEL-03-02, which owns the format: the expansion-joint family's field kinds,
# completeness rule and diagnostic codes in it are this deliverable's.
- schemas/component.schema.yaml
# Shared with DEL-02-01, which owns the document: the expansion-joint members of a component and
# the objective_connector definition in it are this deliverable's.
- schemas/model.schema.yaml
# Shared with DEL-07-03, which owns features/component-creation/**: the connector's entered
# members in this form are this deliverable's definition.
- apps/desktop/src/features/component-creation/ConnectorDraftFields.tsx
checks:
- tests/test_component_section_schema.py
- core/solver/frame_kernel/tests/connector_references.rs
- core/solver/frame_kernel/tests/connector_assembly.rs
- core/solver/frame_kernel/tests/tie_rod_element.rs
- core/product_physics/tests/connector_pp_paths.rs
- core/product_physics/tests/connector_system_references.rs
- core/runner/headless/tests/objective_connector.rs
- core/runner/headless/tests/tied_joint_references.rs
- apps/desktop/src/features/component-creation/componentIntent.test.ts
