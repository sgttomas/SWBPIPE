id: DEL-03-08
name: Pipe section property and mass-property calculator
needs:
- from: DEL-02-02
  condition: >-
    The unit catalog decides whether a unit belongs to a dimension (length, density, area, second
    moment of area, section modulus, volume per length, mass per length) and converts between
    units of one dimension by exact recorded constants, so that the calculator checks its inputs
    against the catalog and combines no magnitudes in different units.
  gating: true
- from: DEL-03-02
  condition: >-
    The section library format names a pipe section's dimension kinds (outside diameter, wall
    thickness, corrosion allowance, mill tolerance, insulation thickness) and property kinds
    (metal area, inside diameter, second moment, section modulus, torsion constant, mass per
    length, contents volume per length), the quantity shape of magnitude, unit, dimension and
    provenance, and the section diagnostic codes, so that the calculator's inputs can be read
    from a section record and its outputs and findings written in the same terms.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the members a calculator finding carries (code, class,
    severity, source, affected object, message, remediation and provenance).
  gating: true
- from: DEL-04-07
  condition: >-
    The product's section and mass adapter computes, from the same explicit outside diameter,
    wall, mill tolerance, corrosion allowance and densities, the area, second moment, torsion
    constant and mass per length with their units, in a form that can be compared with the
    calculator's case by case.
  gating: false
  when: Comparing the calculator with the product's adapter.
- from: DEL-09-02
  condition: >-
    A calculation witness evaluates its closed forms without product code, and its committed
    renderings equal what is generated from it.
  gating: false
  when: Examining the calculator against the witness's closed-form area, section modulus and torsion constant of a circular annulus.
code_paths:
- core/section_properties/**
# The product's own annulus algebra (core/product_physics/src/annulus_geometry.rs and
# pressure_exact/source_geometry.rs) is DEL-04-07's adapter, on DEL-05-03's section bases; it is
# compared with this calculator and is not this deliverable's code.
checks:
- tests/test_section_properties.py
- tests/test_calculation_witness.py
