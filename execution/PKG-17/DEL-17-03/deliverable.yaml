id: DEL-17-03
name: Native open JSON export package
needs:
- from: DEL-17-02
  condition: >-
    The common export contract defines the export package, the export profile and its fields, the
    stable ID map with its four carrier modes, the manifest, and the loss report with its six
    categories and the members of a loss entry.
  gating: true
- from: DEL-02-01
  condition: >-
    The model document has a schema, one current version and a validator, and every addressable
    record has an identifier that other records name.
  gating: true
- from: DEL-00-04
  condition: >-
    A hashed JSON payload is hashed as SHA-256 over its RFC 8785 canonical form, and each hash
    record names its payload.
  gating: false
- from: DEL-12-02
  when: A package is written to a file
  condition: >-
    Every sink through which the product exposes project-derived content is reached only through a
    catalogued route's wrapper; every route returns its controlled export before exposure, and when
    the export is blocked no output file is written.
  gating: true
- from: DEL-15-04
  condition: >-
    The authority-wording screen is one check shared by the handoff and export records that need it,
    and finds wording of approval, certification, sealing, authentication, compliance, external
    validation, acceptance or prover status in a string, a list or a nested record, whatever its
    letter case.
  gating: false
# The native package's own code. No desktop, API or command-line entry is part of this deliverable:
# the desktop panel that presents a native package, apps/desktop/src/features/native-package/**,
# is DEL-07-12's and is not listed here.
code_paths:
- core/handoff/native_json/**
- schemas/native_json_export.schema.json
- fixtures/native_json/invented/**
checks:
- tests/test_native_json_export_package.py
- apps/desktop/src/features/native-package/NativePackagePanel.test.ts
- apps/desktop/src/features/results/loadReferenceOutputRefusal.test.tsx
- apps/desktop/src/features/results/retainedPrecisionOutputRefusal.test.tsx
- apps/desktop/e2e/r2-smoke.spec.ts
