id: DEL-17-06
name: Stress-neutral CSV/JSON package
needs:
- from: DEL-17-02
  condition: >-
    The common export contract defines the export package, its profile, the manifest, the stable
    ID map, and the loss report with its six categories and the members of a loss entry.
  gating: true
- from: DEL-08-04
  condition: >-
    The result export document carries a solved result as the solve stated it: every value with
    its unit and dimension, rows with stable identifiers in a deterministic order, the diagnostics
    of the received result, and the identities of the model and run behind it, in one current
    schema version.
  gating: true
- from: DEL-14-02
  condition: >-
    An analysis run record binds a result to its model state, solver build, settings, units, load
    cases and rule-pack references, states its hashes with their scope and profile apart from any
    received checksum, and gives the standing and row classes the product result reader assigns; a
    result the reader refuses yields a named refusal and no record.
  gating: true
- from: DEL-08-02
  condition: >-
    One implementation of the canonical JSON form gives, for any JSON payload, its RFC 8785
    canonical bytes and their SHA-256 digest, the same on every surface of the product.
  gating: true
- from: DEL-14-05
  when: The package expresses a comparison tolerance or a comparison outcome
  condition: >-
    The comparison contracts define mapping records, unmatched classifications, tolerance profiles
    and the common comparison-result interface, and supply no tolerance value the user did not
    choose.
  gating: false
- from: DEL-15-04
  condition: >-
    The authority-wording screen is one check shared by the handoff and export records that need it,
    and finds wording of approval, certification, sealing, authentication, compliance, external
    validation, acceptance or prover status in a string, a list or a nested record, whatever its
    letter case.
  gating: false
# The Python builder, reader and writer, the two schemas and the invented fixture. In
# apps/desktop/src/features/stress-neutral/** the builder and validator functions that the panel
# calls are this deliverable's; the panel itself and its presentation are DEL-07-12's, which lists
# the same directory. apps/desktop/src/services/rulePackRefDiagnostics.ts is DEL-14-02's (rule-pack
# reference resolution diagnostics); DEL-17-06 and DEL-08-04 use its record-projection helpers.
# The *.stress_neutral.json files are packages this deliverable's builders wrote; DEL-05-02's globs
# fixtures/results/pressure_load_state_*.json and pressure_source_load_state_*.json also match
# some of them.
code_paths:
- core/handoff/stress_neutral/**
- schemas/stress_neutral_export.schema.json
- schemas/stress_neutral_export.v0.3.schema.json
- fixtures/stress_neutral/invented/**
- fixtures/results/*.stress_neutral.json
- apps/desktop/src/test-support/desktop-shaped/*.stress_neutral.json
- apps/desktop/src/features/stress-neutral/**
- apps/desktop/src/services/rulePackRefDiagnostics.ts
- tests/test_stress_neutral_*.py
checks:
- tests/test_stress_neutral_export_package.py
- tests/test_stress_neutral_physics_source.py
- tests/test_stress_neutral_transport.py
- apps/desktop/src/features/stress-neutral/nativeStressNeutralBuilder.test.tsx
- apps/desktop/src/features/stress-neutral/StressNeutralExportPanel.test.tsx
- apps/desktop/src/features/stress-neutral/rulePackExclusionDiagnostics.test.ts
- apps/desktop/src/features/result-export/exactOutputTwins.test.tsx
- apps/desktop/src/features/result-export/exactOutputContractMutations.test.ts
