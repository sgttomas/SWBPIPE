id: DEL-17-09
name: Export adapter SDK and additional targets
needs:
- from: DEL-17-02
  condition: >-
    The common export contract defines the export package, the fields of an export profile, the
    stable ID map and its carrier modes, the manifest, and the loss report with its six
    categories, including an external-execution policy that is optional and user-owned.
  gating: true
- from: DEL-17-01
  condition: >-
    The source register states what makes a source admitted: its source ID, what it establishes,
    its boundary, and the open questions no admitted source answers.
  gating: true
- from: DEL-02-04
  condition: >-
    The plugin and extension contract refuses a manifest that turns off a no-bypass control, and
    no code path in the product loads or runs a plugin.
  gating: true
- from: DEL-10-01
  condition: >-
    The public API boundary denies permissions by default and admits undecided as the only grant
    state, and names no transport, endpoint, runtime, loader or granted permission.
  gating: true
- from: DEL-10-02
  condition: >-
    The adapter framework's dispatch gate dispatches no adapter: an accepted declaration returns a
    blocked outcome naming the unselected execution model, and the gate takes no argument through
    which code could run.
  gating: true
- from: DEL-12-02
  when: A registry is written to a file
  condition: >-
    Every governed route returns its controlled export before anything is exposed, and when the
    export is blocked no output file is written.
  gating: true
- from: DEL-15-04
  condition: >-
    The external-prover boundary identifies text that states an authority claim (certification,
    approval, code compliance) so that a record can refuse it.
  gating: false
# The Python registry builder, the schema and the invented template and fixture. The desktop panel
# apps/desktop/src/features/export-adapter-sdk/ExportAdapterSdkPanel.tsx is DEL-07-12's and
# is not listed here.
code_paths:
- core/handoff/export_adapter_sdk/**
- schemas/export_adapter_sdk.schema.json
- fixtures/export_adapter_sdk/invented/**
checks:
- tests/test_export_adapter_sdk.py
- apps/desktop/src/features/results/loadReferenceOutputRefusal.test.tsx
- apps/desktop/src/features/results/retainedPrecisionOutputRefusal.test.tsx
- apps/desktop/src/App.test.tsx
- apps/desktop/e2e/r2-smoke.spec.ts
