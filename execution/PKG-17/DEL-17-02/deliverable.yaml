id: DEL-17-02
name: Export package, profile, and stable ID map contracts
needs:
- from: DEL-17-01
  condition: >-
    The source register lists each admitted source with its source ID, location, admitted use and
    boundary, and lists the open questions about target behaviour with the deliverables each one
    affects.
  gating: true
- from: DEL-00-04
  condition: >-
    A hashed JSON payload is hashed as SHA-256 over its RFC 8785 canonical form and each hash
    record names its payload; a reader accepts only the current version of a persisted document
    and refuses any other by name.
  gating: true
- from: DEL-00-06
  condition: >-
    A diagnostic carries code, class, severity, source, affected object, message, remediation and
    provenance. When it crosses a boundary every field other than class arrives unchanged, and the
    class changes only where the receiving boundary's schema requires its own class vocabulary, by
    that boundary's stated mapping.
  gating: true
- from: DEL-02-01
  condition: >-
    Every addressable record of the model document has an identifier that other records name, so
    that a stable ID map can account for each one.
  gating: false
- from: DEL-01-02
  condition: >-
    The data boundary policy defines the provenance record and its value sets and states what
    public fixtures and examples may contain.
  gating: false
# The contract has no module of its own: its definitions are realised in each target's schema and
# writer, which belong to DEL-17-03 to DEL-17-09. The desktop helper that forms a unit disclosure,
# apps/desktop/src/features/exportUnitDisclosure.ts, applies this contract and is listed by
# DEL-07-12 as shared desktop code.
code_paths: []
