id: DEL-17-04
name: CAEPIPE MBF export profile and deterministic writer
needs:
- from: DEL-17-01
  condition: >-
    The source register admits the public CAEPIPE manual pages for MBF import and export, layout,
    units, load cases, supports, materials and bends, each with its source ID and boundary, and
    lists the open questions on target version, record subset and identity carriage; the dossier
    holds the vendor questions linked to them.
  gating: true
- from: DEL-17-02
  condition: >-
    The common export contract defines the export package, the export profile and its fields, the
    stable ID map with its four carrier modes, the manifest, and the loss report with its six
    categories and the members of a loss entry.
  gating: true
- from: DEL-02-01
  condition: >-
    The model document has one current version, a schema with a desktop profile and a validator,
    and every path by which a document enters the product applies the same format and validator
    checks.
  gating: true
- from: DEL-09-01
  when: Exit criterion 6 is examined on the reference system
  condition: >-
    The invented reference system is maintained as a model document containing the families of
    exit criterion 1, with the load cases it holds.
  gating: true
- from: DEL-12-02
  when: The desktop saves an MBF
  condition: >-
    The route catalogue holds a lossless route for the MBF export that admits only the local-private
    context with the user's stated intent, and a native save refuses content whose hash its
    evidence does not name.
  gating: true
- from: DEL-07-07
  when: The desktop runs the writer or the importer
  condition: >-
    The desktop runs engine work in a capped worker under the per-invocation memory budget and can
    cancel the worker and release its memory.
  gating: false
- from: DEL-04-07
  when: The desktop runs the writer or the importer
  condition: >-
    Engine work in the desktop is admitted only within the per-invocation memory budget and the
    shared pool, and a request that would exceed them is refused by name.
  gating: false
- from: DEL-07-12
  when: A user exports or imports MBF in the desktop
  condition: >-
    The desktop offers File > Export MBF and File > Import MBF, each a dialog that shows the
    engine's review and acts only through this deliverable's native commands.
  gating: true
- from: DEL-10-05
  when: The round trip's two solves are compared
  condition: >-
    The headless runner solves a model document and returns the product's published result for it.
  gating: false
- from: DEL-17-05
  when: The importer is examined on pilot and authored cases
  condition: >-
    The correlation cases are public invented models with their SWBPIPE model documents, and the
    authored MBF cases each state the construct exercised and the importer outcome expected.
  gating: false
- from: DEL-15-04
  condition: >-
    The external-prover boundary identifies text that states an authority claim (certification,
    approval, code compliance) so that a package can refuse it.
  gating: false
# The writer, the importer, their engine and the native commands. In
# apps/desktop/src/features/caepipe-mbf/, which DEL-07-12 also lists, the modules named here carry
# the commands' request retirement and session rules and are this deliverable's; the dialogs, the
# panel and their presentation modules are DEL-07-12's. The authored MBF cases under
# validation/caepipe_correlation/authored/ are listed by DEL-17-05, which runs them; their
# importer expectations are examined here.
