id: DEL-17-05
name: CAEPIPE external run harness and CSV parser
needs:
- from: DEL-17-04
  when: Running a case through the user's CAEPIPE and binding its results
  condition: >-
    The MBF writer returns, for a model in its subset, the MBF and an identity file that maps MBF
    node numbers, element rows and supports to SWBPIPE identifiers and records the MBF's hash; the
    MBF importer reads an MBF as an unbound import and returns its outcome with named refusals.
  gating: true
- from: DEL-17-01
  condition: >-
    The source register admits the public CAEPIPE pages for batch execution, MBF import, data
    export and print to file, each with its source ID and boundary, and lists the open question on
    stable CSV result sections.
  gating: true
- from: DEL-17-02
  condition: >-
    The common export contract defines the manifest, the stable ID map, the loss report, and an
    export profile whose external-execution policy is optional, user-owned harness metadata only.
  gating: true
- from: DEL-10-05
  when: Comparing SWBPIPE's results with the prover's
  condition: >-
    The headless runner solves a model document and returns the product's published result for it,
    the same as the desktop's for the same request, with a unit on every quantity.
  gating: true
- from: DEL-08-04
  when: Comparing SWBPIPE's results with the prover's
  condition: >-
    Exported result rows keep stable identifiers and a deterministic order, so that a row of
    SWBPIPE's result is found again by its identifier.
  gating: true
- from: DEL-01-02
  condition: >-
    The data boundary policy states the rule for the external prover: what public text may say
    about it, what stays private, and that no public text claims agreement.
  gating: false
- from: DEL-12-02
  when: A run package is written to a file
  condition: >-
    Every sink through which the product exposes project-derived content is reached only through a
    catalogued route's wrapper; every route returns its controlled export before exposure, and when
    the export is blocked no output file is written.
  gating: true
- from: DEL-15-04
  condition: >-
    The authority-wording screen is one check shared by the handoff and export records that need it,
    and finds wording of approval, certification, sealing, authentication, compliance, external
    validation, acceptance or prover status in a string, a list or a nested record, whatever its
    letter case.
  gating: false
# The harness, the parser, the comparison, the cases and the benchmark models. The desktop panel
# that reviews external-run evidence, apps/desktop/src/features/caepipe-external/**, is DEL-07-12's;
# it invokes nothing and is not listed here. The authored
# MBF cases under validation/caepipe_correlation/authored/ are run here; the importer expectations
# they state are examined by DEL-17-04.
code_paths:
- core/handoff/caepipe_external/**
- schemas/caepipe_external_run.schema.json
- fixtures/caepipe_external/invented/**
- tools/caepipe_correlation/**
- validation/caepipe_correlation/**
- validation/caepipe_benchmark/**
checks:
- tests/test_caepipe_external_run_package.py
- tests/test_caepipe_print_csv_parser.py
- tests/test_caepipe_correlation.py
- tests/test_caepipe_data_boundary.py
- tests/test_caepipe_private_correlation.py
- tests/test_check_public_observations.py
- tests/test_caepipe_benchmark.py
- apps/desktop/src/features/results/loadReferenceOutputRefusal.test.tsx
- apps/desktop/src/features/results/retainedPrecisionOutputRefusal.test.tsx
- apps/desktop/src/App.test.tsx
