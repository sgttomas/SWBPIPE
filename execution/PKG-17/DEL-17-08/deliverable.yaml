id: DEL-17-08
name: GLB/glTF review geometry export
needs:
- from: DEL-17-02
  condition: >-
    The common export contract defines the export package, its profile, the manifest, the stable
    ID map and its carrier modes, the loss report with its six categories, the declaration every
    timestamp field carries, and the hash basis of package members.
  gating: true
- from: DEL-17-01
  condition: >-
    The source register admits the Khronos glTF 2.0 specification with its source ID and boundary,
    and lists the open question on which geometry fields and identity metadata suffice for review.
  gating: true
- from: DEL-02-01
  condition: >-
    The model document gives every node and element a stable identifier, with node coordinates in
    the project's length unit in one right-handed global frame.
  gating: true
- from: DEL-12-02
  when: A review geometry package is written to a file
  condition: >-
    Every governed route returns its controlled export before anything is exposed, and when the
    export is blocked no output file is written.
  gating: true
- from: DEL-15-04
  condition: >-
    The external-prover boundary identifies text that states an authority claim (certification,
    approval, code compliance) so that a package can refuse it.
  gating: false
# The Python profile, writer and package builder, the schema and the invented fixtures.
# apps/desktop/src/features/review-geometry/ReviewGeometryPanel.tsx is shared with DEL-07-12: the
# glTF and package builder in it is this deliverable's, and AC-007 requires the saved package to
# be the writer's; the panel's rendering is DEL-07-12's.
code_paths:
- core/handoff/review_geometry/**
- schemas/review_geometry_export.schema.json
- fixtures/review_geometry/invented/**
- apps/desktop/src/features/review-geometry/ReviewGeometryPanel.tsx
checks:
- tests/test_review_geometry_export_package.py
- apps/desktop/src/features/workspace/exactCurrentPanels.test.tsx
- apps/desktop/src/features/results/loadReferenceOutputRefusal.test.tsx
- apps/desktop/src/App.test.tsx
- apps/desktop/e2e/r2-smoke.spec.ts
