id: DEL-17-07
name: Conservative PCF subset exporter
needs:
- from: DEL-17-02
  condition: >-
    The common export contract defines the export package, its profile, the manifest, the stable
    ID map and its carrier modes, the loss report with its six categories and the members of a
    loss entry, and the hash basis of package members.
  gating: true
- from: DEL-17-01
  condition: >-
    The source register admits the public CAEPIPE PCF translator document with its source ID and
    boundary, and lists the open question on the first supported PCF target profile.
  gating: true
- from: DEL-02-01
  condition: >-
    The model document gives every pipe, component, node and support a stable identifier, with
    coordinates, section dimensions and labels that carry their units.
  gating: true
- from: DEL-02-02
  condition: >-
    An export that takes a unit from the project units is refused by name when that key is
    missing and writes no substitute, and a length an export converts is converted exactly through
    the unit's definition.
  gating: true
- from: DEL-12-02
  when: A PCF or its package is written to a file
  condition: >-
    Every sink through which the product exposes project-derived content is reached only through a
    catalogued route's wrapper; every route returns its controlled export before exposure, and when
    the export is blocked no output file is written.
  gating: true
- from: DEL-15-04
  condition: >-
    The authority-wording screen is one check shared by the handoff and export records that need it,
    and finds wording of approval, certification, sealing, authentication, compliance, external
    validation, acceptance or prover status in a string, a list or a nested record, whatever its
    letter case.
  gating: false
# The Python profile, writer and package builder, the schema and the invented fixtures.
# apps/desktop/src/features/pcf-export/PcfExportPanel.tsx is shared with DEL-07-12: the PCF text
# and package builder in it is this deliverable's, and AC-007 requires the saved package to be the
# writer's; the panel's rendering is DEL-07-12's.
code_paths:
- core/handoff/pcf_export/**
- schemas/pcf_export.schema.json
- fixtures/pcf_export/invented/**
- apps/desktop/src/features/pcf-export/PcfExportPanel.tsx
checks:
- tests/test_pcf_export_package.py
- apps/desktop/src/features/results/loadReferenceOutputRefusal.test.tsx
- apps/desktop/src/features/results/retainedPrecisionOutputRefusal.test.tsx
- apps/desktop/src/App.test.tsx
# Also examines DEL-02-02's refusal of an export with a missing project unit, on other export
# routes as well as this one; DEL-07-12 lists it too.
- apps/desktop/src/features/exportProjectUnitRefusal.test.tsx
- apps/desktop/e2e/r2-smoke.spec.ts
