id: DEL-08-03
name: Warnings, assumptions, and provenance report section
needs:
- from: DEL-00-06
  condition: A diagnostic is a machine-readable record with code, class, severity, source, affected object,
    message and remediation, and provenance where applicable. The product has six warning classes and a
    boundary may declare local classes; a diagnostic crossing a boundary keeps every field other than its
    class, which changes only where the receiving boundary's schema requires its own vocabulary, by that
    boundary's stated mapping.
  gating: true
- from: DEL-04-06
  condition: The solver's findings are diagnostic records that name the entity they concern, and a refused,
    singular or unconverged model is reported by a named diagnostic and never as solved.
  gating: true
- from: DEL-05-04
  condition: The analysis statuses distinguish mechanics solved, rule inputs incomplete, user-rule checked
    or failed, model incomplete and human review required, and no status the software emits states human
    approval or code compliance.
  gating: true
- from: DEL-02-01
  condition: A material, section, component or support in the model document can record its source, and
    can carry a structured provenance record with the fields of PRD section 20.2.
  gating: true
- from: DEL-03-07
  condition: A library and every record in it carry the seven provenance members with a redistribution
    status and a review status, and a missing or unclear member is a finding, never a defaulted value.
  gating: true
- from: DEL-07-03
  condition: A model entity to which a library record was applied keeps a reference to that record, and
    a reference that no longer resolves, or whose library has changed since it was applied, is reported
    against that entity.
  when: Before a report lists library records for a model that refers to a library.
  gating: false
- from: DEL-08-02
  condition: The audit manifest names a run's model hash, its software and solver versions and each
    participating rule pack's checksum, each as a record that states what it covers.
  gating: true
- from: DEL-01-04
  condition: The claims registry gives each boundary statement one canonical text with its placement rules,
    and one display form for each automatic analysis status.
  gating: true
- from: DEL-12-02
  condition: Every report is classified with one export context before project data is exposed; the
    local-private context is admitted only with the user's explicit intent; and under a user's per-report
    release private project data is kept while every other private class is not.
  gating: true
- from: DEL-06-03
  condition: A user-rule check run reports each missing rule-check-required input as a rule-check-blocking
    finding that names the input, and reports no evaluated outcome on that basis.
  gating: true
- from: DEL-06-04
  condition: A rule pack's identity, version, checksum and source note can be shown in a report without
    any of the pack's formulas or values.
  gating: true
code_paths:
- core/reporting/report_sections/**
- schemas/report_sections.schema.yaml
- fixtures/reports/invented/report_sections_provenance_records.json
- fixtures/reports/invented/component_provenance_cross_layer_projection.json
- apps/desktop/src/features/report/provenanceReasonEntities.ts
# Shared with DEL-08-01, which owns the renderer and the report input builder. This deliverable's part
# is the content of the warnings, assumptions and provenance section in each.
- core/reporting/report_renderer/src/lib.rs
- apps/desktop/src/features/report/renderableReportInput.ts
checks:
- core/reporting/report_sections/src/lib.rs
- tests/test_report_sections_contract.py
- tests/test_report_sections_provenance_records.py
- core/reporting/report_renderer/tests/render.rs
- apps/desktop/src/features/report/renderedReport.test.tsx
- apps/desktop/src/features/report/reportPackageRequest.test.ts
