id: DEL-08-05
name: Report protected-content linter
needs:
- from: DEL-01-02
  condition: The IP and data boundary policy names every class of prohibited public content, the seven
    fields of the provenance record with their value sets, and the quarantine steps for suspected protected
    content, and names this deliverable as the enforcer in report linting and the release-candidate scan.
  gating: true
- from: DEL-01-04
  condition: The claims registry and the report notice template give the required report notice word for
    word and identify the claims PRD section 21.2 prohibits, so that the linter can flag a prohibited claim
    and admit the notice.
  gating: true
- from: DEL-00-06
  condition: A diagnostic carries code, class, severity, source, affected object, message and remediation;
    the six warning classes include the IP-boundary warning; and a boundary that uses a local class states
    its mapping to one of the six.
  gating: true
- from: DEL-08-01
  condition: The calculation report's public template, and each rendered report and its PDF, are available
    as text with a surface kind and provenance, and are identifiable among a release candidate's artifacts.
  when: Before a release candidate's report artifacts and templates are scanned.
  gating: true
- from: DEL-09-05
  condition: The release-readiness security profile checks a named tree for private data and real secrets
    and reports a pass or the findings.
  when: Before a release-candidate scan runs its private-data and secret check.
  gating: true
- from: DEL-10-04
  condition: A release candidate is bound to one repository revision and its shipped artifacts, installer
    payloads included, can be enumerated for the scan.
  when: Before the release-candidate scan of exit criterion 14.
  gating: true
- from: DEL-10-02
  condition: An adapter's accepted declaration confers no runtime authority; each report or export an
    adapter or plugin requests passes a runtime admission gate that can refuse it.
  when: Before an adapter or plugin runtime produces a report or export.
  gating: true
code_paths:
- core/reporting/protected_content_linter/**
- schemas/report_protected_content_linter.schema.yaml
- fixtures/report_lint/invented/**
- apps/desktop/src/features/report-lint/ReportLintPanel.tsx
# The release-candidate scan runner and its member helper (DEC-058).
- tools/release/run_release_candidate_scan.py
- tools/release/release_members.py
checks:
- tests/test_report_protected_content_linter.py
- tests/test_release_candidate_scan.py
- core/reporting/protected_content_linter/src/lib.rs
- core/reporting/protected_content_linter/tests/cli_scope.rs
- core/reporting/report_renderer/tests/render.rs
- apps/desktop/e2e/r2-smoke.spec.ts
