id: DEL-08-01
name: Calculation report generator
needs:
- from: DEL-08-02
  condition: The audit manifest names a run's model hash, input-manifest hash, solver identity, unit-system
    reference and rule-pack references, each hash record stating its algorithm, basis and payload; its
    validator reports what is missing; and one canonical JSON form with SHA-256 is available for member
    and composition hashes.
  gating: true
- from: DEL-08-03
  condition: The warnings, assumptions and provenance section defines its diagnostic, assumption, user-supplied
    value, provenance and library records, and decides from a provenance record's statuses and the report's
    context whether the record is rendered, warned or blocks the report.
  gating: true
- from: DEL-08-04
  condition: The result export document has one current version, validates against its schema, copies the
    received result's members and identifies each by the hash of its canonical value, and a form check
    refuses a document that is not in that form.
  gating: true
- from: DEL-08-05
  condition: The protected-content linter evaluates text targets it is given, with their surface kind and
    provenance, and returns findings with a severity, so that a blocking finding can block a report before
    and after rendering.
  gating: true
- from: DEL-08-06
  condition: The state, comparison and handoff section set names the run it belongs to and restates the
    current state and run by identity and hash, so that the package can check it against its other members.
  gating: true
- from: DEL-12-02
  condition: Export contexts include public report, local private and user-released report; a report is
    classified before project data is exposed; private values are retained only under local-private context
    with explicit user intent or under a user release; and each report sink (render, HTML save, print,
    package save, user-released package save) has a governed route that screens its payload.
  gating: true
- from: DEL-01-04
  condition: The report notice template holds the PRD section 19.3 notice word for word with the disclosure
    slots and sign-off block a report fills, and the claims registry gives one display form for each automatic
    analysis status and the registered boundary statements.
  gating: true
- from: DEL-05-04
  condition: The analysis statuses keep mechanics solved, rule inputs incomplete, user-rule checked or failed
    and human review required apart, and none the software emits states human approval or code compliance.
  gating: true
- from: DEL-06-04
  condition: A rule pack is identified by a stable identity, name, version and checksum with a source notice
    and a redistribution status, all of which can be shown without any of the pack's content.
  gating: true
- from: DEL-06-03
  condition: A user-rule check run gives, for each check and each load case or combination it was evaluated
    on, an outcome status and the names of the inputs that were missing.
  gating: true
- from: DEL-05-03
  condition: A stress row states the section basis it was recovered on, so that a stress maximum can be
    identified for each basis.
  gating: true
- from: DEL-05-01
  condition: A load case that declares the hydrostatic test condition is marked as a test case in the model
    and in the published result.
  gating: true
- from: DEL-02-01
  condition: The model document gives nodes, pipes, components, materials, sections, supports, loads and
    load combinations as addressable records with stored values and units, and has a model hash that is
    stable across save and reopen.
  gating: true
- from: DEL-02-05
  condition: A persisted document, the report package included, has one current version; a reader accepts
    only that version and refuses every other by name, with no migration.
  gating: true
- from: DEL-14-02
  condition: The run record of a solve names its run, the model state it solved, its input manifest and
    the hash of the result it received.
  gating: true
- from: DEL-04-07
  condition: The product solve publishes a result on the pressure-free and exact routes under a current
    result identity, and each result binds the exact request it was computed from.
  gating: true
- from: DEL-07-07
  condition: A completed solve job's result is held by the native host, which can say for a later report
    request whether a submitted result and model are the bytes that job delivered and received, and a
    disposed result is no longer held.
  gating: true
- from: DEL-04-08
  condition: The one product reader gives a result its standing (numerically eligible, needing recomputation
    or unsupported) as a verdict every reader surface takes, and an exact-route result's limitations are
    the texts of its semantic table, bound by the reviewed-input digests.
  gating: true
- from: DEL-03-01
  condition: A model entity to which a library record was applied carries a detectable library reference,
    and the library store reports the references a model carries.
  when: Before a user-released report is admitted and before a report lists library records.
  gating: true
