name: Piping Desktop E2E

on:
  pull_request:
    paths:
      - ".github/workflows/piping-desktop-e2e.yml"
      - "projects/chirality-piping/**"
  workflow_dispatch:

permissions:
  contents: read

# Keep only the current run for a pull request while allowing manually
# dispatched branch proofs to finish independently.
concurrency:
  group: piping-desktop-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop-e2e:
    name: Desktop E2E (source mode)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      PLAYWRIGHT_HTML_OPEN: never
      PLAYWRIGHT_WORKERS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: projects/chirality-piping/package-lock.json

      - name: Setup pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown

      - name: Cache pinned wasm-bindgen CLI
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: ${{ runner.os }}-wasm-bindgen-cli-0.2.123

      - name: Install pinned wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.123 --locked

      - name: Cache Cargo registry and WASM target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            projects/chirality-piping/core/model_operations/operation_applier/target
          key: ${{ runner.os }}-rust-1.97.1-${{ hashFiles('projects/chirality-piping/core/model_operations/operation_applier/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.97.1-

      - name: Install project dependencies
        run: npm ci
        working-directory: projects/chirality-piping

      # The desktop build is deliberately offline. Populate the complete
      # locked graph, including host/transitive dependencies, before building.
      - name: Fetch complete locked WASM dependency graph
        run: >-
          cargo fetch --locked
          --manifest-path core/model_operations/operation_applier/Cargo.toml
        working-directory: projects/chirality-piping

      - name: Build desktop WASM engine
        run: npm run build:wasm:desktop
        working-directory: projects/chirality-piping

      - name: Resolve pinned Playwright version
        id: playwright-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
        working-directory: projects/chirality-piping

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Configure canonical Ubuntu package sources
        shell: bash
        run: |
          set -euo pipefail
          source /etc/os-release
          test -n "${VERSION_CODENAME}"
          test -f /usr/share/keyrings/ubuntu-archive-keyring.gpg
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<EOF
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu/
          Suites: ${VERSION_CODENAME}-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: projects/chirality-piping

      - name: Install Chromium and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: projects/chirality-piping

      - name: List source-mode desktop tests
        run: >-
          ../../node_modules/.bin/playwright test --list
          --project=chromium-desktop
          --project=chromium-compact
        working-directory: projects/chirality-piping/apps/desktop

      # The registered 120s ceiling is measured on local hosts; a fresh,
      # serial hosted-Ubuntu runner needs 180s for the existing full journey.
      - name: Run source-mode desktop tests
        run: >-
          ../../node_modules/.bin/playwright test
          --project=chromium-desktop
          --project=chromium-compact
          --timeout=180000
          --reporter=list,html
        working-directory: projects/chirality-piping/apps/desktop

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: piping-desktop-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            projects/chirality-piping/apps/desktop/playwright-report
            projects/chirality-piping/apps/desktop/test-results
          if-no-files-found: warn
          retention-days: 14
