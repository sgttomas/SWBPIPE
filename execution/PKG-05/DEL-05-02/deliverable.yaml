id: DEL-05-02
name: Load-case algebra engine
needs:
- from: DEL-04-07
  condition: >-
    DEL-05-02 needs DEL-04-07's ordinary preview-physics-2 and pressure-2 product
    publications (pressure-1 and preview-physics-1 are refused by name since T4-U4b/U5b),
    including the T4-U4b section quantities, arc maxima and T4-U5b tie-rod rows, for
    its base readers and conformance corpus, and the evaluation
    of model-authored combinations through this deliverable's algebra crate.
    The exact pressure contract remains DEL-04-07's Work/pressure-contract.md.
    DEL-04-08 declares the retained producer and memory-qualification inputs.
  gating: true
  evidence: core/product_physics/src/lib.rs
- from: DEL-04-08
  condition: >-
    DEL-05-02's shared result dispatch, standing and row semantics consume
    DEL-04-08's retained validators, receipt contracts and
    preview-physics-retained-1, physics-retained-1 and pressure-source-1 tables.
    Their digests, row classes and refusal outcomes must remain coherent with
    the base-route readers. DEL-05-02 retains the base-reader checks that G7
    applies to a successor's projected statement.
  gating: true
  evidence: core/reporting/result_export/src/semantic_contract.rs
- from: DEL-04-01
  condition: >-
    DEL-05-02 needs DEL-04-01's frame-kernel `exact_sum::ExactAccumulator`, with
    which the algebra forms a linear combination as one exact sum rounded once
    (E13). DEL-04-08 declares the separate retained-kernel and exact-boundary
    inputs used by its verification method.
  gating: true
  evidence: core/solver/frame_kernel/src/exact_sum.rs
- from: DEL-05-03
  condition: >-
    DEL-05-02's base readers need DEL-05-03's D-5 section bases and D-6 Timoshenko
    straight-member contract (Work/section-bases-and-timoshenko.md sections 1 to 3;
    Work/section-and-shear-decisions.md). They interpret the section bases and
    shear model from captured section inputs. They also recompute the T4-U4b section
    quantities bit for bit, independently of the producer, by the normative sequences of
    DEL-05-03's `stress_recovery::section_stress_quantities`. The retained readers
    rederive both bases and the prepared Timoshenko shear-area leaf for O4's retained-source
    and W1-E publications (DEL-04-08 Design o4-source-extension.md).
  gating: true
  evidence: execution/PKG-05/DEL-05-03/Work/section-bases-and-timoshenko.md
- from: DEL-05-01
  condition: >-
    DEL-05-02 needs DEL-05-01's primitive-load contract (`core/loads/primitive_loads`): the
    `LoadDimension` vocabulary and the boundary-record types (`BoundaryQuantityRecord`,
    `QuantityUnitMetadata`, `CanonicalSchemaBinding`) that the algebra's operands, dimension
    checks and result-boundary records use, and the identified primitive load cases that
    model-authored combinations name.
  gating: true
  evidence: core/loads/primitive_loads/src/lib.rs
- from: DEL-02-02
  condition: >-
    DEL-05-02 needs DEL-02-02's unit catalog (`core/units`). The Rust readers convert
    captured authored quantities through it (`unit_by_symbol`, `convert_for_dimension`,
    `canonical_unit`), and the test-only verifier's `tests/verifiers/units.py` is checked
    against its committed catalog and witness tables. Conversion constants and the
    calculation-unit policy stay with DEL-02-02.
  gating: true
  evidence: core/units/src/lib.rs
- from: DEL-05-04
  condition: >-
    DEL-05-02 needs DEL-05-04's analysis-status vocabulary
    (`schemas/analysis_status.schema.yaml`). Algebra results preserve the mechanics-solved,
    rule-input, user-rule and human-review states, add human review, and never emit
    `HUMAN_APPROVED_FOR_PROJECT` automatically.
  gating: true
  evidence: schemas/analysis_status.schema.yaml
- from: DEL-00-01
  condition: >-
    DEL-05-02 takes its implementation stack from DEL-00-01's accepted architecture
    decisions (AB-00-01) and makes no package-local stack decision.
  gating: false
  evidence: execution/PKG-00/DEL-00-01/ArchitectureBasis.md
- from: DEL-00-02
  condition: >-
    DEL-05-02 follows DEL-00-02's module boundaries and dependency direction (AB-00-02). The
    algebra and the Rust readers depend inward on domain contracts, and the test-only Python
    verifiers under `tests/verifiers/` share no code with the producer.
  gating: false
  evidence: execution/PKG-00/DEL-00-02/ArchitectureBasis.md
- from: DEL-00-03
  condition: >-
    DEL-05-02's algebra results and reader verdicts keep DEL-00-03's command/query/job
    separation of mechanics-solved, rule-checked and human-approved states (AB-00-03).
  gating: false
  evidence: execution/PKG-00/DEL-00-03/ArchitectureBasis.md
- from: DEL-00-06
  condition: >-
    DEL-05-02 carries DEL-00-06's diagnostic and result-envelope fields (AB-00-06: code,
    class, severity, source, affected object, message, remediation and provenance) on algebra
    findings and on reader refusals that reach product envelopes.
  gating: false
  evidence: execution/PKG-00/DEL-00-06/ArchitectureBasis.md
- from: DEL-00-08
  condition: >-
    DEL-05-02 verifies under DEL-00-08's layered test strategy (AB-00-08): deterministic
    algebra tests, reader conformance corpora read natively, in wasm and by the independent
    Python verifier, and independent review of numerical-meaning changes.
  gating: false
  evidence: execution/PKG-00/DEL-00-08/ArchitectureBasis.md
