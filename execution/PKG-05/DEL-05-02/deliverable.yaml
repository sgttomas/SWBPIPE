id: DEL-05-02
name: Load-case algebra engine
needs:
- from: DEL-04-07
  condition: >-
    DEL-05-02 needs DEL-04-07's product solve as the producer its readers, corpora and
    retained-precision Designs bind: the ordinary preview-physics-1 and pressure-1
    publications; the W1 retained successors (`retained_product.rs`, `retained_wire.rs`)
    formed under DEF-O, DEF-C and DEF-E; the pressure-source-1 receipts (`source_recovery.rs`,
    `source_receipt/`), including their named source-family declines; and the evaluation of
    model-authored combinations through this deliverable's algebra crate. The retained pricing
    tool qualifies its registered profile against DEL-04-07's selected memory budget
    (12 GiB per invocation, the 0.9 M margin, the 5 % TEXT reserve and the shared 75 % pool
    policy; Design/memory-budget-decision.md). The exact pressure contract is DEL-04-07's
    Design/pressure-contract.md.
  gating: true
  evidence: execution/PKG-04/DEL-04-07/Design/memory-budget-decision.md
- from: DEL-04-01
  condition: >-
    DEL-05-02 needs DEL-04-01's frame kernel: `exact_sum::ExactAccumulator`, with which the
    algebra forms a linear combination as one exact sum rounded once (E13); the
    retained-precision kernel under `structural/retained/`, reached through
    `structural::retained_api` (source, declared member-load ledger, assembly, verification,
    recovery, retained combinations and the loaded-maximum search), whose certificates the
    readers check and whose layouts the pricing tool prices; the exact boundary
    (`structural/exact_boundary.rs`: exact blocks of order at most four, declared member
    congruence and metered work) behind pressure-source-1; and the K-D5 member-relative bound
    (Design/kd5-member-relative-bound.md), which routes a case into retained-source recovery.
  gating: true
  evidence: core/solver/frame_kernel/src/structural/retained/mod.rs
- from: DEL-05-03
  condition: >-
    DEL-05-02 needs DEL-05-03's D-5 section bases and D-6 Timoshenko straight member
    (Design/section-bases-and-timoshenko.md sections 1 to 3 and 5;
    Design/section-and-shear-decisions.md). The readers and verifiers rederive both section
    bases and the shear model from the captured section inputs (`section_basis.rs`,
    `tests/verifiers/section_basis.py`). Retained-source and W1 route E publication stay
    limited to zero mill tolerance, zero corrosion allowance and `euler_bernoulli` until the
    O4 source extension, which needs the same rules.
  gating: true
  evidence: execution/PKG-05/DEL-05-03/Design/section-bases-and-timoshenko.md
- from: DEL-05-05
  condition: >-
    DEL-05-02 needs DEL-05-05's semantics for authored full-span uniform distributed member
    loads (an element target, category `distributed_force`, dimension `force_per_length`, a
    `global_x|y|z` direction and no extent) and their consistent equivalent nodal load on a
    straight member. W1 route L declares each such load as six binary1024 equivalent nodal
    entries, discloses their difference from that consistent load, and both readers check the
    captured authored load at G8 (Design/w1-member-load-certification.md sections 2 and 6).
  gating: true
  evidence: core/loads/user_loads/src/lib.rs
- from: DEL-05-01
  condition: >-
    DEL-05-02 needs DEL-05-01's primitive-load contract (`core/loads/primitive_loads`): the
    `LoadDimension` vocabulary and the boundary-record types (`BoundaryQuantityRecord`,
    `QuantityUnitMetadata`, `CanonicalSchemaBinding`) that the algebra's operands, dimension
    checks and result-boundary records use, and the identified primitive load cases that
    model-authored combinations name.
  gating: true
  evidence: core/loads/primitive_loads/src/lib.rs
- from: DEL-02-02
  condition: >-
    DEL-05-02 needs DEL-02-02's unit catalog (`core/units`). The Rust readers convert
    captured authored quantities through it (`unit_by_symbol`, `convert_for_dimension`,
    `canonical_unit`), and the test-only verifier's `tests/verifiers/units.py` is checked
    against its committed catalog and witness tables. Conversion constants and the
    calculation-unit policy stay with DEL-02-02.
  gating: true
  evidence: core/units/src/lib.rs
- from: DEL-05-04
  condition: >-
    DEL-05-02 needs DEL-05-04's analysis-status vocabulary
    (`schemas/analysis_status.schema.yaml`). Algebra results preserve the mechanics-solved,
    rule-input, user-rule and human-review states, add human review, and never emit
    `HUMAN_APPROVED_FOR_PROJECT` automatically.
  gating: true
  evidence: schemas/analysis_status.schema.yaml
- from: DEL-00-01
  condition: >-
    DEL-05-02 takes its implementation stack from DEL-00-01's accepted architecture
    decisions (AB-00-01) and makes no package-local stack decision.
  gating: false
  evidence: execution/PKG-00/DEL-00-01/ArchitectureBasis.md
- from: DEL-00-02
  condition: >-
    DEL-05-02 follows DEL-00-02's module boundaries and dependency direction (AB-00-02). The
    algebra and the Rust readers depend inward on domain contracts, and the test-only Python
    verifiers under `tests/verifiers/` share no code with the producer.
  gating: false
  evidence: execution/PKG-00/DEL-00-02/ArchitectureBasis.md
- from: DEL-00-03
  condition: >-
    DEL-05-02's algebra results and reader verdicts keep DEL-00-03's command/query/job
    separation of mechanics-solved, rule-checked and human-approved states (AB-00-03).
  gating: false
  evidence: execution/PKG-00/DEL-00-03/ArchitectureBasis.md
- from: DEL-00-06
  condition: >-
    DEL-05-02 carries DEL-00-06's diagnostic and result-envelope fields (AB-00-06: code,
    class, severity, source, affected object, message, remediation and provenance) on algebra
    findings and on reader refusals that reach product envelopes.
  gating: false
  evidence: execution/PKG-00/DEL-00-06/ArchitectureBasis.md
- from: DEL-00-08
  condition: >-
    DEL-05-02 verifies under DEL-00-08's layered test strategy (AB-00-08): deterministic
    algebra tests, reader conformance corpora read natively, in wasm and by the independent
    Python verifier, and independent review of numerical-meaning changes.
  gating: false
  evidence: execution/PKG-00/DEL-00-08/ArchitectureBasis.md
