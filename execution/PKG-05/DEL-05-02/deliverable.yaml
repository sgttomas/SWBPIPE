id: DEL-05-02
name: Load-case algebra engine
needs:
- from: DEL-04-07
  condition: >-
    The product solve publishes each load case's rows with their identities, its modulus basis and
    each member's resolved stiffness, and names the fixed-load sources of the model; it evaluates
    model-authored combinations through this algebra and publishes their rows, gate records and
    evidence; and it solves one case with every nonlinear support held at a given state assignment
    (DEL-04-07/REQ-012).
  gating: true
  when: Combining product results and examining criteria on them
- from: DEL-04-01
  condition: >-
    The frame kernel gives an exact accumulator whose sum of exact products is rounded once and
    correctly rounded two- and three-component norms, and its integrity check gives each member
    force and moment group of a solved case a bound with its scale.
  gating: true
- from: DEL-04-04
  condition: >-
    The active-set record of a converged nonlinear case gives each nonlinear support's final state
    (active or inactive, sticking or sliding).
  gating: true
  when: Combining cases of a model with nonlinear supports
- from: DEL-05-01
  condition: >-
    A load case is identified and holds its primitive loads with their category, target, direction,
    dimension and magnitude, so that the loads of one case can be compared by content with those
    of another, and a hydrostatic test case is marked as one. The primitive-load crate supplies the
    `LoadDimension` vocabulary and the boundary-record types (`BoundaryQuantityRecord`,
    `QuantityUnitMetadata`, `CanonicalSchemaBinding`) that the algebra's operands, dimension checks
    and result-boundary records use.
  gating: true
- from: DEL-05-03
  condition: >-
    Each stress row names the section basis it was recovered on, and the stress row kinds are
    defined so that those with no combined meaning can be told apart.
  gating: false
- from: DEL-02-01
  condition: >-
    The model document carries a combination's basis, its terms with factors or its operand
    references, its range mode, its declared difference basis and its subtrahend support state,
    each kept as authored.
  gating: true
- from: DEL-02-02
  condition: >-
    The unit catalog gives each result quantity's dimension and its conversion to the consistent
    basis, and reports an unknown or incompatible unit as a named finding.
  gating: true
- from: DEL-05-04
  condition: >-
    The status vocabulary defines the mechanics, rule-input and user-rule statuses and human review
    required as software statuses and reserves human acceptance to a person.
  gating: true
- from: DEL-04-08
  condition: >-
    The retained-precision method defines its semantic tables, receipts and refusal outcomes, to
    which this deliverable's ordinary result reader dispatches a retained result.
  gating: true
  when: Reading a retained-precision result
- from: DEL-00-06
  condition: >-
    A diagnostic record has the fields code, class, severity, source, affected object, message,
    remediation and provenance.
  gating: false
- from: DEL-09-01
  condition: >-
    One invented reference system holds every family and analysis the release target's exit
    criterion 1 lists as an exact-route document, with references for its key results from a
    generator that imports no product code.
  when: Examining the reference-system criterion
  gating: false
