id: DEL-05-04
name: Analysis status semantics
needs:
- from: DEL-01-04
  condition: >-
    The claims registry gives each automatic status one display form in one authority domain,
    registers no display form for human acceptance, and no registered statement or display form
    states or implies a claim PRD §21.2 prohibits.
  gating: false
- from: DEL-00-06
  condition: >-
    The result envelope distinguishes invalid input, incomplete model, mechanics result, rule-check
    result and human-review-needed, and carries diagnostics that a status envelope can reference.
  gating: false
- from: DEL-10-05
  when: Examining the interface part of AC-001 on the headless runner
  condition: >-
    The analysis status of every runner result is one of the six automatic statuses, a rule-check
    outcome maps only to the three user-rule statuses, and no output states compliance,
    certification, sealing or approval (DEL-10-05 AC-010).
  gating: false
- from: DEL-14-02
  when: Examining the interface part of AC-001 on the analysis-run record
  condition: >-
    The analysis statuses of a run record are those of this vocabulary, and no status, field or
    label of a run states approval, certification, sealing, authentication or code compliance
    (DEL-14-02 AC-011).
  gating: false
- from: DEL-06-03
  when: Examining the rule-check part of AC-002
  condition: >-
    A rule-check run emits only the three user-rule statuses, leaves the mechanics status and every
    mechanics result unchanged when a rule input is missing, and reports no outcome within or
    exceeding the limit on a basis whose required values are not all present (DEL-06-03 AC-002,
    AC-011, REQ-008).
  gating: false
code_paths:
# The status envelope schema and the semantics document. DEL-02-03 also lists the schema; the
# status vocabulary and the envelope are this deliverable's, and the analysis boundary record
# (schemas/analysis_boundary.schema.yaml) is DEL-02-03's.
- schemas/analysis_status.schema.yaml
- docs/architecture/analysis_status_semantics.md
- tests/test_analysis_status_schema.py
# The desktop's label table for the statuses defined here. Its display forms are DEL-01-04's
# registry, and DEL-07-11 lists the file for the shell that shows them.
- apps/desktop/src/features/workspace/statusLabels.ts
checks:
- tests/test_analysis_boundary_schema.py
- tests/test_analysis_status_schema.py
- tests/test_api_boundary_contract.py
- tests/test_report_generator_contract.py
- tests/test_report_sections_contract.py
- tests/test_results_schema.py
- apps/desktop/src/features/workspace/statusLabels.test.ts
- apps/desktop/src/features/workspace/statusLabels.tokens.test.ts
