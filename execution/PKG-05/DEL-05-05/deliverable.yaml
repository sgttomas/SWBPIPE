id: DEL-05-05
name: Concentrated and distributed user load application
needs:
- from: DEL-05-01
  condition: >-
    The primitive load engine prepares a force or moment at a node, and a uniform load per length
    on a member over its whole span or a stated part, into solver contributions in a deterministic
    order, reports each invalid load as a finding with its identity, and gives a blocked case no
    partial set of loads. The user-load crate takes its load dimensions, its boundary-record
    vocabulary and the prepared `PrimitiveAxialEffectContribution` records from the primitive-load
    crate.
  gating: true
- from: DEL-04-02
  condition: >-
    The straight pipe element gives the work-consistent equivalent nodal loads of a full-span
    uniform load, a partial-span uniform load and a point force at a station, in global axes, for
    Euler-Bernoulli members; for a Timoshenko member it gives the exact Timoshenko loads of a
    partial span and refuses a point member force by name.
  when: Solving a load on a straight member
  gating: true
- from: DEL-04-01
  condition: >-
    The frame kernel's curved-bend element gives the equivalent nodal loads of a uniform load per
    unit arc length over a whole realized arc.
  when: Applying a distributed load on a realized arc
  gating: true
- from: DEL-02-01
  condition: >-
    The model document carries a load case's concentrated force, concentrated moment and
    distributed load with its target, direction, dimension, magnitude with unit, optional span and
    provenance, each kept as authored.
  gating: true
- from: DEL-02-02
  condition: >-
    The unit catalog has the force, moment and force-per-length dimensions with their conversions
    to the consistent basis, and reports an unknown, missing or incompatible unit as a named
    finding.
  gating: true
- from: DEL-00-06
  condition: >-
    A diagnostic record has the fields code, class, severity, source, affected object, message,
    remediation and provenance.
  gating: false
- from: DEL-09-01
  condition: >-
    The mechanics benchmark suite holds the hand calculations under
    `validation/hand_calcs/mechanics/`, each expected value with a derivation that imports, reads
    and runs no product code and a provenance record (DEL-09-01 AC-005).
  when: Examining the criteria against the hand calculations
  gating: false
code_paths:
# The user-load crate. The product solve does not link it; only the mechanics benchmark suite
# (DEL-09-01) does. Whether it stays part of this deliverable is not decided (see the scope).
- core/loads/user_loads/**
# On the product route a user load is applied in the product solve crate, through DEL-05-01's
# preparation and DEL-04-02's element: the nodal and uniform member loads and their formed load
# primitives are in these two files, which DEL-05-01 lists for the loads it generates and
# DEL-04-07 for their composition. In lib.rs the constant-effort and variable-spring
# classification, their loads and the not-consumed warning are DEL-04-03's.
- core/product_physics/src/lib.rs
- core/product_physics/src/certified_loads.rs
# The desktop's user-load vocabulary: which target, directions and dimension each kind takes. The
# panel that uses it is DEL-07-03's.
- apps/desktop/src/features/load-cases/primitiveLoadVocabulary.ts
checks:
- core/loads/user_loads/src/lib.rs
- core/solver/straight_pipe/tests/timoshenko_loads.rs
- apps/desktop/src/features/load-cases/primitiveLoadVocabulary.test.ts
- apps/desktop/src/features/load-cases/LoadCaseManagerPanel.test.tsx
