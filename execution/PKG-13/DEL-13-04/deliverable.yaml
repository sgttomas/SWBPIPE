id: DEL-13-04
name: Physical-to-analytical transformation contract
needs:
- from: DEL-00-01
  condition: >-
    The baseline in force names JSON Schema 2020-12 as the dialect of public schemas and
    interchange documents.
  gating: true
- from: DEL-00-03
  when: Exposing the transform through an application service
  condition: >-
    Every command and job returns a result envelope that carries its diagnostics, and a query
    leaves the model and the stored project unchanged.
  gating: true
- from: DEL-00-04
  condition: >-
    The persistence rules define the canonical hash as SHA-256 over the RFC 8785 form of a JSON
    payload, and state that every persisted document declares its schema version.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the fields a diagnostic record carries (code, class, severity,
    source, affected object, message, remediation, provenance) and names the six warning
    classes, the solve-blocking and assumption-warning classes among them.
  gating: true
- from: DEL-00-07
  condition: >-
    The API boundary map marks each seam between the layers internal or public, and nothing it
    marks internal is exposed by the public API contract.
  gating: true
- from: DEL-02-01
  condition: >-
    The model document is the editable physical model: its records have stable identifiers,
    every dimensional value carries its unit, and the model can carry physical-to-analytical
    traceability links.
  gating: true
- from: DEL-02-02
  condition: >-
    The dimension vocabulary is stated once, in the unit schema, and every unit has one
    dimension from it.
  gating: true
- from: DEL-04-01
  condition: >-
    The frame kernel takes a model of centerline nodes, each with six degrees of freedom in one
    fixed public order, joined by two-node elements that each have a validated right-handed
    local triad.
  gating: true
- from: DEL-04-03
  condition: >-
    A support record is a support at a node, of one family, that names the degrees of freedom it
    acts on.
  gating: true
- from: DEL-05-01
  condition: >-
    A primitive load has an identity, a target, a direction, a dimension, a magnitude with its
    unit and its provenance, and a member load can state its span as two fractions of the
    member's length.
  gating: true
- from: DEL-13-01
  condition: >-
    Every design-knowledge record has a stable identifier that a typed reference can name.
  gating: false
- from: DEL-13-02
  condition: >-
    Every constraint has a stable identifier that a typed reference can name.
  gating: false
code_paths:
- core/model_transform/physical_to_analytical/**
# The transform reference format. It is not the model document, which is DEL-02-01's.
- schemas/physical_transform_model.schema.yaml
# Documents in the transform reference format. DEL-02-05's persistence check also reads the
# physical source model.
- fixtures/domain/**
- tests/test_physical_to_analytical_transform.py
- tests/test_analytical_solver_boundary_adapter.py
- tests/test_physical_transform_model_schema.py
checks:
- tests/test_physical_to_analytical_transform.py
- tests/test_analytical_solver_boundary_adapter.py
- tests/test_physical_transform_model_schema.py
