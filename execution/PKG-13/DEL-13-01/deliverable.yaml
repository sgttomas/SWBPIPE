id: DEL-13-01
name: Design knowledge schema and provenance model
needs:
- from: DEL-00-01
  condition: >-
    The baseline in force names JSON Schema 2020-12 as the dialect of public schemas and
    interchange documents.
  gating: true
- from: DEL-00-04
  condition: >-
    The persistence rules state that every persisted document declares its schema version, and
    that any change to what a document can contain raises at least the minor version.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the fields a diagnostic record carries (code, class, severity,
    source, affected object, message, remediation, provenance), and lets a boundary declare its
    own class vocabulary where its schema needs one.
  gating: true
- from: DEL-00-07
  condition: >-
    An adapter stops data with a missing or incompatible unit, missing provenance or unknown
    redistribution status before it enters the model, with a diagnostic that names the item, and
    no plugin or adapter goes around domain validation.
  gating: true
- from: DEL-01-02
  condition: >-
    The data-boundary policy names the seven fields of the provenance record with the
    redistribution-status and review-status value sets, and names each class of protected
    content a public artifact may not contain.
  gating: false
- from: DEL-01-04
  condition: >-
    The claims registry is the single source of boundary language: a surface that needs it uses
    a registered statement and composes no prohibition list of its own.
  gating: true
- from: DEL-02-01
  condition: >-
    Every addressable record of the model document has a stable identifier that persists across
    edits, so that a design-knowledge record can name the model entities it applies to.
  gating: false
- from: DEL-02-02
  condition: >-
    The dimension vocabulary is stated once, in the unit schema, and every unit has one
    dimension from it.
  gating: true
code_paths:
- schemas/design_knowledge.schema.json
- tests/test_design_knowledge_schema.py
# The invented design-knowledge document bundled in the desktop. The panel that shows it and the
# commands that load it are DEL-07-08's.
- fixtures/product_preview/invented_design_knowledge.json
checks:
- tests/test_design_knowledge_schema.py
