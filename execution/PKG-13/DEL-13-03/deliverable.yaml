id: DEL-13-03
name: Constraint validation engine
needs:
- from: DEL-00-01
  when: Publishing the validation result's schema
  condition: >-
    The baseline in force names JSON Schema 2020-12 as the dialect of public schemas and
    interchange documents.
  gating: true
- from: DEL-00-03
  when: Exposing validation through an application service
  condition: >-
    Every command and job returns a result envelope that carries its diagnostics, and a query
    leaves the model and the stored project unchanged.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the fields a diagnostic record carries (code, class, severity,
    source, affected object, message, remediation, provenance) and the outcome kinds a result
    envelope distinguishes.
  gating: true
- from: DEL-02-01
  condition: >-
    The model document gives every node its coordinates as numbers in the project length unit in
    one global right-handed Cartesian frame, every pipe its two end nodes, and every addressable
    record a stable identifier.
  gating: true
- from: DEL-02-02
  condition: >-
    The unit catalog converts a quantity to the canonical unit of its dimension, and gives a
    named finding and no value for an unknown unit, a missing unit or a unit of another
    dimension.
  gating: true
- from: DEL-13-01
  condition: >-
    A design-knowledge record has a stable identifier, one of the stated kinds, its provenance
    record, and quantities that carry their unit and dimension; a corridor or zone states its
    extent as geometry.
  gating: true
- from: DEL-13-02
  condition: >-
    A constraint record states its kind, state, origin, target entities, design-knowledge
    references, parameters and provenance, and the constraint format names the finding class of
    each category.
  gating: true
code_paths:
- core/constraints/validation/**
- tests/test_constraint_validation.py
checks:
- tests/test_constraint_validation.py
