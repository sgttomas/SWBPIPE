id: DEL-15-02
name: Target mapping and unsupported-behavior contract
needs:
- from: DEL-00-01
  condition: >-
    The baseline in force names JSON Schema 2020-12 as the dialect of public schemas and interchange
    documents.
  gating: true
- from: DEL-00-06
  condition: >-
    A diagnostic carries code, class, severity, source, affected object, message, remediation and
    provenance, and a boundary's local class has a stated mapping to the six warning classes.
  gating: true
- from: DEL-15-01
  condition: >-
    A handoff package manifest carries the model hash as a checksum record, a units manifest, the
    entity manifest, library and rule-pack references, unresolved assumptions, warnings and a privacy
    context, each of which a mapping's source context can name by reference.
  gating: true
- from: DEL-15-04
  condition: >-
    The authority-wording screen reports any value that contains wording of approval, certification,
    sealing, authentication, compliance, external validation, acceptance or prover status.
  gating: true
code_paths:
- core/handoff/target_mapping/**
- schemas/target_mapping.schema.json
checks:
- tests/test_target_mapping_contract.py
