id: DEL-15-04
name: External prover boundary metadata
needs:
- from: DEL-00-01
  condition: >-
    The baseline in force names JSON Schema 2020-12 as the dialect of public schemas and interchange
    documents.
  gating: true
- from: DEL-00-06
  condition: >-
    A diagnostic carries code, class, severity, source, affected object, message, remediation and
    provenance, and a boundary's local class has a stated mapping to the six warning classes.
  gating: true
- from: DEL-01-04
  condition: >-
    The claims registry is the single source of boundary language: no registered statement or display
    form states or implies a claim PRD §21.2 prohibits, and handoff packages, export metadata and
    external-prover references are presented as review aids, not as validation or acceptance.
  gating: true
- from: DEL-15-01
  condition: >-
    A handoff package has a stable package identity, derived from its model member, that another
    record can name.
  gating: false
- from: DEL-14-01
  condition: >-
    A saved model state is an immutable record with a stable identity, and no prover-status lifecycle
    is enforced on states.
  gating: false
code_paths:
# The record, and the authority-wording screen that the PKG-15 and PKG-17 handoff and export records
# also call (core/handoff/external_prover/authority_boundary.py). DEL-07-12 owns the desktop panel
# that presents this metadata.
- core/handoff/external_prover/**
- schemas/external_prover_metadata.schema.json
checks:
- tests/test_external_prover_boundary_metadata.py
