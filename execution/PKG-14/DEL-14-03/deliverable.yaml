id: DEL-14-03
name: Model-state comparison engine
needs:
- from: DEL-14-01
  condition: >-
    A saved model state is read with its snapshot verified against its model hash, and its record
    gives its identity, name, hashes, warnings, unresolved assumptions, notes and external
    references.
  gating: true
- from: DEL-02-01
  condition: >-
    Every addressable record of the model document has a stable identifier that persists across
    edits, the document's schema names every member it may hold, and the model hash is SHA-256
    over the document's RFC 8785 canonical text.
  gating: true
- from: DEL-14-05
  condition: >-
    The mapping contract defines the mapping hierarchy, the mapping record and the unmatched
    classifications, and the common comparison-result interface is accepted at a named version
    with its schema.
  gating: true
- from: DEL-02-02
  condition: >-
    The unit catalog names each unit's dimension, so that two quantities can be told to be of the
    same or of different dimensions, and a missing or unknown unit is a named finding.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the fields a diagnostic record carries (code, class, severity,
    source, affected object, message, remediation, provenance).
  gating: true
code_paths:
# The comparison in the web session. DEL-07-08 owns the view beside it (StateComparisonView.tsx)
# and the selection of two states; DEL-08-04 owns the CSV adapter (stateComparisonCsv.ts).
- apps/desktop/src/features/comparison/stateComparison.ts
# The headless comparison.
- core/comparison/model_state/engine.py
# The committed invented pairs both implementations are run on.
- fixtures/comparison/model_state_comparison_golden.json
checks:
- tests/test_model_state_comparison.py
- tests/test_model_state_comparison_parity.py
- tests/test_comparison_contracts.py
- apps/desktop/src/features/comparison/stateComparison.test.ts
- apps/desktop/src/features/comparison/stateComparisonParity.test.ts
- apps/desktop/src/features/history/compareStates.test.tsx
