id: DEL-14-02
name: Analysis run records
needs:
- from: DEL-14-01
  when: Recording a run against a saved state
  condition: >-
    A saved model state has a stable identity and a model hash that is SHA-256 over the RFC 8785
    canonical text of its snapshot, is read only after its hashes verify, and is not removed while
    a recorded run refers to it.
  gating: true
- from: DEL-04-07
  condition: >-
    A solve publishes one mechanics result with its identity and its rows, units and diagnostics as
    the primitives raised them.
  gating: true
- from: DEL-04-08
  when: Building a record of a retained-precision or retained-source result
  condition: >-
    The reader of retained-precision and retained-source statements gives each one either a named refusal or a
    standing, with the class of each row, in its native, WebAssembly and Python bindings, and
    refuses an older result version by name.
  gating: true
- from: DEL-05-02
  when: Building a record of an ordinary result
  condition: >-
    The ordinary result reader gives each ordinary result statement either a named refusal or a
    standing, in its native, WebAssembly and Python bindings, and refuses an older result version
    by name; the semantic table of each ordinary analysis route names every result row's kind, unit
    and dimension, and a result is bound to its table by identifier and digest.
  gating: true
- from: DEL-08-02
  condition: >-
    Canonical JSON has one implementation of RFC 8785 with SHA-256 hashing, and a hash record
    names the basis its digest was actually computed on and the payload it covers.
  gating: true
- from: DEL-00-04
  condition: >-
    Each kind of persisted document has one current version, a reader refuses every other version
    by name without rewriting the document, and a JSON payload is hashed as SHA-256 over its
    RFC 8785 canonical form.
  gating: true
- from: DEL-00-03
  condition: >-
    A caller changes durable state only through an application-service command, and every command
    returns a result envelope with its diagnostics.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the fields a diagnostic record carries (code, class, severity,
    source, affected object, message, remediation, provenance).
  gating: true
- from: DEL-05-04
  condition: >-
    The software's analysis statuses are a closed vocabulary that excludes human approval for a
    project and code compliance.
  gating: true
- from: DEL-02-05
  when: Recording, listing and reading runs in the project store
  condition: >-
    The project store holds each project under its identity, changes its own schema forward only,
    and refuses a store newer than the build before writing anything.
  gating: true
- from: DEL-06-04
  when: Resolving a model's rule-pack references for a solve
  condition: >-
    A rule pack kept locally has an identity, a version, a source notice and a checksum that is
    SHA-256 over the RFC 8785 canonical form of the pack with its checksum member excluded, and a
    stored pack's checksum is verified by recomputation.
  gating: true
code_paths:
- schemas/analysis_run.schema.json
- schemas/analysis_run.v0.3.schema.json
# The headless record builder and the test verifier of records. The binding to the product
# reader beside them (rust_reader.py) is DEL-04-08's and DEL-05-02's.
- core/analysis_runs/__init__.py
- core/analysis_runs/compatibility.py
# The record builder and validator of the web session, and the hash scope of a received result.
# DEL-07-05 lists the whole results feature folder.
- apps/desktop/src/services/analysisRunCompatibility.ts
- apps/desktop/src/features/results/analysisResultHashScope.ts
# The input manifest, and the resolution of a model's rule-pack references at solve time with the
# diagnostics an unresolved reference receives. DEL-08-04, DEL-15-01 and DEL-17-06 read those
# diagnostics and also list rulePackRefDiagnostics.ts.
- apps/desktop/src/services/inputManifestService.ts
- apps/desktop/src/services/modelRulePackResolution.ts
- apps/desktop/src/services/rulePackRefDiagnostics.ts
# The recorded-run tables, their immutability and integrity checks, and the run commands. The
# command that admits a pair of runs for a comparison sits in the same file and serves DEL-14-04;
# DEL-08-01 lists the file for the report package of a recorded run.
- apps/desktop/src-tauri/src/analysis_runs.rs
- apps/desktop/src/services/analysisRunService.ts
# Memory admission for reads of stored states and runs; it serves DEL-14-01's state reads too.
- apps/desktop/src-tauri/src/stored_read.rs
# DEL-07-07 owns holding a result in the native process and the commands that work from a held
# result. This deliverable's part of the files below is the record they build, validate and
# store, which equals the record of the web session byte for byte.
- apps/desktop/src-tauri/src/analysis_run_v03_build.rs
- apps/desktop/src-tauri/src/analysis_run_v03_validate.rs
- apps/desktop/src/services/analysisRunPreview.ts
- apps/desktop/src-tauri/src/native_persistence.rs
- apps/desktop/src/services/nativePersistence.ts
- apps/desktop/src-tauri/src/result_js_text.rs
- apps/desktop/src-tauri/src/stored_custody.rs
- apps/desktop/src-tauri/src/stored_save.rs
- apps/desktop/src/test-support/persistenceFormsCases.ts
- apps/desktop/src/test-support/analysis-run-v03/persistence_forms.json
# Transient and recorded run witnesses. DEL-02-05 lists the whole fixture folder.
- fixtures/persistence/transient_run_input.json
- fixtures/persistence/recorded_run_witness.json
- fixtures/persistence/transient_run_input_rule_packs.json
- fixtures/persistence/recorded_run_witness_rule_packs.json
