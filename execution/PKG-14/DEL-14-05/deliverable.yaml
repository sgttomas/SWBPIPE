id: DEL-14-05
name: Comparison mapping, tolerance, and export contracts
needs:
- from: DEL-14-01
  condition: >-
    A saved model state has a stable identity and hash records that state the payload each one
    covers, so that a comparison names a state by reference and hash.
  gating: true
- from: DEL-14-02
  condition: >-
    An analysis-run record is identified by the hash of its own revision and names its model
    state, its unit system and each result row it binds, so that a comparison names a run and its
    results by reference and hash.
  gating: true
- from: DEL-08-04
  condition: >-
    The result export document identifies each result row by a stable identifier and is itself
    identified by the hash of its canonical value.
  gating: true
- from: DEL-02-02
  condition: >-
    The dimension vocabulary is stated once, in the unit schema, and every unit of the catalog has
    one dimension from it.
  gating: true
- from: DEL-00-04
  condition: >-
    Each kind of persisted document has one current version that the document declares, and a
    reader refuses every other version by name.
  gating: true
- from: DEL-00-06
  condition: >-
    The diagnostic contract fixes the fields a diagnostic record carries (code, class, severity,
    source, affected object, message, remediation, provenance).
  gating: true
code_paths:
- schemas/comparison_mapping.schema.json
- schemas/comparison_tolerance.schema.json
checks:
- tests/test_comparison_contracts.py
- tests/test_model_state_comparison.py
- tests/test_analysis_run_comparison.py
