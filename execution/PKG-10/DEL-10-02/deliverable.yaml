id: DEL-10-02
name: Import/export adapter framework
needs:
- from: DEL-10-01
  condition: >-
    The API boundary contract is the public API and plugin boundary an adapter operation goes
    through: it states the no-bypass constraints every public operation keeps in force and the
    request kinds an operation may be.
  gating: false
- from: DEL-00-07
  condition: >-
    Adapters validate units, provenance, redistribution status, diagnostics and the private or
    public class of data before it enters core workflows, and no plugin or adapter goes around
    domain validation, rule-pack sandboxing, result envelopes or report controls.
  gating: true
- from: DEL-00-03
  condition: >-
    Every service entry point is exactly one of command, query or job, and every command and job
    returns a result envelope with its diagnostics.
  gating: true
- from: DEL-00-06
  condition: >-
    A diagnostic carries code, class, severity, source, affected object, message, remediation and
    provenance.
  gating: true
- from: DEL-00-04
  condition: >-
    A hashed JSON payload is hashed as SHA-256 over its RFC 8785 canonical form, no plugin or
    adapter opens the store or issues SQL, and every change to the store is made through an
    application service.
  gating: true
- from: DEL-01-02
  condition: >-
    The data boundary policy defines the seven members of a provenance record and the value sets
    of redistribution status and review status, and requires quarantine of suspected protected
    content.
  gating: false
- from: DEL-02-01
  when: An adapter imports a model document
  condition: >-
    Every path by which a model document enters the product applies the same format and validator
    checks, and no adapter or plugin admits a document that fails them.
  gating: true
- from: DEL-02-02
  when: An adapter validates the units and dimensions of imported data
  condition: >-
    At each product boundary a quantity with an unknown unit or a unit of the wrong dimension is
    refused with a unit finding, and a missing unit is never accepted as dimensionless.
  gating: true
- from: DEL-02-03
  condition: >-
    The analysis-status vocabulary is seven statuses of which a software surface may emit six, and
    no surface admits a compliance, certification, sealing or approval status as software output.
  gating: true
- from: DEL-03-07
  when: An adapter imports a material, section or component library
  condition: >-
    The library import boundary returns accepted as public, accepted as private and local,
    quarantined or rejected for a library, with a finding at the path of each fault.
  gating: true
- from: DEL-12-01
  when: An adapter exports or imports private project, library or rule data
  condition: >-
    Private project, library and rule-pack data are kept in user-controlled local paths, and each
    path has a public or private class that an export can read.
  gating: true
- from: DEL-12-02
  when: An adapter exports data that may leave the local project
  condition: >-
    The export control classes each value of an export and decides before exposure whether it is
    included, redacted, kept with a warning under the user's stated intent or blocked, and it
    blocks suspected protected content in every export context.
  gating: true
- from: DEL-08-04
  when: An adapter exports results
  condition: >-
    The result export is a schema-first envelope that carries units, diagnostics and provenance,
    so that an exporting adapter reads results through it and by no other route.
  gating: true
# The adapter framework's package. core/adapters/framework/plugin_verification.py sits in the same
# package and is DEL-02-04's; the package's __init__ re-exports it. The desktop panel that shows
# the framework's result (apps/desktop/src/features/adapter-framework/) is DEL-07-12's.
code_paths:
- schemas/adapter_framework.schema.yaml
- core/adapters/framework/__init__.py
- core/adapters/framework/adapter_framework.py
- fixtures/adapters/invented/**
checks:
- tests/test_adapter_framework_contract.py
