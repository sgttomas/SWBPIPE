id: DEL-10-05
name: Headless CLI and structured I/O analysis runner
needs:
- from: DEL-00-03
  condition: >-
    Every service entry point is exactly one of command, query or job, and every command and job
    returns a result envelope with its diagnostics, so that the runner is a second caller of the
    same services as the desktop.
  gating: true
- from: DEL-00-06
  condition: >-
    A diagnostic carries code, class, severity, source, affected object, message, remediation and
    provenance. When a runner diagnostic crosses to the result export, every field other than the
    class arrives unchanged, and the class changes only by the result export's stated mapping.
  gating: true
- from: DEL-04-07
  condition: >-
    The product solve is one entry for the desktop and the headless runner in both solver modes:
    the same request gives byte-identical published results and diagnostics on each, and an
    incomplete, invalid or unsupported model is refused on each with the same named diagnostic.
  gating: true
- from: DEL-04-06
  condition: >-
    A singular, ill-conditioned or incomplete model yields a named solver diagnostic with its
    affected object, and never a result with a substituted value.
  gating: true
- from: DEL-02-01
  condition: >-
    A headless solve request needs only the model document format, and the one document validator
    judges a document's members and refuses a malformed one by a named code and JSON path, so that
    the runner can refuse a document that fails either before any solve.
  gating: true
- from: DEL-02-02
  condition: >-
    At each product boundary a quantity with an unknown unit or a unit of the wrong dimension is
    refused with a unit finding, and a missing unit is never accepted as dimensionless.
  gating: true
- from: DEL-05-04
  condition: >-
    The analysis-status vocabulary is seven statuses of which software may emit the six automatic
    ones, and a user's rule-pack outcome is stated only by the three rule statuses
    (RULE_INPUTS_INCOMPLETE, USER_RULE_CHECKED and USER_RULE_FAILED), none of which states
    compliance.
  gating: true
- from: DEL-02-05
  condition: >-
    A model document has one current version and every other version is refused by name, and the
    model hash is SHA-256 over the RFC 8785 canonical form of the document.
  gating: true
- from: DEL-08-02
  condition: >-
    Every surface of the product that hashes JSON uses one canonical form, so that equal values
    give equal digests through the desktop, the headless runner and the model editor.
  gating: true
- from: DEL-08-04
  condition: >-
    The result export is a schema-first envelope with units, diagnostics and provenance, and its
    exporter validates a document against the current result-export schema.
  gating: true
- from: DEL-08-01
  when: Running export-results
  condition: >-
    The report package builder takes a report-package request and returns a container with a hash
    for each member, and defines the user-release marker that only a person's release in the
    desktop may carry.
  gating: true
- from: DEL-12-02
  condition: >-
    The export control classes each output value and blocks a private value from leaving the
    process unless local-private intent is explicit, in which case it passes with a warning.
  gating: true
- from: DEL-09-01
  when: Running a mechanics benchmark suite
  condition: >-
    The mechanics suite exposes its case inventory, each case's recorded comparison values and the
    comparison that decides a match.
  gating: false
- from: DEL-09-02
  when: Running a stress benchmark suite
  condition: >-
    The stress suite exposes its case inventory, each case's recorded comparison values and the
    comparison that decides a match.
  gating: false
- from: DEL-09-03
  when: Running the nonlinear regression suite
  condition: >-
    The nonlinear suite exposes its case inventory and, for each case, the expected outcome and
    the comparison that decides a match.
  gating: false
- from: DEL-05-02
  when: Hosting the read command
  condition: >-
    The base result readers take a result statement, with an optional model, invocation and
    recorded binding, and return a verdict that passes it or refuses it by code.
  gating: false
- from: DEL-04-08
  when: Hosting the read command
  condition: >-
    The retained-precision reader validates a retained source and its transport metadata and
    returns a verdict that passes it or refuses it by code.
  gating: false
- from: DEL-04-11
  when: Hosting the size-hangers command
  condition: >-
    The hanger sizing entry takes the sizing input as text, applies its own admission, and returns
    one published document that says whether it sized or refused.
  gating: false
- from: DEL-10-04
  condition: >-
    Hosted verification builds the runner's crate and runs its tests when its inputs change, and
    reports them through the one required result.
  gating: false
# The runner's crate, contract and artifact tests. Files inside the crate that belong to other
# deliverables: src/reader_binding.rs and tests/reader_cli.rs, tests/retained_precision_admission.rs
# (DEL-05-02, DEL-04-08); tests/size_hangers_cli.rs (DEL-04-11); the exact-route, joint and
# objective-connector tests (DEL-04-07, DEL-03-06); src/redaction_binding.rs is shared with
# DEL-12-02, whose control it binds; the export-results handling and its package tests are shared
# with DEL-08-01. The runner tests also read the runner requests and outputs under
# validation/witness/inputs and validation/witness/generated, which DEL-09-04 holds as the
# reproduction procedure's inputs and expected evidence.
code_paths:
- core/runner/headless/**
- schemas/headless_runner.schema.yaml
- tests/test_headless_runner_contract.py
- tests/test_load_reference_headless_artifacts.py
- tests/test_pressure_headless_artifacts.py
checks:
- tests/test_headless_runner_contract.py
- core/runner/headless/tests/user_release_runner_refused.rs
- core/runner/headless/tests/load_reference_cli.rs
- core/runner/headless/tests/pressure_export.rs
