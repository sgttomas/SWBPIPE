id: DEL-10-01
name: Public API and plugin boundary
needs:
- from: DEL-00-07
  condition: >-
    The boundary map marks each seam between the layers internal or public, and holds that no
    plugin or adapter goes around domain validation, rule-pack sandboxing, result envelopes or
    report controls. Every operation this contract registers falls under a seam the map marks
    public.
  gating: true
- from: DEL-00-03
  condition: >-
    Every service entry point is exactly one of command, query or job, a job reports progress and
    can be cancelled, and every command and job returns a result envelope with its diagnostics.
  gating: true
- from: DEL-00-06
  condition: >-
    A diagnostic carries code, class, severity, source, affected object, message, remediation and
    provenance, and a result envelope carries an outcome kind that separates invalid input, an
    incomplete model and a rule check that lacks data from a mechanics result.
  gating: true
- from: DEL-00-04
  condition: >-
    A hashed JSON payload is hashed as SHA-256 over its RFC 8785 canonical form, no plugin or
    adapter opens the store or issues SQL, and every change to the store is made through an
    application service.
  gating: true
- from: DEL-02-04
  condition: >-
    The plugin manifest schema defines what a plugin declares, every capability it requests is
    denied by default, and a manifest that turns off a no-bypass control is refused.
  gating: false
- from: DEL-02-01
  condition: >-
    Every path by which a model document enters the product applies the same format and validator
    checks, and no adapter or plugin admits a document that fails them.
  gating: false
- from: DEL-02-02
  condition: >-
    At each product boundary a quantity with an unknown unit or a unit of the wrong dimension is
    refused with a unit finding, and a missing unit is never accepted as dimensionless.
  gating: false
- from: DEL-05-04
  condition: >-
    The analysis-status vocabulary is seven statuses of which a software surface may emit six.
  gating: true
- from: DEL-02-03
  condition: >-
    Human acceptance appears only as a reference with bound evidence.
  gating: true
- from: DEL-02-05
  when: Where an operation carries a model snapshot hash
  condition: >-
    The model hash is SHA-256 over the RFC 8785 canonical form of the model document and is
    reproduced by an implementation that imports no product code.
  gating: false
code_paths:
- api/api_boundary_contract.yaml
- docs/architecture/plugin_boundary.md
checks:
- tests/test_api_boundary_contract.py
