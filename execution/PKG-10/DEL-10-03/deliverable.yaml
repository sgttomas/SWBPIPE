id: DEL-10-03
name: Local FEA handoff data contract
needs:
- from: DEL-00-07
  condition: >-
    The boundary map states what the local FEA handoff preserves (stable identifiers, units and
    dimensions, the coordinate basis, source hashes, diagnostics and a loss report) and that it
    claims no compatibility with a target solver and no validation.
  gating: true
- from: DEL-00-06
  condition: >-
    A diagnostic carries code, class, severity, source, affected object, message, remediation and
    provenance.
  gating: true
- from: DEL-10-01
  when: A handoff package is exported through a public operation
  condition: >-
    The API boundary contract states the request and result envelopes of an export operation and
    the no-bypass constraints it keeps in force.
  gating: true
- from: DEL-10-02
  when: A handoff package is written by an adapter or plugin
  condition: >-
    The adapter framework refuses a declaration that turns off a no-bypass control or omits a
    check of the validation plan.
  gating: true
- from: DEL-00-04
  condition: >-
    A hashed JSON payload is hashed as SHA-256 over its RFC 8785 canonical form.
  gating: true
- from: DEL-04-01
  when: Stating the criteria for when the global analysis is sufficient
  condition: >-
    The global solver is a 3D centerline frame model whose elements carry axial, shear, bending
    and torsional behaviour and no shell or solid behaviour of the pipe wall.
  gating: true
- from: DEL-05-03
  when: A package refers to recovered stresses
  condition: >-
    Each recovered stress is a result row with a stable identifier, a named stress definition and
    its unit.
  gating: true
- from: DEL-01-04
  condition: >-
    The claims registry holds the registered words for boundary language, and none of its
    statements or display forms states or implies a claim PRD §21.2 prohibits. The package and its
    guidance take any boundary language from the registry and the prohibited claims from PRD §21.2.
  gating: true
- from: DEL-02-01
  condition: >-
    Every node, pipe, component and support of a model document has a stable identifier that is
    the same after save and reopen, and the document has one model identity.
  gating: true
- from: DEL-02-02
  condition: >-
    The unit catalog gives each unit symbol its dimension, the project units name a catalog symbol
    for length, force, moment, stress, temperature and angle, and an export that takes a unit from
    a missing project key is refused by name with no substitute unit written.
  gating: true
- from: DEL-02-05
  condition: >-
    The model hash is SHA-256 over the RFC 8785 canonical form of the model document and is
    reproduced by an implementation that imports no product code.
  gating: true
# The contract and its guidance.
code_paths:
- schemas/local_fea_handoff.schema.yaml
- docs/local_analysis/local_fea_handoff_guidance.md
# Shared with DEL-07-12: the package builder and its unit rule (buildLocalFeaHandoffPacket,
# referencedResultUnits, localFeaHandoffRefusal) are this contract's; the view is DEL-07-12's.
- apps/desktop/src/features/local-fea-handoff/LocalFeaHandoffPanel.tsx
checks:
- tests/test_local_fea_handoff_contract.py
- apps/desktop/src/features/local-fea-handoff/LocalFeaHandoffPanel.test.tsx
- apps/desktop/src/features/exportProjectUnitRefusal.test.tsx
