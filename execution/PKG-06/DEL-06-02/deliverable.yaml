id: DEL-06-02
name: Sandboxed unit-aware expression evaluator
needs:
- from: DEL-06-01
  condition: >-
    A pack document declares a dimension and a unit reference for each required input and each
    value slot, names for each check the inputs and slots its formula may read, carries each
    formula as a declarative expression, and declares its grammar version at the top level.
  gating: true
- from: DEL-02-02
  condition: >-
    The unit schema states the one dimension vocabulary, in which every dimension of the grammar is
    a named dimension, and the unit catalog answers whether a symbol is a unit of a given
    dimension.
  gating: true
- from: DEL-02-03
  condition: >-
    The analysis status vocabulary is seven statuses, of which software may emit the first six and
    never HUMAN_APPROVED_FOR_PROJECT.
  gating: false
code_paths:
- core/rules/expression_evaluator/**
- fixtures/rule_expressions/conformance_corpus/**
# In the pack document module (DEL-06-01's): the codec between a pack's expression encoding and
# the tree, the formula findings of validation, and the unit check of a pack's checks.
- core/rules/rule_pack_document/src/lib.rs
# In the schema (DEL-06-01's): the expression node, expression quantity and user table
# definitions, which are the grammar's encoding.
- schemas/rule_pack.schema.yaml
# Not decided: what a rule check does with a solver value published as an interval. No scope
# states a criterion for the interval evaluation below (the evaluator's interval functions, the
# run's bounded entry, this reference and its shared cases), and no product path reaches it.
- core/analysis_runs/rule_interval.py
- fixtures/rule_interval/**
- tests/test_rule_interval.py
- core/rules/rule_check_runner/tests/interval_bounds_run.rs
- core/rules/rule_check_runner/tests/rule_interval_cases.rs
checks:
- core/rules/expression_evaluator/src/lib.rs
- core/rules/expression_evaluator/tests/conformance_corpus.rs
- core/rules/rule_pack_document/tests/corpus_parity.rs
- core/rules/rule_pack_document/tests/unit_check.rs
