id: DEL-06-05
name: Invented non-code example rule pack
needs:
- from: DEL-06-01
  condition: >-
    The pack format has a public-invented-example classification, and validation accepts a pack so
    classified only with the invented-example redistribution status, a completed protected-content
    review, an accepted review status and a source notice.
  gating: true
- from: DEL-06-02
  condition: >-
    The grammar, at a supported version, admits a declarative ratio of two declared quantities of
    one dimension and unit.
  gating: true
- from: DEL-06-03
  condition: >-
    A run of a pack with an unsupplied required input reports the check incomplete on each of its
    load cases and names the input, and supplies no value in its place.
  when: Examining AC-005 on the demo model
  gating: true
- from: DEL-06-04
  condition: >-
    The pack checksum is defined over the pack's canonical content without its checksum member,
    and a pack is publicly exportable when it is classified public with an invented-example
    redistribution status, an accepted review and no suspected protected content.
  when: Recording the example's checksum and examining its public standing
  gating: true
- from: DEL-01-02
  condition: >-
    The boundary policy states that a public example rule pack uses invented, non-code values
    only and carries a clear non-engineering notice (DEL-01-02 REQ-006), and that public content
    holds no protected standards text, table or formula and no private content.
  gating: false
- from: DEL-02-01
  condition: >-
    The bundled demo model is a valid model document whose load cases have stable identifiers,
    which the example's required load cases name.
  gating: true
code_paths:
- examples/rule_packs/**
- fixtures/product_preview/invented_demo_rule_pack.json
- docs/_Examples/rule_pack_notice.md
checks:
- tests/test_rule_pack_schema.py
- tests/test_invented_example_models.py
- core/rules/rule_pack_document/tests/invented_demo_document.rs
- core/rules/rule_check_runner/tests/invented_demo_run.rs
