id: DEL-06-04
name: Private rule-pack lifecycle and checksum handling
needs:
- from: DEL-06-01
  condition: >-
    A pack document is strict JSON that carries its identity (id, name, rule-pack version,
    lifecycle status and source notice), its classification (privacy class and redistribution
    status), a provenance record with a review status, a top-level grammar version and a checksum
    member, each status drawn from a closed vocabulary.
  gating: true
- from: DEL-00-04
  condition: >-
    The persistence rules put canonicalization before every hash: a JSON payload is hashed as
    SHA-256 over its RFC 8785 canonical form, each hash record names its payload, and storage
    follows the local storage profile.
  gating: true
- from: DEL-01-02
  condition: >-
    The boundary policy defines the handling of suspected protected content (mark it, quarantine
    it and hold it from use while unresolved) and treats an unknown redistribution status as not
    acceptable for public use.
  gating: true
- from: DEL-02-05
  condition: >-
    The project store is one local store in the application's local data folder, opened and
    migrated in one place, and persistence transmits nothing.
  gating: true
- from: external:owner
  condition: >-
    The owner decides whether stored private rule packs are encrypted and what the default is
    (PRD §27, question 11).
  when: Before any encryption of stored rule packs is built
  gating: false
code_paths:
- core/rules/rule_pack_lifecycle/**
- fixtures/rule_expressions/checksum_binding/**
# In the pack document module (DEL-06-01's): the canonical payload, the checksum computation and
# verification, and the lifecycle findings that validation returns.
- core/rules/rule_pack_document/src/lib.rs
# In the desktop host: the checksum command, the commands that save, open, list and delete a
# local rule pack, and the rule-pack table of the project store (the store itself is
# DEL-02-05's). The rest of the file belongs to the deliverables that own each command.
- apps/desktop/src-tauri/src/lib.rs
# The document a new pack starts from is built in the editor's service
# (apps/desktop/src/services/rulePackService.ts, DEL-07-03's). Its private classification is
# this deliverable's criterion.
checks:
- core/rules/rule_pack_lifecycle/src/lib.rs
- core/rules/rule_pack_document/tests/invented_demo_document.rs
