        },
        "Ai_m2": {
          "type": "number",
          "exclusiveMinimum": 0
        }
      }
    },
    "PhysicsBeamTheory": {
      "description": "The straight member's shear model (section 3.1): Euler-Bernoulli, or the energy-matched annular Timoshenko factor kappa_E with its shear area A_s = kappa_E * A_n on the nominal section. A realized arc is always Euler-Bernoulli.",
      "oneOf": [
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "model"
          ],
          "properties": {
            "model": {
              "const": "euler_bernoulli"
            }
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "model",
            "shear_factor",
            "shear_area_m2"
          ],
          "properties": {
            "model": {
              "const": "timoshenko_annulus_energy_v1"
            },
            "shear_factor": {
              "type": "number",
              "exclusiveMinimum": 0
            },
            "shear_area_m2": {
              "type": "number",
              "exclusiveMinimum": 0
            }
          }
        }
      ]
    },
