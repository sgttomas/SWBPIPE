          "exclusiveMinimum": 0
        },
        "J_m4": {
          "type": "number",
          "exclusiveMinimum": 0
        },
        "Z_m3": {
          "type": "number",
          "exclusiveMinimum": 0
        }
      }
    },
    "PhysicsPressureBore": {
      "type": "object",
      "additionalProperties": false,
      "description": "The pressure bore: the reduced wall's inner radius and bore area (pressure thrust and end caps; contents mass).",
      "required": [
        "ri_m",
        "Ai_m2"
      ],
      "properties": {
        "ri_m": {
          "type": "number",
