{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://openpipestress.org/schemas/results.v0.3.schema.yaml",
  "title": "Precision-preserving derivative result export 0.3",
  "description": "Source-bound preview-physics-2, pressure-2 and pressure-source-1 semantics and their retained-precision successors; method-specific evidence retained without engineering qualification.",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema_version",
    "deliverable_id",
    "package_id",
    "scope_item",
    "objectives",
    "export_format_status",
    "result_envelope"
  ],
  "properties": {
    "schema_version": {
      "const": "0.3.0"
    },
    "deliverable_id": {
      "const": "DEL-08-04"
    },
    "package_id": {
      "const": "PKG-08"
    },
    "scope_item": {
      "const": "SOW-046"
    },
    "objectives": {
      "type": "array",
      "minItems": 2,
      "contains": {
        "enum": [
          "OBJ-007",
          "OBJ-009"
        ]
      },
      "items": {
        "type": "string",
        "enum": [
          "OBJ-007",
          "OBJ-009"
        ]
      }
    },
    "export_format_status": {
      "$ref": "#/$defs/ExportFormatStatus"
    },
    "result_envelope": {
      "$ref": "#/$defs/ResultEnvelope"
    }
  },
  "$defs": {
    "AnalysisStatus": {
      "type": "string",
      "description": "Automatic software-emitted analysis statuses allowed in result exports. Human project acceptance is external and hash-bound.",
      "enum": [
        "MODEL_INCOMPLETE",
        "MECHANICS_SOLVED",
        "RULE_INPUTS_INCOMPLETE",
        "USER_RULE_CHECKED",
        "USER_RULE_FAILED",
        "HUMAN_REVIEW_REQUIRED"
      ]
    },
    "Checksum": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "algorithm",
        "canonicalization",
        "payload_ref",
        "value"
      ],
      "properties": {
        "algorithm": {
          "type": "string",
          "enum": [
            "sha256",
            "sha512",
            "TBD"
          ]
        },
        "canonicalization": {
          "type": "string",
          "enum": [
            "JCS",
            "NONE",
            "TBD",
            "rfc8785_jcs",
            "openpipestress_jcs_ijson_v1"
          ]
        },
        "payload_ref": {
          "$ref": "#/$defs/Reference"
        },
        "value": {
          "type": "string",
          "minLength": 1
        }
      }
    },
    "Diagnostic": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "code",
        "class",
        "severity",
        "source",
        "affected_object",
        "message",
        "remediation",
        "provenance"
      ],
      "properties": {
        "code": {
          "type": "string",
          "minLength": 1
        },
        "class": {
          "type": "string",
          "enum": [
            "SOLVE_BLOCKING",
            "RULE_CHECK_BLOCKING",
            "PROVENANCE_WARNING",
            "ASSUMPTION_WARNING",
            "NONLINEAR_WARNING",
            "IP_BOUNDARY_WARNING",
            "UNIT_WARNING",
            "EXPORT_BLOCKING",
            "TBD"
          ]
        },
        "severity": {
          "type": "string",
          "enum": [
            "info",
            "warning",
            "blocking"
          ]
        },
        "source": {
          "$ref": "#/$defs/Reference"
        },
        "affected_object": {
          "$ref": "#/$defs/Reference"
        },
        "message": {
          "type": "string",
          "minLength": 1
        },
        "remediation": {
          "type": "string",
          "minLength": 1
        },
        "provenance": {
          "$ref": "#/$defs/Provenance"
        }
      }
    },
    "ResultTraceLink": {
      "type": "object",
      "additionalProperties": false,
      "description": "Optional per-value trace link for result-boundary evidence. This records references across existing governed boundaries only; it does not infer missing provenance or expand solver behavior.",
      "required": [
        "trace_id",
        "trace_type",
        "source_ref",
        "target_ref",
        "provenance"
      ],
      "properties": {
        "trace_id": {
          "$ref": "#/$defs/Id"
        },
        "trace_type": {
          "type": "string",
          "enum": [
            "physical_source_to_analytical_model",
            "analytical_model_to_adapter_dto",
            "adapter_dto_to_solver_input",
            "solver_input_to_result_value",
            "section_property_evidence_to_result_value",
            "source_trace_link_reference",
            "TBD"
          ]
        },
        "source_ref": {
          "$ref": "#/$defs/Reference"
        },
        "target_ref": {
          "$ref": "#/$defs/Reference"
        },
        "source_field_path": {
          "type": "string",
          "minLength": 1,
          "description": "Optional field-scalar path within source_ref. When present, target_field_path is also required."
        },
        "target_field_path": {
          "type": "string",
          "minLength": 1,
          "description": "Optional field-scalar path within target_ref. When present, source_field_path is also required."
        },
        "provenance": {
          "$ref": "#/$defs/Provenance"
        },
        "diagnostics": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/Diagnostic"
          }
        }
      },
      "dependentRequired": {
        "source_field_path": [
          "target_field_path"
        ],
        "target_field_path": [
          "source_field_path"
        ]
      }
    },
    "UnitPreservationQuantity": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "value",
        "unit",
        "dimension"
      ],
      "properties": {
        "value": {
          "type": "number"
        },
        "unit": {
          "type": "string",
          "minLength": 1
        },
        "dimension": {
          "$ref": "#/$defs/DimensionId"
        }
      }
    },
    "UnitPreservationWitness": {
      "type": "object",
      "additionalProperties": false,
      "description": "Preserves received carrier value/unit without numerical conversion; carrier declaration, source mathematical meaning and derivative target dimension are independently retained.",
      "required": [
        "witness_id",
        "source_result_ref",
        "source_field_path",
        "source_quantity",
        "target_result_ref",
        "target_field_path",
        "target_quantity",
        "target_quantity_policy",
        "export_unit_policy",
        "conversion_performed",
        "unit_system_ref",
        "provenance",
        "source_row_index",
        "target_row_checksum",
        "received_carrier_row_checksum",
        "original_producer_row_checksum",
        "source_physical_semantic_dimension",
        "source_origin_ref"
      ],
      "properties": {
        "witness_id": {
          "$ref": "#/$defs/Id"
        },
        "source_result_ref": {
          "$ref": "#/$defs/Reference"
        },
        "source_field_path": {
          "type": "string",
          "minLength": 1
        },
        "source_quantity": {
          "$ref": "#/$defs/CarrierQuantity"
        },
        "target_result_ref": {
          "$ref": "#/$defs/Reference"
        },
        "target_field_path": {
          "type": "string",
          "minLength": 1
        },
        "target_quantity": {
          "$ref": "#/$defs/UnitPreservationQuantity"
        },
        "target_quantity_policy": {
          "const": "preserve_received_value_and_unit_with_independent_semantic_dimension"
        },
        "export_unit_policy": {
          "const": "no_numerical_conversion_preserve_received_unit"
        },
        "conversion_performed": {
          "const": false
        },
        "unit_system_ref": {
          "$ref": "#/$defs/Reference"
        },
        "provenance": {
          "$ref": "#/$defs/Provenance"
        },
        "source_row_index": {
          "type": "integer",
          "minimum": 0
        },
        "target_row_checksum": {
          "$ref": "#/$defs/ScopedChecksum"
        },
        "received_carrier_row_checksum": {
          "$ref": "#/$defs/ScopedChecksum"
        },
        "original_producer_row_checksum": {
          "anyOf": [
            {
              "$ref": "#/$defs/ScopedChecksum"
            },
            {
              "type": "null"
            }
          ]
        },
        "source_physical_semantic_dimension": {
          "anyOf": [
            {
              "type": "string",
              "minLength": 1
            },
            {
              "type": "null"
            }
          ]
        },
        "source_origin_ref": {
          "$ref": "#/$defs/Reference"
        }
      }
    },
    "DimensionId": {
      "type": "string",
      "enum": [
        "dimensionless",
        "length",
        "angle",
        "force",
        "moment",
        "stress",
        "area",
        "section_modulus",
        "second_moment_area",
        "ratio",
        "time",
        "temperature",
        "pressure",
        "linear_stiffness",
        "rotational_stiffness",
        "TBD"
      ]
    },
    "DownstreamUse": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "review",
        "regression_comparison",
        "report_consumption",
        "headless_automation",
        "governed_downstream_tooling",
        "additional_export_formats"
      ],
      "properties": {
        "review": {
          "const": true
        },
        "regression_comparison": {
          "const": true
        },
        "report_consumption": {
          "const": true
        },
        "headless_automation": {
          "const": true
        },
        "governed_downstream_tooling": {
          "const": true
        },
        "additional_export_formats": {
          "const": "TBD"
        }
      }
    },
    "ExportFormatStatus": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "baseline_format",
        "additional_formats",
        "public_transport_protocol",
        "local_fea_package_format",
        "external_adapter_formats"
      ],
      "properties": {
        "baseline_format": {
          "const": "schema_first_json_result_envelope"
        },
        "additional_formats": {
          "const": "TBD"
        },
        "public_transport_protocol": {
          "const": "TBD"
        },
        "local_fea_package_format": {
          "const": "TBD"
        },
        "external_adapter_formats": {
          "const": "TBD"
        }
      }
    },
    "Id": {
      "type": "string",
      "minLength": 1
    },
    "ProfessionalBoundary": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "human_review_required",
        "software_makes_compliance_claim",
        "software_makes_certification_claim",
        "software_makes_sealing_claim",
        "software_makes_approval_claim",
        "software_makes_authentication_claim"
      ],
      "properties": {
        "human_review_required": {
          "const": true
        },
        "software_makes_compliance_claim": {
          "const": false
        },
        "software_makes_certification_claim": {
          "const": false
        },
        "software_makes_sealing_claim": {
          "const": false
        },
        "software_makes_approval_claim": {
          "const": false
        },
        "software_makes_authentication_claim": {
          "const": false
        }
      }
    },
    "Provenance": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "source_name",
        "source_location",
        "source_license",
        "contributor",
        "contributor_certification",
        "redistribution_status",
        "review_status"
      ],
      "properties": {
        "source_name": {
          "type": "string",
          "minLength": 1
        },
        "source_location": {
          "type": "string",
          "minLength": 1
        },
        "source_license": {
          "type": "string",
          "minLength": 1
        },
        "contributor": {
          "type": "string",
          "minLength": 1
        },
        "contributor_certification": {
          "type": "string",
          "minLength": 1
        },
        "redistribution_status": {
          "type": "string",
          "enum": [
            "public_permissive",
            "private_only",
            "unknown",
            "protected_suspected",
            "invented_non_engineering_example",
            "TBD"
          ]
        },
        "review_status": {
          "type": "string",
          "enum": [
            "pending",
            "accepted",
            "rejected",
            "quarantined",
            "TBD"
          ]
        }
      }
    },
    "QuantityResult": {
      "type": "object",
      "additionalProperties": false,
      "allOf": [
        {
          "if": {
            "properties": {
              "family": {
                "enum": [
                  "force",
                  "moment",
                  "section_property"
                ]
              }
            },
            "required": [
              "family"
            ]
          },
          "then": {
            "required": [
              "metadata"
            ]
          }
        }
      ],
      "required": [
        "result_id",
        "family",
        "object_ref",
        "basis_ref",
        "magnitude",
        "unit",
        "dimension",
        "provenance",
        "source_kind",
        "source_row_index",
        "source_annotation_ref"
      ],
      "properties": {
        "result_id": {
          "$ref": "#/$defs/Id"
        },
        "family": {
          "$ref": "#/$defs/ResultFamily"
        },
        "object_ref": {
          "$ref": "#/$defs/Reference"
        },
        "basis_ref": {
          "$ref": "#/$defs/Reference"
        },
        "station_ref": {
          "$ref": "#/$defs/Reference"
        },
        "magnitude": {
          "type": "number"
        },
        "unit": {
          "type": "string",
          "minLength": 1
        },
        "dimension": {
          "$ref": "#/$defs/DimensionId"
        },
        "provenance": {
          "$ref": "#/$defs/Provenance"
        },
        "metadata": {
          "$ref": "#/$defs/ResultMetadata"
        },
        "diagnostics": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/Diagnostic"
          }
        },
        "trace_chain": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/ResultTraceLink"
          }
        },
        "source_kind": {
          "type": "string",
          "minLength": 1
        },
        "source_row_index": {
          "type": "integer",
          "minimum": 0
        },
        "source_annotation_ref": {
          "$ref": "#/$defs/Reference"
        },
        "component_body": {
          "$ref": "#/$defs/ComponentBodyRecord"
        }
      }
    },
    "ResultMetadata": {
      "type": "object",
      "additionalProperties": false,
      "description": "Structured metadata for result values whose sign and recovery basis are not self-evident from family, object, and unit alone. Local element force and moment components require this metadata.",
      "required": [
        "component",
        "coordinate_system",
        "location",
        "basis",
        "sign_convention"
      ],
      "properties": {
        "component": {
          "type": "string",
          "enum": [
            "axial_force",
            "shear_force_y",
            "shear_force_z",
            "torsional_moment",
            "bending_moment_y",
            "bending_moment_z",
            "nodal_force_x",
            "nodal_force_y",
            "nodal_force_z",
            "nodal_moment_x",
            "nodal_moment_y",
            "nodal_moment_z",
            "axial_normal_stress",
            "bending_normal_stress_y",
            "bending_normal_stress_z",
            "torsional_shear_stress",
            "pressure_hoop_stress",
            "pressure_longitudinal_stress",
            "section_area",
            "section_modulus_y",
            "section_modulus_z",
            "torsion_constant",
            "torsion_radius",
            "TBD",
            "nodal_displacement_x",
            "nodal_displacement_y",
            "nodal_displacement_z",
            "nodal_rotation_x",
            "nodal_rotation_y",
            "nodal_rotation_z",
            "Fx",
            "Fy",
            "Fz",
            "Mx",
            "My",
            "Mz",
            "force_magnitude",
            "moment_magnitude",
            "maximum_absolute_normal_stress",
            "wall_axial_end_action",
            "wall_axial_force",
            "effective_axial_force",
            "axial_membrane_stress",
            "lame_inner_radial_stress",
            "lame_outer_radial_stress",
            "lame_inner_hoop_stress",
            "lame_outer_hoop_stress",
            "sigma_plus",
            "sigma_minus",
            "tau_v_max",
            "intensified_bending",
            "intensified_bending_maximum",
            "toroidal_intrados_hoop_stress",
            "toroidal_crown_hoop_stress",
            "toroidal_extrados_hoop_stress",
            "toroidal_inner_radial_stress",
            "toroidal_outer_radial_stress"
          ]
        },
        "coordinate_system": {
          "type": "string",
          "enum": [
            "global",
            "element_local",
            "pipe_section",
            "TBD"
          ]
        },
        "location": {
          "type": "string",
          "enum": [
            "end_i",
            "end_j",
            "node",
            "quarter_1",
            "midspan",
            "quarter_3",
            "summary",
            "TBD",
            "governing_station"
          ]
        },
        "basis": {
          "type": "string",
          "enum": [
            "recovered_from_local_element_stiffness",
            "assembled_solver_load_vector",
            "solved_from_global_linear_system",
            "recovered_from_open_mechanics_stress_components",
            "interpolated_from_endpoint_resultants",
            "derived_from_user_entered_section_geometry",
            "explicit_user_linear_combination",
            "explicit_user_result_state_subtraction",
            "explicit_user_range_envelope",
            "stress_recovery_summary",
            "rule_pack_evaluation",
            "TBD",
            "recovered_from_assembled_support_law",
            "recovered_from_local_element_stiffness; section_basis=nominal_section",
            "recovered_from_local_element_stiffness; section_basis=reduced_section",
            "recovered_from_open_mechanics_stress_components; section_basis=nominal_section",
            "recovered_from_open_mechanics_stress_components; section_basis=reduced_section",
            "section_extremes_from_published_stress_rows_v1",
            "saint_venant_annulus_flexure_v1",
            "local_straight_annulus_on_arc",
            "user_directional_sif_times_tangent_frame_bending_stress_v1",
            "section_extremes_from_published_stress_rows_v1; section_basis=nominal_section",
            "section_extremes_from_published_stress_rows_v1; section_basis=reduced_section",
            "saint_venant_annulus_flexure_v1; section_basis=nominal_section",
            "saint_venant_annulus_flexure_v1; section_basis=reduced_section",
            "local_straight_annulus_on_arc; section_basis=nominal_section",
            "local_straight_annulus_on_arc; section_basis=reduced_section",
            "user_directional_sif_times_tangent_frame_bending_stress_v1; section_basis=nominal_section",
            "user_directional_sif_times_tangent_frame_bending_stress_v1; section_basis=reduced_section",
            "bore_load_transferred_toroidal_membrane_v1; section_basis=nominal_section",
            "bore_load_transferred_toroidal_membrane_v1; section_basis=reduced_section",
            "rotated_from_published_element_local_end_actions_v1",
            "rotated_from_published_element_local_end_actions_v1;axial_is_pipe_wall_action"
          ]
        },
        "sign_convention": {
          "type": "string",
          "minLength": 1
        }
      }
    },
    "Reference": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "ref_type",
        "ref_id"
      ],
      "properties": {
        "ref_type": {
          "type": "string",
          "minLength": 1
        },
        "ref_id": {
          "$ref": "#/$defs/Id"
        },
        "display_name": {
          "type": "string"
        }
      }
    },
    "Reproducibility": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "model_hash",
        "run_hashes",
        "audit_manifest_ref",
        "deterministic_ordering",
        "raw_source_hashes",
        "derivative_hash",
        "derivative_hash_excludes",
        "source_origin_bindings",
        "request_hash"
      ],
      "properties": {
        "model_hash": {
          "$ref": "#/$defs/ScopedChecksum"
        },
        "run_hashes": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/Checksum"
          }
        },
        "audit_manifest_ref": {
          "$ref": "#/$defs/Reference"
        },
        "deterministic_ordering": {
          "const": true
        },
        "raw_source_hashes": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/ScopedChecksum"
          }
        },
        "derivative_hash": {
          "$ref": "#/$defs/ScopedChecksum"
        },
        "derivative_hash_excludes": {
          "const": "result_envelope.reproducibility.derivative_hash"
        },
        "source_origin_bindings": {
          "type": "array",
          "minItems": 1,
          "items": {
            "$ref": "#/$defs/SourceOriginBinding"
          }
        },
        "request_hash": {
          "anyOf": [
            {
              "$ref": "#/$defs/ScopedChecksum"
            },
            {
              "type": "null"
            }
          ]
        }
      }
    },
    "ResultEnvelope": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "schema_version",
        "envelope_id",
        "model_ref",
        "run_ref",
        "solver_version",
        "unit_system_ref",
        "load_basis_refs",
        "result_sets",
        "diagnostics",
        "provenance",
        "reproducibility",
        "analysis_status",
        "professional_boundary",
        "downstream_use",
        "review_evidence",
        "row_disclosures",
        "row_accounting",
        "source_annotations",
        "producer",
        "semantic_contract_ref",
        "formulation_basis",
        "numerical_quality"
      ],
      "properties": {
        "schema_version": {
          "const": "0.3.0"
        },
        "envelope_id": {
          "$ref": "#/$defs/Id"
        },
        "model_ref": {
          "$ref": "#/$defs/Reference"
        },
        "run_ref": {
          "$ref": "#/$defs/Reference"
        },
        "solver_version": {
          "$ref": "#/$defs/SolverVersion"
        },
        "unit_system_ref": {
          "$ref": "#/$defs/Reference"
        },
        "load_basis_refs": {
          "type": "array",
          "minItems": 1,
          "items": {
            "$ref": "#/$defs/Reference"
          }
        },
        "result_sets": {
          "type": "array",
          "minItems": 1,
          "items": {
            "anyOf": [
              {
                "$ref": "#/$defs/ResultSet"
              },
              {
                "$ref": "#/$defs/PhysicsSourceResultSet"
              },
              {
                "$ref": "#/$defs/PreviewPhysicsResultSet"
              },
              {
                "$ref": "results_pressure_2.v0.3.schema.json#/$defs/PressureResultSet"
              }
            ]
          }
        },
        "unit_witness_policy": {
