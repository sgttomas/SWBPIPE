    "PhysicsGeometry": {
      "type": "object",
      "additionalProperties": false,
      "description": "D-5 section bases (DEL-05-03 Design section-bases-and-timoshenko.md section 2.3): the authored OD, nominal wall, mill tolerance and corrosion allowance; the nominal section (stiffness, metal mass, nominal stress family), the reduced section (wall minus mill tolerance and corrosion allowance; reduced stress family), the pressure bore of the reduced wall, and the member's shear model. A realized arc's entry, and only an arc's, carries member_kind = realized_arc (section 2.5) and is Euler-Bernoulli under either contract. The readers rederive the walls, radii and the Timoshenko factor; the leaves are prepared values.",
      "required": [
        "pipe_id",
        "geometry_basis",
        "outside_diameter_m",
        "ro_m",
        "wall_thickness_m",
        "mill_tolerance_m",
        "corrosion_allowance_m",
        "nominal_section",
        "reduced_section",
        "pressure_bore",
        "beam_theory"
      ],
      "properties": {
        "pipe_id": {
          "type": "string",
          "minLength": 1
        },
        "geometry_basis": {
          "const": "authored_od_wall_d5_sections_v1"
        },
        "outside_diameter_m": {
          "type": "number",
          "exclusiveMinimum": 0
        },
        "ro_m": {
          "type": "number",
          "exclusiveMinimum": 0
        },
        "wall_thickness_m": {
          "type": "number",
          "exclusiveMinimum": 0
        },
        "mill_tolerance_m": {
          "type": "number",
          "minimum": 0
        },
        "corrosion_allowance_m": {
          "type": "number",
          "minimum": 0
        },
        "nominal_section": {
          "$ref": "#/$defs/PhysicsSectionAnnulus"
        },
        "reduced_section": {
          "$ref": "#/$defs/PhysicsSectionAnnulus"
        },
        "pressure_bore": {
          "$ref": "#/$defs/PhysicsPressureBore"
        },
        "beam_theory": {
          "$ref": "#/$defs/PhysicsBeamTheory"
        },
        "member_kind": {
          "const": "realized_arc"
        }
      },
      "if": {
        "required": [
          "member_kind"
        ]
      },
      "then": {
        "properties": {
          "beam_theory": {
            "const": {
              "model": "euler_bernoulli"
            }
          }
        }
      }
    },
    "PhysicsSectionAnnulus": {
      "type": "object",
      "additionalProperties": false,
      "description": "One section basis's annulus: wall, inner radius and the prepared area, second moment, polar moment and section modulus leaves.",
      "required": [
