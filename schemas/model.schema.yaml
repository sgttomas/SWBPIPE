{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://openpipestress.org/schemas/model.schema.yaml",
  "title": "OpenPipeStress Canonical Domain Model Schema",
  "description": "Code-neutral canonical project/model schema for OpenPipeStress. It describes public structure only; code-specific, proprietary, protected, or project-private engineering values are user-supplied and provenance-marked.",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema_version",
    "project"
  ],
  "properties": {
    "schema_version": {
      "type": "string",
      "pattern": "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    },
    "project": {
      "$ref": "#/$defs/Project"
    }
  },
  "$defs": {
    "AnalysisStatus": {
      "type": "string",
      "enum": [
        "MODEL_INCOMPLETE",
        "MECHANICS_SOLVED",
        "RULE_INPUTS_INCOMPLETE",
        "USER_RULE_CHECKED",
        "USER_RULE_FAILED",
        "HUMAN_REVIEW_REQUIRED",
        "HUMAN_APPROVED_FOR_PROJECT"
      ]
    },
    "Assumption": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "id",
        "statement",
        "status",
        "affected_refs",
        "provenance"
      ],
      "properties": {
        "id": {
          "$ref": "#/$defs/Id"
        },
        "statement": {
          "type": "string",
          "minLength": 1
        },
        "status": {
          "type": "string",
          "enum": [
            "unresolved",
            "resolved",
            "rejected",
            "TBD"
          ]
        },
        "affected_refs": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/Reference"
          }
        },
        "resolution_note": {
          "type": "string"
        },
        "provenance": {
          "$ref": "#/$defs/Provenance"
        }
      }
    },
    "Axis": {
      "type": "string",
      "enum": [
        "X",
        "Y",
        "Z",
        "UX",
        "UY",
        "UZ",
        "RX",
        "RY",
        "RZ"
      ]
    },
    "Checksum": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "algorithm",
        "canonicalization",
        "payload_ref",
        "value"
      ],
      "properties": {
        "algorithm": {
          "type": "string",
          "enum": [
            "sha256",
            "sha512",
            "TBD"
          ]
        },
        "canonicalization": {
          "type": "string",
          "enum": [
            "SORTED_COMPACT_JSON",
            "JCS",
            "NONE",
            "TBD"
          ]
        },
        "payload_ref": {
          "$ref": "#/$defs/Reference"
        },
        "value": {
          "type": "string",
          "minLength": 1
        }
      }
    },
    "Combination": {
      "type": "object",
      "additionalProperties": false,
      "allOf": [
        {
          "if": {
            "required": [
              "basis"
            ],
            "properties": {
              "basis": {
                "enum": [
                  "mechanics",
                  "user_rule_pack",
                  "owner_design_basis",
                  "TBD"
                ]
              }
            }
          },
          "then": {
            "required": [
              "terms"
            ]
          }
        },
        {
          "if": {
            "required": [
              "basis"
            ],
            "properties": {
              "basis": {
                "const": "result_state_subtraction"
              }
            }
          },
          "then": {
            "required": [
              "minuend_ref",
              "subtrahend_ref"
            ]
          }
        },
        {
          "if": {
            "required": [
              "basis"
            ],
            "properties": {
              "basis": {
                "const": "range_envelope"
              }
            }
          },
          "then": {
            "required": [
              "operand_refs",
              "mode"
            ]
          }
        }
      ],
      "required": [
        "id",
        "name",
        "basis",
        "provenance"
      ],
      "properties": {
        "id": {
          "$ref": "#/$defs/Id"
        },
        "name": {
          "type": "string",
          "minLength": 1
        },
        "description": {
          "type": "string"
        },
        "basis": {
          "type": "string",
          "enum": [
            "mechanics",
            "user_rule_pack",
            "owner_design_basis",
            "result_state_subtraction",
            "range_envelope",
            "TBD"
          ]
        },
        "terms": {
          "type": "array",
          "minItems": 1,
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "load_case_ref",
              "factor"
            ],
            "properties": {
              "load_case_ref": {
                "$ref": "#/$defs/Reference"
              },
              "factor": {
                "type": "number"
              }
            }
          }
        },
        "minuend_ref": {
          "$ref": "#/$defs/Reference"
        },
        "subtrahend_ref": {
          "$ref": "#/$defs/Reference"
        },
        "operand_refs": {
          "type": "array",
          "minItems": 1,
          "items": {
            "$ref": "#/$defs/Reference"
          }
        },
        "mode": {
          "type": "string",
          "enum": [
            "min",
            "max",
            "min_abs",
            "max_abs",
            "TBD"
          ]
        },
        "modulus_basis_records": {
          "description": "Explicit record of the modulus basis each range term solved with. Expansion-range combinations record, per operand load case, the exact user-entered temperature-point basis, the DEC-077 interpolated solve-temperature basis with source-point/method provenance, or the reserved label material_base_values. Records are declarations of the solved basis, not selectors.",
          "type": "array",
          "minItems": 1,
          "items": {
            "$ref": "#/$defs/ModulusBasisRecord"
          }
        },
        "provenance": {
          "$ref": "#/$defs/Provenance"
        }
      }
    },
    "ModulusBasisRecord": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "load_case_ref",
        "modulus_basis_ref"
      ],
      "properties": {
        "load_case_ref": {
          "$ref": "#/$defs/Reference"
        },
        "modulus_basis_ref": {
          "description": "User-assigned temperature-point basis id, or the reserved label material_base_values when the operand solved on the material base values.",
          "type": "string",
          "minLength": 1
        }
      }
    },
    "Component": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "id",
        "component_type",
        "geometry",
        "mechanics_modifiers",
        "provenance"
      ],
      "properties": {
        "id": {
          "$ref": "#/$defs/Id"
        },
        "component_type": {
          "type": "string",
          "enum": [
            "bend",
            "elbow",
            "branch",
            "reducer",
            "valve",
            "flange",
            "expansion_joint",
            "rigid",
            "specialty",
            "other",
            "TBD"
          ]
        },
        "name": {
          "type": "string"
        },
        "geometry": {
          "type": "object",
          "additionalProperties": {
            "$ref": "#/$defs/Quantity"
          }
        },
        "mechanics_modifiers": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/UserSuppliedValue"
          }
        },
        "provenance": {
          "$ref": "#/$defs/Provenance"
        }
      }
    },
    "CoordinateSystem": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "type",
        "axes"
      ],
      "properties": {
        "type": {
          "type": "string",
          "enum": [
            "cartesian",
            "TBD"
          ]
        },
        "axes": {
          "type": "array",
          "minItems": 3,
          "maxItems": 3,
          "items": {
            "$ref": "#/$defs/Axis"
          }
        },
        "y_reference": {
          "$ref": "#/$defs/DirectionVector"
        },
        "provenance": {
          "$ref": "#/$defs/Provenance"
        }
      }
    },
    "Diagnostic": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "code",
        "class",
        "severity",
        "source",
        "affected_object",
        "message",
        "remediation",
        "provenance"
      ],
      "properties": {
        "code": {
          "type": "string",
          "minLength": 1
        },
        "class": {
          "type": "string",
          "enum": [
            "SOLVE_BLOCKING",
            "RULE_CHECK_BLOCKING",
            "PROVENANCE_WARNING",
            "ASSUMPTION_WARNING",
            "NONLINEAR_WARNING",
            "IP_BOUNDARY_WARNING"
          ]
        },
        "severity": {
          "type": "string",
          "enum": [
            "info",
            "warning",
            "error",
            "blocking"
          ]
        },
        "source": {
          "type": "string",
          "minLength": 1
        },
        "affected_object": {
          "$ref": "#/$defs/Reference"
        },
        "message": {
          "type": "string",
          "minLength": 1
        },
        "remediation": {
          "type": "string"
        },
        "provenance": {
          "$ref": "#/$defs/Provenance"
        }
      }
    },
    "Element": {
      "type": "object",
      "additionalProperties": false,
      "allOf": [
        {
          "if": {
            "required": [
              "element_type"
            ],
            "properties": {
              "element_type": {
                "const": "straight_pipe"
              }
            }
          },
          "then": {
            "properties": {
              "local_coordinate_system": {
                "required": [
                  "y_reference"
                ]
              }
            }
          }
        }
      ],
      "required": [
        "id",
        "element_type",
        "start_node_ref",
        "end_node_ref",
        "material_ref",
        "section_ref",
        "local_coordinate_system",
        "result_stations"
      ],
      "properties": {
        "id": {
          "$ref": "#/$defs/Id"
        },
        "element_type": {
          "type": "string",
          "enum": [
            "straight_pipe",
            "frame",
            "rigid",
            "component_link",
            "TBD"
          ]
        },
        "start_node_ref": {
          "$ref": "#/$defs/Reference"
        },
        "end_node_ref": {
          "$ref": "#/$defs/Reference"
        },
        "material_ref": {
          "$ref": "#/$defs/Reference"
        },
        "section_ref": {
          "$ref": "#/$defs/Reference"
        },
        "component_ref": {
          "$ref": "#/$defs/Reference"
        },
        "local_coordinate_system": {
          "$ref": "#/$defs/CoordinateSystem"
        },
        "result_stations": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/Quantity"
          }
        }
      }
    },
    "Id": {
      "type": "string",
      "pattern": "^[A-Za-z][A-Za-z0-9_.:-]*$"
    },
    "DirectionVector": {
      "type": "array",
      "minItems": 3,
      "maxItems": 3,
      "items": {
        "type": "number"
      }
    },
    "LoadCase": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "id",
        "name",
        "load_type",
        "loads",
        "provenance"
      ],
      "allOf": [
        {
          "not": {
            "required": [
              "modulus_basis_ref",
              "modulus_basis_temperature"
            ]
          }
        }
      ],
      "properties": {
        "id": {
          "$ref": "#/$defs/Id"
        },
        "name": {
          "type": "string",
          "minLength": 1
        },
        "load_type": {
          "type": "string",
          "enum": [
            "weight",
            "pressure",
            "temperature",
            "imposed_displacement",
            "hydrotest",
            "wind",
            "seismic",
            "user_occasional",
            "other",
            "TBD"
          ]
        },
        "loads": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/LoadRecord"
          }
        },
        "equivalent_static_generation": {
          "$ref": "#/$defs/EquivalentStaticGeneration"
        },
        "modulus_basis_ref": {
          "description": "Optional exact modulus basis: the user-assigned temperature-point id whose user-entered elastic modulus and, when present, thermal expansion coefficient this load case solves with. Exact-id selection remains unchanged under DEC-077. This field is mutually exclusive with modulus_basis_temperature.",
          "$ref": "#/$defs/Id"
        },
        "modulus_basis_temperature": {
          "description": "Optional user-entered absolute solve temperature for DEC-077 linear interpolation of elastic modulus and thermal expansion coefficient between two adjacent user-entered material temperature points. Requests at or beyond stored range edges block; extrapolation and base-value substitution are not performed. This field is mutually exclusive with modulus_basis_ref.",
          "$ref": "#/$defs/QuantityValue"
        },
        "provenance": {
          "$ref": "#/$defs/Provenance"
        }
      }
    },
    "EquivalentStaticGeneration": {
      "description": "User-entered static-equivalent occasional-load generation inputs. Seismic: per-global-axis g-factors and an explicit user-entered gravity acceleration multiply the model's own computed mass distribution. Wind: user-entered pressure and shape parameters project onto the exposed diameter of user-marked spans. No code coefficient, catalog value, or default is encoded; missing inputs are blocking diagnostics.",
      "type": "object",
      "additionalProperties": false,
      "required": [
        "provenance"
      ],
      "properties": {
        "seismic": {
          "$ref": "#/$defs/SeismicEquivalentStaticInput"
        },
        "wind": {
          "$ref": "#/$defs/WindEquivalentStaticInput"
        },
        "provenance": {
          "$ref": "#/$defs/Provenance"
        }
      }
    },
    "SeismicEquivalentStaticInput": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "gravity_acceleration",
        "g_factors"
      ],
      "properties": {
        "gravity_acceleration": {
          "$ref": "#/$defs/AccelerationQuantity"
        },
        "g_factors": {
          "type": "object",
          "additionalProperties": false,
          "minProperties": 1,
          "properties": {
            "x": {
              "$ref": "#/$defs/DimensionlessQuantity"
            },
            "y": {
              "$ref": "#/$defs/DimensionlessQuantity"
            },
            "z": {
              "$ref": "#/$defs/DimensionlessQuantity"
            }
          }
        }
      }
    },
    "WindEquivalentStaticInput": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "pressure",
        "shape_factor",
        "direction"
      ],
      "anyOf": [
        {
          "required": [
            "exposed_element_refs"
          ]
        },
        {
          "required": [
            "exposed_spans"
          ]
        }
      ],
      "properties": {
        "pressure": {
          "$ref": "#/$defs/PressureQuantity"
        },
        "shape_factor": {
          "$ref": "#/$defs/DimensionlessQuantity"
        },
        "direction": {
          "$ref": "#/$defs/ForceDirection"
        },
        "exposed_element_refs": {
          "type": "array",
          "minItems": 1,
          "items": {
            "$ref": "#/$defs/ElementReference"
          }
        },
        "exposed_spans": {
          "type": "array",
          "minItems": 1,
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "element_ref",
              "extent"
            ],
            "properties": {
              "element_ref": {
                "$ref": "#/$defs/ElementReference"
              },
              "extent": {
                "$ref": "#/$defs/ElementLoadSpan"
              }
            }
          }
        }
      }
    },
    "LoadRecord": {
      "oneOf": [
        {
          "$ref": "#/$defs/NodalForceLoadRecord"
        },
        {
          "$ref": "#/$defs/NodalMomentLoadRecord"
        },
        {
          "$ref": "#/$defs/ElementPointForceLoadRecord"
        },
        {
          "$ref": "#/$defs/ElementUniformDistributedForceLoadRecord"
        }
      ]
    },
    "NodalForceLoadRecord": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "load_record_type",
        "target_ref",
        "direction",
        "quantity",
        "provenance"
      ],
      "properties": {
        "load_record_type": {
          "const": "nodal_force"
        },
        "target_ref": {
          "$ref": "#/$defs/NodeReference"
        },
        "direction": {
          "$ref": "#/$defs/ForceDirection"
        },
        "quantity": {
          "$ref": "#/$defs/ForceQuantity"
        },
        "provenance": {
          "$ref": "#/$defs/Provenance"
        }
      }
    },
    "NodalMomentLoadRecord": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "load_record_type",
        "target_ref",
        "direction",
        "quantity",
        "provenance"
      ],
      "properties": {
        "load_record_type": {
          "const": "nodal_moment"
        },
        "target_ref": {
          "$ref": "#/$defs/NodeReference"
        },
        "direction": {
          "$ref": "#/$defs/MomentDirection"
        },
        "quantity": {
          "$ref": "#/$defs/MomentQuantity"
        },
        "provenance": {
          "$ref": "#/$defs/Provenance"
        }
      }
    },
    "ElementPointForceLoadRecord": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "load_record_type",
        "target_ref",
        "station_fraction",
        "direction",
        "quantity",
        "provenance"
      ],
      "properties": {
        "load_record_type": {
          "const": "element_point_force"
        },
        "target_ref": {
          "$ref": "#/$defs/ElementReference"
        },
        "station_fraction": {
          "$ref": "#/$defs/FractionQuantity"
        },
        "direction": {
          "$ref": "#/$defs/ForceDirection"
        },
        "quantity": {
          "$ref": "#/$defs/ForceQuantity"
        },
        "provenance": {
          "$ref": "#/$defs/Provenance"
        }
      }
    },
    "ElementUniformDistributedForceLoadRecord": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "load_record_type",
        "target_ref",
        "span",
        "direction",
        "quantity",
        "provenance"
      ],
      "properties": {
        "load_record_type": {
          "const": "element_uniform_distributed_force"
        },
        "target_ref": {
          "$ref": "#/$defs/ElementReference"
        },
        "span": {
          "$ref": "#/$defs/ElementLoadSpan"
        },
        "direction": {
          "$ref": "#/$defs/ForceDirection"
        },
        "quantity": {
          "$ref": "#/$defs/ForcePerLengthQuantity"
        },
        "provenance": {
          "$ref": "#/$defs/Provenance"
        }
      }
    },
    "NodeReference": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "object_type",
        "id"
      ],
      "properties": {
        "object_type": {
          "const": "Node"
        },
        "id": {
          "$ref": "#/$defs/Id"
        }
      }
    },
    "ElementReference": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "object_type",
        "id"
      ],
      "properties": {
        "object_type": {
          "const": "Element"
        },
        "id": {
          "$ref": "#/$defs/Id"
        }
      }
    },
    "ForceDirection": {
      "type": "string",
      "enum": [
        "X",
        "Y",
        "Z"
      ]
    },
    "MomentDirection": {
      "type": "string",
      "enum": [
        "RX",
        "RY",
        "RZ"
      ]
    },
    "ForceQuantity": {
      "allOf": [
        {
          "$ref": "#/$defs/Quantity"
        },
        {
          "properties": {
            "dimension": {
              "const": "force"
            }
          }
        }
      ]
    },
    "MomentQuantity": {
      "allOf": [
        {
          "$ref": "#/$defs/Quantity"
        },
        {
          "properties": {
            "dimension": {
              "const": "moment"
            }
          }
        }
      ]
    },
    "ForcePerLengthQuantity": {
      "allOf": [
        {
          "$ref": "#/$defs/Quantity"
        },
        {
          "properties": {
            "dimension": {
              "const": "force_per_length"
            }
          }
        }
      ]
    },
    "AccelerationQuantity": {
      "allOf": [
        {
          "$ref": "#/$defs/Quantity"
        },
        {
          "properties": {
            "dimension": {
              "const": "acceleration"
            }
          }
        }
      ]
    },
    "PressureQuantity": {
      "allOf": [
        {
          "$ref": "#/$defs/Quantity"
        },
        {
          "properties": {
            "dimension": {
              "const": "pressure"
            }
          }
        }
      ]
    },
    "DimensionlessQuantity": {
      "allOf": [
        {
          "$ref": "#/$defs/Quantity"
        },
        {
          "properties": {
            "dimension": {
              "const": "dimensionless"
            }
          }
        }
      ]
    },
    "FractionQuantity": {
      "allOf": [
        {
          "$ref": "#/$defs/Quantity"
        },
        {
          "properties": {
            "value": {
              "minimum": 0,
              "maximum": 1
            },
            "dimension": {
              "const": "dimensionless"
            }
          }
        }
      ]
    },
    "ElementLoadSpan": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "start_fraction",
        "end_fraction"
      ],
      "properties": {
        "start_fraction": {
          "$ref": "#/$defs/FractionQuantity"
        },
        "end_fraction": {
          "$ref": "#/$defs/FractionQuantity"
        }
      }
    },
    "Material": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "id",
        "name",
        "properties",
        "provenance"
      ],
      "properties": {
        "id": {
          "$ref": "#/$defs/Id"
        },
        "name": {
          "type": "string",
          "minLength": 1
        },
        "properties": {
          "type": "object",
          "additionalProperties": {
            "$ref": "#/$defs/Quantity"
          }
        },
        "user_supplied_values": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/UserSuppliedValue"
          }
        },
        "provenance": {
          "$ref": "#/$defs/Provenance"
        }
      }
    },
    "Model": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "id",
        "name",
        "model_role",
        "coordinate_system",
        "nodes",
        "elements",
        "components",
        "materials",
        "sections",
        "supports",
        "load_cases",
        "combinations",
        "results",
        "diagnostics",
        "unresolved_assumptions",
        "traceability_links",
        "design_knowledge_refs",
        "constraint_refs",
