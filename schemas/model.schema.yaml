{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://openpipestress.org/schemas/model.schema.yaml",
  "title": "OpenPipeStress model document",
  "description": "The model document openpipestress.product_preview.model, version 0.8.0: the document the desktop opens, edits and saves and the solver reads. Coordinates, directions and orientation vectors are in one implicit global right-handed Cartesian frame (axes X, Y, Z; length unit project.units.length); the document declares no other coordinate system. The schema describes structure only: physical validity, unit admission and cross-references are the readers' and the applier's, which report named diagnostics. Every member a reader decodes or a writer emits is described, and every record is closed. The load/reference-state group (reference_configurations, material expansion_laws, load-case analysis_state) is defined in load_reference_state.schema.json. $defs/DesktopDocument is the desktop's open and save profile. The annotation and record slots (tags, notes, lines, unresolved_assumptions, rule_pack_refs, provenance_record, constraints, equipment_interfaces) are optional model data that no solve reads; absence means none, and nothing evaluates lines, constraints or equipment interfaces. Values are user-entered; the software supplies no code value and no acceptance.",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema_version",
    "document_kind",
    "project",
    "analysis_status",
    "nodes",
    "pipe_segments",
    "supports"
  ],
  "properties": {
    "schema_version": {
      "description": "Model document 0.8.0 is the one current version: 0.7.0 plus a reducer's optional geometry.eccentric_offset. Versions 0.1.0 to 0.7.0 are retired and refused by name with a re-author diagnostic; nothing is migrated.",
      "type": "string",
      "enum": [
        "0.8.0"
      ]
    },
    "document_kind": {
      "type": "string",
      "const": "openpipestress.product_preview.model"
    },
    "pressure_contract": {
      "$ref": "#/$defs/PressureContract"
    },
    "data_boundary": {
      "$ref": "#/$defs/DataBoundary"
    },
    "project": {
      "$ref": "#/$defs/Project"
    },
    "analysis_status": {
      "$ref": "#/$defs/AnalysisStatus"
    },
    "materials": {
      "type": "array",
      "items": {
        "$ref": "#/$defs/Material"
      }
    },
    "sections": {
      "type": "array",
      "items": {
        "$ref": "#/$defs/Section"
      }
    },
    "nodes": {
      "type": "array",
      "items": {
        "$ref": "#/$defs/Node"
      }
    },
    "pipe_segments": {
      "type": "array",
      "items": {
        "$ref": "#/$defs/PipeSegment"
      }
    },
    "supports": {
      "type": "array",
      "items": {
        "$ref": "#/$defs/Support"
      }
    },
    "components": {
      "type": "array",
      "items": {
        "$ref": "#/$defs/Component"
      }
    },
    "load_cases": {
      "type": "array",
      "items": {
        "$ref": "#/$defs/LoadCase"
      }
    },
    "combinations": {
      "type": "array",
      "items": {
        "$ref": "#/$defs/Combination"
      }
    },
    "diagnostics": {
      "type": "array",
      "items": {
        "$ref": "#/$defs/Diagnostic"
      }
    },
    "reference_configurations": {
      "description": "Load/reference-state group: model-level reference configurations.",
      "type": "array",
      "items": {
        "$ref": "load_reference_state.schema.json#/$defs/ReferenceConfiguration"
      }
    },
    "lines": {
      "description": "Typed lines grouping pipe segments (FR-MOD-002); grouping only, the solve does not read them.",
      "type": "array",
      "items": {
        "$ref": "#/$defs/Line"
      }
    },
    "unresolved_assumptions": {
      "description": "Unresolved assumptions and open issues (FR-MOD-006), in model_state.schema.json AssumptionRecord's vocabulary.",
      "type": "array",
      "items": {
        "$ref": "#/$defs/UnresolvedAssumption"
      }
    },
    "rule_pack_refs": {
      "description": "Rule packs used with this model, by identity and stamped checksum only; rule content never enters the document. A reference never makes a check pass.",
      "type": "array",
      "items": {
        "$ref": "#/$defs/RulePackRef"
      }
    },
    "constraints": {
      "description": "Typed constraint records (FR-MOD-002) in ConstraintRecord's vocabulary. Data only: nothing checks them (design-knowledge evaluation is deferred, OD-1).",
      "type": "array",
      "items": {
        "$ref": "#/$defs/Constraint"
      }
    },
    "equipment_interfaces": {
      "description": "Typed equipment-interface records (FR-MOD-002). Data only: nothing checks them.",
      "type": "array",
      "items": {
        "$ref": "#/$defs/EquipmentInterface"
      }
    },
    "model_settings": {
      "$ref": "#/$defs/ModelSettings"
    }
  },
  "$defs": {
    "AnalysisStatus": {
      "description": "Authored status strings carried by the document. They are labels, not results: the solve publishes its own status, and professional acceptance is never derived by the software.",
      "type": "object",
      "additionalProperties": false,
      "required": [
        "mechanics",
        "rule_check",
        "professional_acceptance"
      ],
      "properties": {
        "mechanics": {
          "type": "string"
        },
        "rule_check": {
          "type": "string"
        },
        "professional_acceptance": {
          "type": "string"
        }
      }
    },
    "BoundaryAssociation": {
      "description": "Desktop and applier equipment-boundary grouping of supports; the solver ignores it. nozzle_reference is present exactly for equipment_nozzle.",
      "type": "object",
      "additionalProperties": false,
      "required": [
        "boundary_id",
        "kind",
        "equipment_reference",
        "coordinate_system"
      ],
      "properties": {
        "boundary_id": {
          "type": "string",
          "minLength": 1
        },
        "kind": {
          "type": "string",
          "enum": [
            "equipment",
            "equipment_nozzle"
          ]
        },
        "equipment_reference": {
          "type": "string",
          "minLength": 1
        },
        "nozzle_reference": {
          "type": "string",
          "minLength": 1
        },
        "coordinate_system": {
          "type": "string",
          "const": "global"
        }
      }
    },
    "Combination": {
      "description": "mechanics combines terms linearly; result_state_subtraction is minuend minus subtrahend; range_envelope applies mode over operand_ids.",
      "type": "object",
      "additionalProperties": false,
      "required": [
        "id",
        "basis"
      ],
      "properties": {
        "id": {
          "$ref": "#/$defs/Id"
        },
        "label": {
          "type": "string"
        },
        "basis": {
          "type": "string",
          "enum": [
            "mechanics",
            "result_state_subtraction",
            "range_envelope"
          ]
        },
        "terms": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/CombinationTerm"
          }
        },
        "minuend_id": {
          "$ref": "#/$defs/Id"
        },
        "subtrahend_id": {
          "$ref": "#/$defs/Id"
        },
        "operand_ids": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/Id"
          }
        },
        "mode": {
          "type": "string",
          "enum": [
            "min",
            "max",
            "min_abs",
            "max_abs"
          ]
        },
        "provenance": {
          "type": "string"
        },
        "tags": {
          "$ref": "#/$defs/Tags"
        },
        "notes": {
          "$ref": "#/$defs/Notes"
        }
      }
    },
    "CombinationTerm": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "load_case",
        "factor"
      ],
      "properties": {
        "load_case": {
          "$ref": "#/$defs/Id"
        },
        "factor": {
          "type": "number"
        }
      }
    },
    "Component": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "id",
        "kind",
        "node"
      ],
      "properties": {
        "id": {
          "$ref": "#/$defs/Id"
        },
        "label": {
          "type": "string"
        },
        "kind": {
          "$ref": "#/$defs/ComponentKind"
        },
        "node": {
          "$ref": "#/$defs/Id"
        },
        "geometry": {
          "$ref": "#/$defs/ComponentGeometry"
        },
        "modifiers": {
          "$ref": "#/$defs/ComponentModifiers"
        },
        "mechanics_interface": {
          "$ref": "#/$defs/ComponentMechanicsInterface"
        },
        "objective_connector": {
          "$ref": "#/$defs/ObjectiveConnector"
        },
        "completeness": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/ComponentCompletenessFinding"
          }
        },
        "provenance": {
          "type": "string"
        },
        "tags": {
          "$ref": "#/$defs/Tags"
        },
        "notes": {
          "$ref": "#/$defs/Notes"
        },
        "provenance_record": {
          "$ref": "#/$defs/ProvenanceRecord"
        }
      }
    },
    "ComponentCompletenessFinding": {
      "description": "Desktop component-completeness finding carried with the component; the solver ignores it.",
      "type": "object",
      "additionalProperties": false,
      "required": [
        "status",
        "diagnostic_code"
      ],
      "properties": {
        "finding_id": {
          "type": "string"
        },
        "status": {
          "type": "string"
        },
        "diagnostic_code": {
          "type": "string"
        },
        "missing_field_kinds": {
          "type": "array",
          "items": {
            "type": "string"
          }
        }
      }
    },
    "ComponentGeometry": {
      "description": "User-entered component geometry. Every member is optional and never defaulted.",
      "type": "object",
      "additionalProperties": false,
      "required": [],
      "properties": {
        "bend_pipe_ref": {
          "$ref": "#/$defs/Id"
        },
        "bend_radius": {
          "$ref": "#/$defs/Quantity"
        },
        "bend_angle": {
          "$ref": "#/$defs/Quantity"
        },
        "bend_plane_orientation": {
          "type": "string"
        },
        "bend_geometry_source_reference": {
          "type": "string"
        },
        "branch_header_pipe_ref": {
          "$ref": "#/$defs/Id"
        },
        "branch_branch_pipe_ref": {
          "$ref": "#/$defs/Id"
        },
        "branch_run_size": {
          "$ref": "#/$defs/Quantity"
        },
        "branch_header_size": {
          "$ref": "#/$defs/Quantity"
        },
        "branch_connection_angle": {
          "$ref": "#/$defs/Quantity"
        },
        "branch_connection_type": {
          "type": "string"
        },
        "branch_reinforcement_area": {
          "$ref": "#/$defs/Quantity"
        },
        "branch_reinforcement_reference": {
          "type": "string"
        },
        "branch_geometry_source_reference": {
          "type": "string"
        },
        "rigid_pipe_ref": {
          "$ref": "#/$defs/Id"
        },
        "rigid_body_length": {
          "$ref": "#/$defs/Quantity"
        },
        "end_a_size": {
          "$ref": "#/$defs/Quantity"
        },
        "end_b_size": {
          "$ref": "#/$defs/Quantity"
        },
        "weight": {
          "$ref": "#/$defs/Quantity"
        },
        "center_of_gravity": {
          "$ref": "#/$defs/VectorQuantity"
        },
        "connection_end_a_reference": {
          "type": "string"
        },
        "connection_end_b_reference": {
          "type": "string"
        },
        "stiffness_behavior_reference": {
          "type": "string"
        },
        "rigid_component_source_reference": {
          "type": "string"
        },
        "expansion_joint_pipe_ref": {
          "$ref": "#/$defs/Id"
        },
        "effective_area": {
          "$ref": "#/$defs/Quantity"
        },
        "movement_limit": {
          "$ref": "#/$defs/Quantity"
        },
        "hardware_reference": {
          "type": "string"
        },
        "manufacturer_reference": {
          "type": "string"
        },
        "pressure_thrust_reference": {
          "type": "string"
        },
        "expansion_joint_source_reference": {
          "type": "string"
        },
        "eccentric_offset": {
          "description": "A reducer's declared eccentric offset (model document 0.8.0; owner ruling R-c1 A): a vector in the global X/Y/Z axes, from the centreline at the component's node to the centreline at its body's other end, in a model length unit. The node geometry governs; the solve checks the declared offset against it and never places nodes from it. Read only on a reducer.",
          "$ref": "#/$defs/VectorQuantity"
        }
      }
    },
    "ComponentKind": {
      "description": "Component families the readers and writers name: bend/elbow, branch/tee/branch_connection, the rigid families (valve, flange, reducer, rigid, specialty), expansion_joint, and terminal (a marker the bundled demo writes; no solver contribution).",
      "type": "string",
      "enum": [
        "bend",
        "elbow",
        "branch",
        "tee",
        "branch_connection",
        "reducer",
        "valve",
        "flange",
        "rigid",
        "specialty",
        "expansion_joint",
        "terminal"
      ]
    },
    "ComponentMechanicsInterface": {
      "type": "object",
      "additionalProperties": false,
      "required": [],
      "properties": {
        "solver_consumption": {
          "type": "string",
          "description": "How the solver consumes the component, e.g. mechanics_geometry_only, mechanics_geometry_and_user_flexibility, curved_bend_macro_element, objective_connector or not_solver_consumed."
        },
        "rule_check_consumption": {
          "type": "string"
        }
      }
    },
    "ComponentModifiers": {
      "description": "User-entered component modifiers with their source reference; no factor is supplied by the software.",
      "type": "object",
      "additionalProperties": false,
      "required": [],
      "properties": {
        "sif_user_value": {
          "$ref": "#/$defs/Quantity"
        },
        "branch_header_sif_user_value": {
          "$ref": "#/$defs/Quantity"
        },
        "branch_branch_sif_user_value": {
          "$ref": "#/$defs/Quantity"
        },
        "sif_in_plane_user_value": {
          "$ref": "#/$defs/Quantity"
        },
        "sif_out_of_plane_user_value": {
          "$ref": "#/$defs/Quantity"
        },
        "flexibility_factor_user_value": {
          "$ref": "#/$defs/Quantity"
        },
        "stiffness_scaling_user_value": {
          "$ref": "#/$defs/Quantity"
        },
        "linear_stiffness_user_value": {
          "$ref": "#/$defs/Quantity"
        },
        "rotational_stiffness_user_value": {
          "$ref": "#/$defs/Quantity"
        },
        "axial_stiffness_user_value": {
          "$ref": "#/$defs/Quantity"
        },
        "lateral_stiffness_user_value": {
          "$ref": "#/$defs/Quantity"
        },
        "angular_stiffness_user_value": {
          "$ref": "#/$defs/Quantity"
        },
        "torsional_stiffness_user_value": {
          "$ref": "#/$defs/Quantity"
        },
        "source_reference": {
          "type": "string"
        }
      }
    },
    "ConnectorEnd": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "node_ref",
        "initial_node_axes_global",
        "offset_local"
      ],
      "properties": {
        "node_ref": {
          "$ref": "#/$defs/Id"
        },
        "initial_node_axes_global": {
          "$ref": "#/$defs/Matrix3"
        },
        "offset_local": {
          "$ref": "#/$defs/VectorQuantity"
        }
      }
    },
    "ConnectorHardware": {
      "oneOf": [
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "kind"
          ],
          "properties": {
            "kind": {
              "type": "string",
              "const": "untied"
            }
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "kind",
            "rods"
          ],
          "properties": {
            "kind": {
              "type": "string",
              "const": "explicit_axial_rods_v1"
            },
            "rods": {
              "type": "array",
              "minItems": 1,
              "items": {
                "$ref": "#/$defs/ConnectorRod"
              }
            }
          }
        }
      ]
    },
    "ConnectorPressureModel": {
      "oneOf": [
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "kind"
          ],
          "properties": {
            "kind": {
              "type": "string",
              "const": "unpressurized"
            }
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "kind",
            "effective_area",
            "pressure_basis",
            "source_reference"
          ],
          "properties": {
            "kind": {
              "type": "string",
              "const": "constant_effective_area_reference_v1"
            },
            "effective_area": {
              "$ref": "#/$defs/Quantity"
            },
            "pressure_basis": {
              "type": "string",
              "const": "internal_differential_zero_external_v1"
            },
            "source_reference": {
              "type": "string",
              "minLength": 1
            }
          }
        }
      ]
    },
    "ConnectorRod": {
      "description": "One explicit elastic axial tie rod.",
      "type": "object",
      "additionalProperties": false,
      "required": [
        "id",
        "law",
        "offset_i",
        "offset_j",
        "stiffness",
        "reference_extension",
        "source_reference"
      ],
      "properties": {
        "id": {
          "type": "string",
          "minLength": 1
        },
        "law": {
          "type": "string",
          "const": "bilateral_linear"
        },
        "offset_i": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "x",
            "y",
            "z"
          ],
          "properties": {
            "x": {
              "$ref": "#/$defs/Quantity"
            },
            "y": {
              "$ref": "#/$defs/Quantity"
            },
            "z": {
              "$ref": "#/$defs/Quantity"
            }
          }
        },
        "offset_j": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "x",
            "y",
            "z"
          ],
          "properties": {
            "x": {
              "$ref": "#/$defs/Quantity"
            },
            "y": {
              "$ref": "#/$defs/Quantity"
            },
            "z": {
              "$ref": "#/$defs/Quantity"
            }
          }
        },
        "stiffness": {
          "$ref": "#/$defs/Quantity"
        },
        "reference_extension": {
          "$ref": "#/$defs/Quantity"
        },
        "source_reference": {
          "type": "string",
          "minLength": 1
        }
      }
    },
    "Constraint": {
      "description": "A typed constraint record (FR-MOD-002) sharing schemas/constraint.schema.json ConstraintRecord's field names and enums, so the design-knowledge layer extends this vocabulary. Data only: no constraint is checked. constraint_kind excludes TBD, equipment_interface (equipment_interfaces) and missing_required_data (an open issue in unresolved_assumptions). target_refs never block a deletion; a missing target is reported. state excludes TBD.",
      "type": "object",
      "additionalProperties": false,
      "required": [
        "constraint_id",
        "name",
        "constraint_kind",
        "state"
      ],
      "properties": {
        "constraint_id": {
          "$ref": "#/$defs/Id"
        },
        "name": {
          "type": "string",
          "pattern": "\\S"
        },
        "constraint_kind": {
          "type": "string",
          "enum": [
            "connectivity",
            "clearance",
            "no_go_volume",
            "support_zone",
            "route_conflict",
            "slope",
            "drain",
            "vent",
            "access"
          ]
        },
        "state": {
          "type": "string",
          "enum": [
            "proposed",
            "active",
            "inactive",
            "superseded",
            "blocked_by_missing_data"
          ]
        },
        "target_refs": {
          "type": "array",
          "uniqueItems": true,
          "items": {
            "$ref": "#/$defs/Id"
          }
        },
        "statement": {
          "type": "string",
          "pattern": "\\S"
        },
        "tags": {
          "$ref": "#/$defs/Tags"
        },
        "notes": {
          "$ref": "#/$defs/Notes"
        },
        "provenance": {
          "type": "string",
          "pattern": "\\S"
        }
      }
    },
    "DataBoundary": {
      "description": "Desktop data-boundary statement, typed by the desktop as Record<string, string>: an object whose values are strings. Known keys: public_examples_policy, protected_source_policy, private_data_policy and professional_boundary (written by the desktop's blank documents) and solver_capacity_claim (written by the UI-foundation fixture generator). The solver ignores it.",
      "type": "object",
      "properties": {
        "public_examples_policy": {
          "type": "string"
        },
        "protected_source_policy": {
          "type": "string"
        },
        "private_data_policy": {
          "type": "string"
        },
        "professional_boundary": {
          "type": "string"
        },
        "solver_capacity_claim": {
          "type": "string"
        }
      },
      "additionalProperties": {
        "type": "string"
      }
    },
    "DesktopDocument": {
      "description": "The desktop's open and save profile: the format plus the members the desktop shape check requires (apps/desktop/src/features/model-file/modelDocumentShape.ts). Documents the desktop writes satisfy it; headless solve requests need only the format.",
      "allOf": [
        {
          "$ref": "model.schema.yaml"
        },
        {
          "type": "object",
          "required": [
            "data_boundary",
            "components",
            "load_cases",
            "diagnostics"
          ],
          "properties": {
            "project": {
              "required": [
                "id",
                "name",
                "description",
                "units"
              ]
            },
            "materials": {
              "type": "array",
              "items": {
                "required": [
                  "id",
                  "label",
                  "provenance"
                ],
                "properties": {
                  "label": {
                    "type": "string"
                  },
                  "provenance": {
                    "type": "string"
                  }
                }
              }
            },
            "sections": {
              "type": "array",
              "items": {
                "required": [
                  "id",
                  "name",
                  "section_type",
                  "provenance"
                ],
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "section_type": {
                    "type": "string"
                  },
                  "provenance": {
                    "type": [
                      "string",
                      "object"
                    ]
                  }
                }
              }
            },
            "nodes": {
              "type": "array",
              "items": {
                "required": [
                  "id",
                  "label",
                  "provenance"
                ],
                "properties": {
                  "label": {
                    "type": "string"
                  },
                  "provenance": {
                    "type": "string"
                  }
                }
              }
            },
            "pipe_segments": {
              "type": "array",
              "items": {
                "required": [
                  "id",
                  "label",
                  "from",
                  "to",
                  "material",
                  "provenance"
                ],
                "properties": {
                  "label": {
                    "type": "string"
                  },
                  "from": {
                    "type": "string"
                  },
                  "to": {
                    "type": "string"
                  },
                  "material": {
                    "type": "string"
