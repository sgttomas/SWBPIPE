{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://openpipestress.org/schemas/rule_pack.schema.yaml",
  "title": "OpenPipeStress Rule-Pack Schema",
  "description": "Strict JSON syntax schema for user-owned rule-pack artifacts. It defines metadata, required inputs, user-defined stress categories, required load cases and load-case mappings, declarative formula slots, user-supplied allowable/value slots, provenance, redistribution status, checksums, diagnostics, and professional-boundary controls. It does not bundle protected standards data, proprietary engineering values, arbitrary executable code, or automatic code-acceptance claims.",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema_version",
    "rule_pack_kind",
    "grammar_version",
    "metadata",
    "classification",
    "required_inputs",
    "formula_declarations",
    "value_slots",
    "required_load_cases",
    "stress_categories",
    "load_case_mappings",
    "check_definitions",
    "diagnostics",
    "checksums",
    "provenance",
    "professional_boundary",
    "open_decisions"
  ],
  "properties": {
    "schema_version": {
      "type": "string",
      "const": "0.5.0",
      "description": "The one current rule-pack format (DEL-06-01 Design rule-pack-0.5.0.md §2.1). Top-level schema_version and metadata.schema_version must both be 0.5.0; any other value is refused by the validator as RULE_PACK_SCHEMA_VERSION_UNSUPPORTED, with no migration."
    },
    "rule_pack_kind": {
      "type": "string",
      "const": "open_pipe_stress_rule_pack"
    },
    "grammar_version": {
      "type": "string",
      "pattern": "^[0-9]+\\.[0-9]+\\.[0-9]+$",
      "description": "Declared expression-grammar version for every declarative-AST formula in this pack (DEC-022). The member sits inside the JCS-canonicalized bytes hashed by rule_pack_checksum, so the reported checksum binds the grammar version. The evaluator blocks undeclared, malformed, or unsupported versions; it never evaluates best-effort."
    },
    "metadata": {
      "$ref": "#/$defs/RulePackMetadata"
    },
    "classification": {
      "$ref": "#/$defs/RulePackClassification"
    },
    "required_inputs": {
      "type": "array",
      "minItems": 1,
      "items": {
        "$ref": "#/$defs/RequiredInput"
      }
    },
    "formula_declarations": {
      "type": "array",
      "minItems": 1,
      "items": {
        "$ref": "#/$defs/FormulaDeclaration"
      }
    },
    "value_slots": {
      "type": "array",
      "minItems": 1,
      "items": {
        "$ref": "#/$defs/UserSuppliedValueSlot"
      }
    },
    "required_load_cases": {
      "type": "array",
      "minItems": 1,
      "items": {
        "$ref": "#/$defs/RequiredLoadCase"
      },
      "description": "The model load cases and combinations the pack's checks are evaluated on (design §2.3). Item ids are unique and no two items name the same basis_ref; every item appears in at least one load-case mapping and is reached by at least one check through its category's mapping (§2.9)."
    },
    "stress_categories": {
      "type": "array",
      "minItems": 1,
      "items": {
        "$ref": "#/$defs/StressCategory"
      },
      "description": "User-defined stress categories (design §2.3). Their names and descriptions are the user's text; the format gives a category no built-in meaning and no fixed list, and this repository carries no category definition of any standard."
    },
    "load_case_mappings": {
      "type": "array",
      "minItems": 1,
      "items": {
        "$ref": "#/$defs/LoadCaseMapping"
      },
      "description": "Per category, the required load cases it uses (design §2.3). Every category has exactly one mapping; a load case may feed more than one category."
    },
    "check_definitions": {
      "type": "array",
      "minItems": 1,
      "items": {
        "$ref": "#/$defs/CheckDefinition"
      }
    },
    "diagnostics": {
      "type": "array",
      "minItems": 1,
      "items": {
        "$ref": "#/$defs/RulePackDiagnostic"
      }
    },
    "checksums": {
      "$ref": "#/$defs/ChecksumSet"
    },
    "provenance": {
      "$ref": "#/$defs/ProvenanceRecord"
    },
    "professional_boundary": {
      "$ref": "#/$defs/ProfessionalBoundary"
    },
    "open_decisions": {
      "type": "array",
      "minItems": 1,
      "items": {
        "$ref": "#/$defs/OpenDecision"
      }
    }
  },
  "$defs": {
    "AnalysisStatus": {
      "type": "string",
      "enum": [
        "MODEL_INCOMPLETE",
        "MECHANICS_SOLVED",
        "RULE_INPUTS_INCOMPLETE",
        "USER_RULE_CHECKED",
        "USER_RULE_FAILED",
        "HUMAN_REVIEW_REQUIRED"
      ]
    },
    "CheckDefinition": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "check_id",
        "name",
        "category_ref",
        "required_input_refs",
        "value_slot_refs",
        "formula_ref",
        "acceptability_basis",
        "result_statuses",
        "diagnostic_policy",
        "provenance"
      ],
      "properties": {
        "check_id": {
          "$ref": "#/$defs/Id"
        },
        "name": {
          "type": "string",
          "minLength": 1
        },
        "description": {
          "type": "string"
        },
        "category_ref": {
          "$ref": "#/$defs/Reference",
          "description": "The check's stress category (ref_type stress_category). The check is evaluated once for each required load case its category's mapping lists, in the mapping's order, with one outcome per basis (design §2.4, §2.7)."
        },
        "required_input_refs": {
          "type": "array",
          "minItems": 1,
          "items": {
            "$ref": "#/$defs/Reference"
          }
        },
        "value_slot_refs": {
          "type": "array",
          "minItems": 1,
          "items": {
            "$ref": "#/$defs/Reference"
          }
        },
        "formula_ref": {
          "$ref": "#/$defs/Reference"
        },
        "acceptability_basis": {
          "type": "string",
          "enum": [
            "user_supplied_rule_pack",
            "owner_design_basis",
            "private_project_basis",
            "invented_non_engineering_example",
            "TBD"
          ]
        },
        "acceptability_relation": {
          "type": "string",
          "enum": [
            "less_than",
            "less_than_or_equal",
            "greater_than",
            "greater_than_or_equal"
          ],
          "description": "Optional top-level acceptability relation comparing the check's computed formula quantity against its user-supplied value-slot limit: the check passes when computed_value <relation> limit_value. Maps to the frozen expression grammar's comparison operators (DEC-022). When absent, the runner uses less_than_or_equal, preserving the historical behaviour of packs authored before this member existed (the sole documented default; the editor authors the member explicitly, so new packs never rely on a silent default). Restricted to the four ordering relations; floating-point equality acceptance is a deliberate non-goal of this member (a boolean-predicate formula can express equality directly if ever required)."
        },
        "result_statuses": {
          "type": "array",
          "minItems": 1,
          "items": {
            "$ref": "#/$defs/AnalysisStatus"
          }
        },
        "diagnostic_policy": {
          "$ref": "#/$defs/DiagnosticPolicy"
        },
        "provenance": {
          "$ref": "#/$defs/ProvenanceRecord"
        }
      }
    },
    "Checksum": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "algorithm",
        "canonicalization",
        "payload_ref",
        "payload_scope",
        "verification_status",
        "value"
      ],
      "properties": {
        "algorithm": {
          "type": "string",
          "enum": [
            "sha256",
            "sha512",
            "TBD"
          ]
        },
        "canonicalization": {
          "type": "string",
          "enum": [
            "JCS",
            "CALLER_SUPPLIED_JCS_BYTES_UNVERIFIED",
            "NONE",
            "TBD"
          ]
        },
        "payload_ref": {
          "$ref": "#/$defs/Reference"
        },
        "payload_scope": {
          "type": "string",
          "enum": [
            "rule_pack_payload",
            "required_input_declaration",
            "formula_declaration",
            "value_slot_declaration",
            "check_definition",
            "provenance_record",
            "non_json_asset_manifest",
            "TBD"
          ]
        },
        "payload_excludes": {
          "type": "array",
          "items": {
            "type": "string",
            "minLength": 1
          },
          "description": "Document members excluded from the hashed payload (R-06-04-006: a checksum identifies what was hashed). A rule_pack_payload-scope checksum excludes exactly the checksums member, since a checksum cannot cover itself."
        },
        "verification_status": {
          "type": "string",
          "enum": [
            "verified",
            "checksum_lifecycle_pending",
            "deferred_to_DEL_06_04",
            "TBD"
          ]
        },
        "value": {
          "type": "string",
          "minLength": 1
        }
      }
    },
    "ChecksumSet": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "rule_pack_checksum",
        "payload_checksums",
        "checksum_lifecycle_status",
        "hash_basis"
      ],
      "properties": {
        "rule_pack_checksum": {
          "$ref": "#/$defs/Checksum"
        },
        "payload_checksums": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/Checksum"
          }
        },
        "checksum_lifecycle_status": {
          "type": "string",
          "enum": [
            "verified",
            "deferred_to_DEL_06_04",
            "TBD"
          ]
        },
        "hash_basis": {
          "type": "string",
          "enum": [
            "Canonical JSON/JCS-compatible",
            "Caller-supplied JCS bytes/unverified",
            "TBD"
          ]
        }
      }
    },
    "CompletenessStatus": {
      "type": "string",
      "enum": [
        "complete",
        "missing_required_value",
        "missing_unit",
        "missing_provenance",
        "missing_redistribution_status",
        "review_pending",
        "TBD"
      ]
    },
    "DiagnosticPolicy": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "rule_check_blocking",
        "missing_input",
        "unit_mismatch",
        "provenance_gap",
        "redistribution_gap",
        "checksum_mismatch",
        "protected_content_suspected",
        "evaluator_error"
      ],
      "properties": {
        "rule_check_blocking": {
          "$ref": "#/$defs/RulePackDiagnosticCode"
        },
        "missing_input": {
          "$ref": "#/$defs/RulePackDiagnosticCode"
        },
        "unit_mismatch": {
          "$ref": "#/$defs/RulePackDiagnosticCode"
        },
        "provenance_gap": {
          "$ref": "#/$defs/RulePackDiagnosticCode"
        },
        "redistribution_gap": {
          "$ref": "#/$defs/RulePackDiagnosticCode"
        },
        "checksum_mismatch": {
          "$ref": "#/$defs/RulePackDiagnosticCode"
        },
        "protected_content_suspected": {
          "$ref": "#/$defs/RulePackDiagnosticCode"
        },
        "evaluator_error": {
          "$ref": "#/$defs/RulePackDiagnosticCode"
        }
      }
    },
    "DimensionId": {
      "type": "string",
      "enum": [
        "dimensionless",
        "length",
        "mass",
        "time",
        "temperature",
        "temperature_interval",
        "angle",
        "rotation",
        "force",
        "moment",
        "pressure",
        "stress",
        "area",
        "volume",
        "density",
        "linear_stiffness",
        "rotational_stiffness",
        "displacement",
        "velocity",
        "acceleration",
        "thermal_conductivity",
        "specific_heat",
        "thermal_expansion_coefficient",
        "second_moment_area",
        "section_modulus",
        "mass_per_length",
        "volume_per_length",
        "slope",
        "TBD"
      ]
    },
    "ExpressionNode": {
      "description": "One node of the frozen DEC-022 declarative expression AST (grammar v1.x), in the node-tagged encoding pinned by fixtures/rule_expressions/conformance_corpus/. Monotone-table, dimension-algebra, and unit-match semantics are enforced by the sandboxed evaluator, not by this schema. The evaluator refusal markers unsupported_form and unsafe_host_access are intentionally not authorable here.",
      "oneOf": [
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "node",
            "quantity"
          ],
          "properties": {
            "node": {
              "const": "literal"
            },
            "quantity": {
              "$ref": "#/$defs/ExpressionQuantity"
            }
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "node",
            "variable_id"
          ],
          "properties": {
            "node": {
              "const": "variable_ref"
            },
            "variable_id": {
              "$ref": "#/$defs/Id"
            }
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "node",
            "operator",
            "operand"
          ],
          "properties": {
            "node": {
              "const": "unary"
            },
            "operator": {
              "type": "string",
              "enum": [
                "negate",
                "abs",
                "not"
              ]
            },
            "operand": {
              "$ref": "#/$defs/ExpressionNode"
            }
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "node",
            "operator",
            "left",
            "right"
          ],
          "properties": {
            "node": {
              "const": "binary"
            },
            "operator": {
              "type": "string",
              "enum": [
                "add",
                "subtract",
                "multiply",
                "divide"
              ]
            },
            "left": {
              "$ref": "#/$defs/ExpressionNode"
            },
            "right": {
              "$ref": "#/$defs/ExpressionNode"
            }
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "node",
            "operator",
            "left",
            "right"
          ],
          "properties": {
            "node": {
              "const": "compare"
            },
            "operator": {
              "type": "string",
              "enum": [
                "less_than",
                "less_than_or_equal",
                "greater_than",
                "greater_than_or_equal",
                "equal",
                "not_equal"
              ]
            },
            "left": {
              "$ref": "#/$defs/ExpressionNode"
            },
            "right": {
              "$ref": "#/$defs/ExpressionNode"
            }
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "node",
            "operator",
            "left",
            "right"
          ],
          "properties": {
            "node": {
              "const": "logical"
            },
            "operator": {
              "type": "string",
              "enum": [
                "and",
                "or"
              ]
            },
            "left": {
              "$ref": "#/$defs/ExpressionNode"
            },
            "right": {
              "$ref": "#/$defs/ExpressionNode"
            }
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "node",
            "condition",
            "then",
            "else"
          ],
          "properties": {
            "node": {
              "const": "select"
            },
            "condition": {
              "$ref": "#/$defs/ExpressionNode"
            },
            "then": {
              "$ref": "#/$defs/ExpressionNode"
            },
            "else": {
              "$ref": "#/$defs/ExpressionNode"
            }
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "node",
            "function",
            "operands"
          ],
          "properties": {
            "node": {
              "const": "aggregate"
            },
            "function": {
              "type": "string",
              "enum": [
                "min",
                "max"
              ]
            },
            "operands": {
              "type": "array",
              "minItems": 1,
              "items": {
                "$ref": "#/$defs/ExpressionNode"
              }
            }
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "node",
            "table",
            "argument"
          ],
          "properties": {
            "node": {
              "const": "interpolate"
            },
            "table": {
              "$ref": "#/$defs/UserTableValue"
            },
            "argument": {
              "$ref": "#/$defs/ExpressionNode"
            }
          }
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "node",
            "table",
            "mode",
            "argument"
          ],
          "properties": {
            "node": {
              "const": "lookup"
            },
            "table": {
              "$ref": "#/$defs/UserTableValue"
            },
            "mode": {
              "type": "string",
              "enum": [
                "exact",
                "step"
              ]
            },
            "argument": {
              "$ref": "#/$defs/ExpressionNode"
            }
          }
        }
      ]
    },
    "ExpressionQuantity": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "value",
        "dimension",
        "unit_ref"
      ],
      "properties": {
        "value": {
          "type": "number"
        },
        "dimension": {
          "$ref": "#/$defs/DimensionId"
        },
        "unit_ref": {
          "type": "string",
          "minLength": 1
        }
      },
      "description": "Literal quantity inside an expression AST. The corpus encoding's optional unit_required / dimension_check_required relaxation flags are deliberately not authorable in pack documents; the evaluator treats absent flags as true."
    },
    "FormulaDeclaration": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "formula_id",
        "formula_kind",
        "declaration_form",
        "expression_language",
        "declaration_payload",
        "arbitrary_code_execution_allowed",
        "protected_content_policy",
        "input_refs",
        "output_dimension",
        "provenance",
        "completeness_status",
        "review_status"
      ],
      "properties": {
        "formula_id": {
          "$ref": "#/$defs/Id"
        },
        "formula_kind": {
          "type": "string",
          "enum": [
            "comparison",
            "ratio",
            "range",
            "lookup_reference",
            "derived_quantity",
            "diagnostic_only",
            "TBD"
          ]
        },
        "declaration_form": {
          "type": "string",
          "enum": [
            "declarative_ast",
            "symbolic_reference",
            "structured_expression",
            "TBD"
          ]
        },
        "expression_language": {
          "type": "string",
          "enum": [
            "TBD",
            "open_pipe_stress_declared_expression"
          ]
        },
        "arbitrary_code_execution_allowed": {
          "type": "boolean",
          "const": false
        },
        "protected_content_policy": {
          "type": "string",
          "enum": [
            "no_protected_text_tables_or_copied_formulas",
            "private_user_owned_reference_only",
            "invented_non_engineering_example_only",
            "TBD"
          ]
        },
        "input_refs": {
          "type": "array",
          "minItems": 1,
          "items": {
            "$ref": "#/$defs/Reference"
          }
        },
        "declaration_payload": {
          "$ref": "#/$defs/FormulaDeclarationPayload"
        },
        "output_dimension": {
          "$ref": "#/$defs/QuantityIntent"
        },
        "provenance": {
          "$ref": "#/$defs/ProvenanceRecord"
        },
        "completeness_status": {
          "$ref": "#/$defs/CompletenessStatus"
        },
        "review_status": {
          "$ref": "#/$defs/ReviewStatus"
        }
      },
      "allOf": [
        {
          "if": {
            "properties": {
              "declaration_form": {
                "const": "declarative_ast"
              }
            },
            "required": [
              "declaration_form"
            ]
          },
          "then": {
            "properties": {
              "expression_language": {
                "const": "open_pipe_stress_declared_expression"
              }
            }
          }
        }
      ]
    },
    "FormulaDeclarationPayload": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "payload_kind",
        "payload_summary",
        "grammar_status",
        "arbitrary_code_execution_allowed",
        "protected_content_policy"
      ],
      "properties": {
        "payload_kind": {
          "type": "string",
          "enum": [
            "declarative_ast",
            "symbolic_reference",
            "structured_expression",
            "TBD"
          ]
        },
        "payload_summary": {
          "type": "string",
          "minLength": 1
        },
        "grammar_status": {
          "type": "string",
          "enum": [
            "frozen_open_pipe_stress_declared_expression",
            "grammar_not_selected",
            "future_human_approved_grammar_required",
            "TBD"
          ]
        },
        "expression_ast": {
          "$ref": "#/$defs/ExpressionNode",
          "description": "Frozen-grammar (DEC-022 v1.x) declarative expression AST in the conformance-corpus node encoding. The blocking refusal markers (unsupported_form, unsafe_host_access) are evaluator vocabulary and are deliberately not authorable in pack documents."
        },
        "arbitrary_code_execution_allowed": {
          "type": "boolean",
          "const": false
        },
        "protected_content_policy": {
          "type": "string",
          "enum": [
            "no_protected_text_tables_or_copied_formulas",
            "private_user_owned_reference_only",
            "invented_non_engineering_example_only",
            "TBD"
          ]
        }
      },
      "allOf": [
        {
          "if": {
            "properties": {
              "payload_kind": {
                "const": "declarative_ast"
              }
            },
            "required": [
              "payload_kind"
            ]
          },
          "then": {
            "required": [
              "expression_ast"
            ],
            "properties": {
              "grammar_status": {
                "const": "frozen_open_pipe_stress_declared_expression"
              }
            }
          }
        }
      ]
    },
    "Id": {
      "type": "string",
      "pattern": "^[A-Za-z][A-Za-z0-9_.:-]*$"
    },
    "OpenDecision": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "decision_id",
        "topic",
        "status",
        "owner",
        "notes"
      ],
      "properties": {
        "decision_id": {
          "$ref": "#/$defs/Id"
        },
        "topic": {
          "type": "string",
          "enum": [
            "expression_grammar",
            "evaluator_library",
            "private_storage_path",
            "private_encryption_default",
            "storage_container",
            "public_example_policy",
            "checksum_library",
            "api_transport",
            "result_envelope_integration",
            "TBD"
          ]
        },
        "status": {
          "type": "string",
          "enum": [
            "open",
            "accepted",
            "rejected",
            "deferred",
            "TBD"
          ]
        },
        "owner": {
          "type": "string",
          "minLength": 1
        },
        "notes": {
          "type": "string"
        }
      }
    },
    "PrivacyClass": {
      "type": "string",
      "enum": [
        "public_schema_only",
        "public_invented_example",
        "private_user_data",
        "private_project_data",
        "quarantined",
        "TBD"
      ]
    },
    "ProfessionalBoundary": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "software_makes_compliance_claim",
