          "$ref": "#/$defs/Id"
        },
        "slot_id": {
          "$ref": "#/$defs/Id"
        }
      }
    },
    "SolverResultRef": {
      "type": "object",
      "additionalProperties": false,
      "description": "The row selector of a solver_result required input (format 0.5.0; design §2.5). For each basis of a check (a required load case mapped to its category), the input binds the one solved-envelope row whose basis_ref equals the basis, whose kind equals result_kind and entity_ref equals entity_ref, and whose metadata.location, metadata.component and section basis (the section_basis= token of metadata.basis) equal the optional members here; an absent optional member matches only a row without that member. tie_rod names one rod of a connector's tie_rods record; a connector_tie_rod_force_v1 row carries its rod only in its id. Rows without basis_ref are never selected. No row (RULE_SOLVER_RESULT_ROW_MISSING) or more than one (RULE_SOLVER_RESULT_ROW_AMBIGUOUS) leaves the input unsupplied on that basis, never a pass; every matched row passes the run's mechanics qualification and per-row binding refusal before its value is used. A solver_result input without this member is a blocking validation finding (RULE_SOLVER_RESULT_REF_MISSING). The 0.4.0 result_id member is removed.",
      "required": [
        "result_kind",
        "entity_ref"
      ],
      "properties": {
        "result_kind": {
          "type": "string",
          "minLength": 1,
          "description": "The envelope row kind."
        },
        "entity_ref": {
          "type": "string",
          "minLength": 1,
          "description": "The envelope row entity_ref (a model entity id)."
        },
        "location": {
          "type": "string",
          "minLength": 1,
          "description": "metadata.location of the row; absent matches only a row without one."
        },
        "component": {
          "type": "string",
          "minLength": 1,
          "description": "metadata.component of the row; absent matches only a row without one."
        },
        "section_basis": {
          "type": "string",
          "enum": [
            "nominal_section",
            "reduced_section"
          ],
          "description": "The section_basis= token of the row's metadata.basis; absent matches only a row without one. A malformed token matches nothing."
        },
        "tie_rod": {
          "$ref": "#/$defs/Id",
          "description": "One rod id of the connector's tie_rods record; absent matches only a row that is not a tie-rod force row."
        }
      }
    },
